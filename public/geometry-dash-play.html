<script>
(function () {
  window.gdInLevel = false;
  window.gdLevelComplete = false; // true only on LEVEL COMPLETE screen for Main/Online levels
  var soundNames = new WeakMap();
  function setInLevel(value) {
    if (window.gdInLevel === value) return;
    window.gdInLevel = value;
    window.dispatchEvent(new Event('gd-inlevel'));
  }
  function setLevelComplete(value) {
    if (window.gdLevelComplete === value) return;
    window.gdLevelComplete = value;
    if (value) window.dispatchEvent(new Event('gd-levelcomplete'));
    else window.dispatchEvent(new Event('gd-levelcomplete-exit'));
  }
  var prototype = window.AudioBufferSourceNode && window.AudioBufferSourceNode.prototype;
  if (!prototype || typeof prototype.start !== 'function') return;
  var original = prototype.start;
  if (original.__gdInLevelInstrumented) return;
  var wrapped = function () {
    try {
      var buffer = this.buffer;
      if (buffer) {
        var name;
        if (soundNames.has(buffer)) {
          name = soundNames.get(buffer);
        } else {
          var audio = window.Module && window.Module.__gdAudio;
          var sounds = audio && audio.sounds;
          var soundIds = sounds ? Object.keys(sounds) : [];
          name = '';
          for (var i = 0; i < soundIds.length; i++) {
            var sound = sounds[soundIds[i]];
            if (sound && sound.buf === buffer && typeof sound.name === 'string') {
              name = sound.name.replace(/^.*[\\/]/, '').toLowerCase();
              break;
            }
          }
          if (name) soundNames.set(buffer, name);
        }
        if (name === 'playsound_01.ogg') {
          setInLevel(true);
          setLevelComplete(false); // starting a level clears level complete
        } else if (name === 'quitsound_01.ogg' || name === 'menuloop.mp3') {
          setInLevel(false);
          setLevelComplete(false); // leaving to menu clears level complete
        } else if (name === 'endstart_02.ogg') {
          // Level complete sound plays ONLY on Main/Online level completion (not editor)
          setLevelComplete(true);
        }
      }
    } catch (e) {}
    return original.apply(this, arguments);
  };
  wrapped.__gdInLevelInstrumented = true;
  prototype.start = wrapped;
})();
</script>

      keyEv('keydown', '', ch, v.charCodeAt(s + i));
      keyEv('keyup', '', ch, v.charCodeAt(s + i));
    }
    prev = v;
    if (v.length > 200) { field.value = v.slice(-100); prev = field.value; }
  });
  field.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      keyEv('keydown', 'Enter', 'Enter', 13);
      setTimeout(function () { keyEv('keyup', 'Enter', 'Enter', 13); }, 40);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      field.blur();
    }
    /* Backspace arrives through the input diff above */
  });
  field.addEventListener('blur', function () { prev = field.value = ''; });
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    field.focus({ preventScroll: true });
    btn.blur();
  });

  /* The keyboard is only needed in menus; hide it during a run. The
     gd-inlevel event is dispatched by the existing audio instrumentation; the
     slow interval is only a fallback if that instrumentation is unavailable. */
  function watchInLevel(el, visibleInLevel) {
    var seen = false;
    function sync() { el.classList.toggle('on', window.gdInLevel === visibleInLevel); }
    window.addEventListener('gd-inlevel', function () { seen = true; sync(); });
    sync();
    var iv = setInterval(function () {
      if (seen) { clearInterval(iv); return; }
      sync();
    }, 1500);
  }
  window.__gdWatchInLevel = watchInLevel;
  watchInLevel(btn, false);
})();</script>
<script>(function () {
  'use strict';
  /* A lost WebGL context cannot be restored by the game. Report it like other
     crashes and leave recovery to the user instead of reloading automatically. */
  var canvas = document.getElementById('canvas');
  var reported = false;
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    if (reported) return;
    reported = true;
    var overlay = document.getElementById('errOverlay');
    if (overlay) {
      overlay.textContent = 'The game lost its WebGL context, so the browser can no longer render it. ' +
        'This can happen when graphics memory runs low or the tab is suspended. Reload the page to recover; ' +
        'saved progress may be restored, but the current run may be lost. Open with ?debug to see logs.';
      overlay.classList.add('on');
    }
    if (!window.__gdRuntimeReady || typeof performSave !== 'function') return;
    try {
      Promise.resolve(performSave()).catch(function (err) {
        console.error('Failed to save after WebGL context loss:', err);
      });
    } catch (err) {
      console.error('Failed to save after WebGL context loss:', err);
    }
  });
})();</script>
<script>(function () {
  'use strict';
  /* Fullscreen on Android: keep the screen awake during a level and ask for
     landscape. Both APIs are no-ops or rejected where unsupported, so every
     call is guarded. The wake lock is dropped whenever the page is hidden and
     re-requested on the next gesture/focus, which is how the platform expects
     it to be used. */

  var orientationLocked = false;
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function requestWake() {
    if (!navigator.wakeLock || wake || !isFullscreen()) return;
    try {
      navigator.wakeLock.request('screen').then(function (lock) {
        wake = lock;
        lock.addEventListener('release', function () { wake = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  function dropWake() {
    if (!wake) return;
    try { wake.release(); } catch (e) {}
    wake = null;
  }
  function lockLandscape() {
    if (orientationLocked || !isFullscreen()) return;
    if (!screen.orientation || !screen.orientation.lock) return;
    try {
      var p = screen.orientation.lock('landscape');
      if (p && p.then) p.then(function () { orientationLocked = true; }).catch(function () {});
      else orientationLocked = true;
    } catch (e) {}
  }
  function unlockOrientation() {
    if (!orientationLocked) return;
    try { screen.orientation.unlock(); } catch (e) {}
    orientationLocked = false;
  }
  function sync() {
    if (isFullscreen()) { requestWake(); lockLandscape(); }
    else { dropWake(); unlockOrientation(); }
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (name) {
    document.addEventListener(name, sync);
  });
  document.addEventListener('visibilitychange', function () {
    /* the platform releases the wake lock when hidden; take it again on return */
    if (!document.hidden) sync();
  });
  document.addEventListener('pointerdown', function () { if (isFullscreen()) sync(); }, true);
})();</script>
