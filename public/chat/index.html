<title>Budsin Chat</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#e3e5e8;--surface:#ffffff;--side:#f2f3f5;--line:#e1e2e4;--line2:#ebedef;
  --text:#313338;--muted:#5c5e66;--accent:#5865f2;--accent-ink:#fff;--accent-soft:#d7d9dc;
  --mention:rgba(250,168,26,.12);--mention-bar:#f0b232;--danger:#d83c3e;--ok:#248046;--hover:rgba(116,124,138,.12);
  --shadow:0 8px 16px rgba(0,0,0,.16);
  --font:"gg sans","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1f22;--surface:#313338;--side:#2b2d31;--line:#1e1f22;--line2:#3f4147;
  --text:#f2f3f5;--muted:#949ba4;--accent:#5865f2;--accent-ink:#fff;--accent-soft:#404249;
  --mention:rgba(250,168,26,.1);--mention-bar:#f0b232;--danger:#f23f43;--ok:#23a55a;--hover:rgba(78,80,88,.3);
  --shadow:0 8px 16px rgba(0,0,0,.24);}}
:root[data-theme="dark"]{
  --bg:#1e1f22;--surface:#313338;--side:#2b2d31;--line:#1e1f22;--line2:#3f4147;
  --text:#f2f3f5;--muted:#949ba4;--accent:#5865f2;--accent-ink:#fff;--accent-soft:#404249;
  --mention:rgba(250,168,26,.1);--mention-bar:#f0b232;--danger:#f23f43;--ok:#23a55a;--hover:rgba(78,80,88,.3);
  --shadow:0 8px 16px rgba(0,0,0,.24);}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.375 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.ic.sm{width:15px;height:15px}
#app{display:grid;grid-template-columns:248px 1fr;height:100%}

/* ---------- barra lateral ---------- */
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:9px;padding:14px 16px 4px}
.ws .mark{width:24px;height:24px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.ws b{font-weight:600;font-size:15px}
.back{display:block;padding:2px 16px 10px;color:var(--muted);text-decoration:none;font-size:12.5px}
.back:hover{color:var(--text);text-decoration:underline}
#rooms{flex:1;overflow:auto;padding:2px 8px 10px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 6px 3px;font-size:12px;font-weight:600;color:var(--muted)}
.sec button{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:4px;display:grid;place-items:center;padding:0}
.sec button:hover{background:var(--hover);color:var(--text)}
.room{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border:0;border-radius:5px;background:none;text-align:left;color:var(--muted)}
.room:hover{background:var(--hover);color:var(--text)}
.room.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.room.unread{color:var(--text);font-weight:600}
.room .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .c{font-size:11.5px;color:var(--muted);font-weight:400}
.room .av{width:20px;height:20px;border-radius:50%;font-size:12px}
.badge{min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.badge.mention{background:var(--danger);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:var(--ok)}
.item{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:5px;color:var(--muted)}
.item .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mini{margin-left:auto}
.hint{padding:4px 8px;color:var(--muted);font-size:12.5px;line-height:1.4}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:24px;height:24px;padding:0;display:grid;place-items:center;font-size:12px}
.mini.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#meBar{border-top:1px solid var(--line);padding:8px}
#me{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:6px;padding:5px 6px;text-align:left}
#me:hover{background:var(--hover)}
#me .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}

/* ---------- avatares planos ---------- */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;flex:none;user-select:none}

/* ---------- zona principal ---------- */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;background:var(--surface)}
#top{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 16px;border-bottom:1px solid var(--line);flex:none}
#menuBtn{display:none}
#title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#sub{color:var(--muted);font-size:12.5px;white-space:nowrap}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11.5px;color:var(--muted);height:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#top .sp{flex:1}
.ib{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:6px;display:grid;place-items:center;padding:0}
.ib:hover{background:var(--hover);color:var(--text)}.ib[hidden]{display:none}
.ib.has{color:var(--accent)}
#pinbar{border-bottom:1px solid var(--line);background:var(--accent-soft);padding:6px 16px;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;flex:none}
#pinbar[hidden]{display:none}#pinbar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pinbar b{font-weight:600}
#msgs{flex:1;overflow-y:auto;padding:6px 0 4px;position:relative}
.empty{padding:40px 16px;color:var(--muted);text-align:center}
.intro{padding:14px 16px 6px;color:var(--muted);font-size:12.5px}
.more{display:block;margin:6px auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:4px 12px;font-size:12.5px}
.day,.newdiv{position:relative;text-align:center;margin:14px 16px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.day::before,.newdiv::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line2)}
.day span,.newdiv span{position:relative;background:var(--surface);padding:0 10px}
.newdiv{color:var(--danger)}.newdiv::before{border-color:var(--danger);opacity:.55}

/* ---------- mensajes ---------- */
.msg{position:relative;display:grid;grid-template-columns:68px 1fr;padding:2px 16px 2px 0}
.msg:not(.cont){margin-top:10px}
.msg:hover{background:var(--hover)}
.msg .av{margin-left:16px;margin-top:2px}
.msg .gt{position:absolute;left:0;top:5px;width:64px;text-align:right;font-size:11px;color:var(--muted);display:none}
.msg:hover .gt{display:block}
.msg.mention{background:var(--mention);box-shadow:inset 3px 0 var(--mention-bar)}
.msg.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--mention)}100%{background:transparent}}
.body{min-width:0}
.who{display:flex;align-items:baseline;gap:7px;line-height:1.3}
.who b{font-weight:600}.who b.uname{cursor:pointer}.who b.uname:hover{text-decoration:underline}
.msg.mine .who b{color:var(--accent)}
:root[data-theme="dark"] .msg.mine .who b{color:#9ea6ff}
.who time,.etag{font-size:11.5px;color:var(--muted);font-weight:400}
.txt a.lnk{color:var(--accent,#4f8cff);text-decoration:underline;text-underline-offset:2px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.mn{background:var(--mention);border-radius:3px;padding:0 2px;font-weight:500}
.mn.me{font-weight:700}
.quote{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin:0 0 2px;cursor:pointer;max-width:560px}
.quote b{color:var(--text);font-weight:600;white-space:nowrap}.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quote.gone{font-style:italic;cursor:default}
.ht{position:absolute;top:-15px;right:16px;display:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:2px;gap:1px;z-index:3}
.msg:hover .ht,.msg:focus-within .ht{display:flex}
.ht button{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:4px;display:grid;place-items:center;padding:0}
.ht button:hover{background:var(--hover);color:var(--text)}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:inline-flex;align-items:center;gap:5px;font-size:13px}
.rx small{font-size:12px;color:var(--muted);font-weight:600}
.rx.me{border-color:var(--accent);background:var(--accent-soft)}.rx.me small{color:var(--accent)}
.rx:hover{border-color:var(--muted)}

/* ---------- multimedia ---------- */
.mimg{position:relative;display:inline-block;margin-top:4px;border-radius:6px;overflow:hidden;max-width:min(320px,100%);cursor:zoom-in;border:1px solid var(--line);background:var(--line2)}
.mimg img{display:block;max-width:100%;max-height:320px;width:auto;height:auto}
.mimg.blur img,.stk.blur img{filter:blur(24px) brightness(.85)}.mimg.blur,.stk.blur{cursor:pointer}
.veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;padding:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:pointer}
.blur .veil{display:flex}
.stk{margin-top:4px;position:relative;display:inline-block}.stk img{width:132px;height:132px;object-fit:contain;display:block}
.stk .save{position:absolute;right:0;top:0;border:1px solid var(--line);background:var(--surface);border-radius:5px;width:26px;height:26px;opacity:0;padding:0;display:grid;place-items:center;color:var(--text)}.stk:hover .save{opacity:1}
.pst{font-size:64px;line-height:1.15;margin-top:2px}
.aud{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:6px 12px 6px 6px;margin-top:4px;width:min(300px,100%);background:var(--surface)}
.aud button{border:0;background:var(--accent);color:var(--accent-ink);width:32px;height:32px;border-radius:6px;padding:0;display:grid;place-items:center;flex:none}
.aud .bar{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;cursor:pointer}.aud .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--accent)}
.aud time{font-size:12px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.trk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:4px;width:min(340px,100%);background:var(--surface)}
.trk img{width:48px;height:48px;border-radius:5px;object-fit:cover;background:var(--line2);flex:none}
.trk .ti{min-width:0;flex:1}.trk .ti small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.trk .ti b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trk .ti span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk button,.trk a{border:1px solid var(--line);background:var(--surface);color:var(--text);width:32px;height:32px;border-radius:6px;display:grid;place-items:center;padding:0;text-decoration:none;flex:none}
.trk button{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hid{margin-top:4px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:6px 10px;display:inline-block}
.gonemsg{font-style:italic;color:var(--muted)}

/* ---------- escribiendo, ir al final, redactar ---------- */
#jump{position:absolute;right:22px;bottom:104px;z-index:4;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:16px;height:30px;padding:0 12px 0 8px;display:none;align-items:center;gap:4px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
#jump.on{display:inline-flex}
#typing{height:20px;padding:0 18px;font-size:12.5px;color:var(--muted);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#composer{padding:0 16px 14px;flex:none;position:relative}
#composer .box{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
#composer .box:focus-within{border-color:var(--accent)}
#ctx{display:none;align-items:center;gap:8px;padding:6px 10px;background:var(--hover);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
#ctx.on{display:flex}#ctx .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ctx b{color:var(--text);font-weight:600}
#row{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 4px}
.tool{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:6px;display:grid;place-items:center;padding:0;flex:none}
.tool:hover{background:var(--hover);color:var(--text)}.tool[hidden]{display:none}.tool:disabled{opacity:.4;cursor:default}
#in{flex:1;min-width:0;border:0;background:transparent;padding:8px 6px;outline:none}
#go{border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:600;height:32px;padding:0 14px;display:flex;align-items:center;gap:6px}
#go:disabled{opacity:.4;cursor:default}
#cnt{min-height:18px;font-size:12px;color:var(--muted);padding:3px 2px 0}#cnt.err{color:var(--danger)}
#rec{flex:1;display:none;align-items:center;gap:10px;padding:2px 8px}#rec.on{display:flex}
#rec .dotr{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
#rec audio{height:32px;flex:1;min-width:0}#rec .t{flex:1;font-variant-numeric:tabular-nums}
#rec button{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:30px;padding:0 12px;font-weight:600}
#ment{position:absolute;left:62px;bottom:62px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px;display:none;z-index:25}
#ment.on{display:block}#ment button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:5px}
#ment button.sel,#ment button:hover{background:var(--accent-soft)}

/* ---------- paneles, menús, avisos ---------- */
#panel{position:absolute;left:16px;bottom:66px;width:min(344px,calc(100% - 32px));max-height:min(380px,60vh);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:25;display:none;flex-direction:column;overflow:hidden}
#panel.on{display:flex}
#panel .tabs{display:flex;gap:2px;padding:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
#panel .tabs button{border:0;background:none;border-radius:5px;padding:5px 10px;white-space:nowrap;color:var(--muted);font-size:13px}
#panel .tabs button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
#panel .grid{padding:8px;overflow-y:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#panel .grid.big{grid-template-columns:repeat(4,1fr)}
#panel .grid button{border:0;background:none;border-radius:6px;aspect-ratio:1;padding:0;font-size:1.5rem;position:relative;display:grid;place-items:center}
#panel .grid.big button{font-size:2.1rem}
#panel .grid button:hover{background:var(--hover)}
#panel .grid img{width:100%;height:100%;object-fit:contain;border-radius:5px}
#panel .grid .x{position:absolute;right:1px;top:1px;width:20px;height:20px;border-radius:4px;background:var(--surface);border:1px solid var(--line);display:none;place-items:center}
#panel .grid button:hover .x{display:grid}
#panel .grid .add{border:1px dashed var(--line);color:var(--accent)}
#panel .note{padding:8px 12px;color:var(--muted);font-size:12.5px;line-height:1.4}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:190px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px}
.menu button:hover{background:var(--hover)}.menu button.danger{color:var(--danger)}
.menu .h{padding:6px 10px 4px;color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.menu .emo{display:flex;gap:2px;padding:2px}.menu .emo button{width:34px;height:34px;justify-content:center;padding:0;font-size:1.2rem}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:13px;z-index:80;display:none;max-width:90vw}
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:6px}

/* ---------- pantallas de entrada y cuadros ---------- */
#gate{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate.on{display:flex}
.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font-size:18px;font-weight:600}
.card p{margin:0;color:var(--muted);line-height:1.5}
.btn{border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 16px}
.btn.ghost{background:none;border-color:var(--line);color:var(--text);font-weight:500}
.field{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;outline:none}.field:focus{border-color:var(--accent)}

.av.photo{background:var(--line2);overflow:hidden}.av.photo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
#avs button.photo{padding:0;overflow:hidden}#avs button.photo img{width:100%;height:100%;object-fit:cover;display:block}
#avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#avs button{aspect-ratio:1;border-radius:8px;border:2px solid transparent;display:grid;place-items:center;font-size:1.4rem;padding:0}
#avs button.on{border-color:var(--text)}
.error{color:var(--danger);font-size:13px;min-height:1.2em}
.dest{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto}
.dest button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 12px;text-align:left;display:flex;gap:9px;align-items:center}.dest button:hover{background:var(--hover)}
.row2{display:flex;gap:8px}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 22% 0 0;z-index:30;transform:translateX(-102%);transition:transform .18s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #menuBtn{display:grid}
  .msg{grid-template-columns:56px 1fr}.msg .av{margin-left:10px}.msg .gt{width:52px}
  #composer{padding:0 10px 10px}
  #jump{right:14px}
  .ht{right:8px}
}
body.has-bmmini #app{height:calc(100% - 92px)}
#bm-mini:not(.bm-game){bottom:10px!important}
</style>
</head>

    if (md.kind === 'sticker' && !mine) { var sv = el('button', 'save'); sv.innerHTML = icon('save', 'sm'); sv.title = T.saveSt; sv.addEventListener('click', function (e) { e.stopPropagation(); wsend({ t: 'sticker.save', id: md.id }); toast(T.saveSt); }); wrap.appendChild(sv); }
    return wrap;
  }

    var pb = el('button'); pb.type = 'button'; pb.innerHTML = icon('play'); var bar = el('div', 'bar'); var fill = el('i'); bar.appendChild(fill); var tm = el('time', null, fmtDur(md.dur));
    pb.addEventListener('click', function () { if (au.paused) { document.querySelectorAll('.aud button').forEach(function (b) { if (b !== pb && b._stop) b._stop(); }); au.play().catch(function () {}); } else au.pause(); });
    pb._stop = function () { au.pause(); };
    au.addEventListener('play', function () { pb.innerHTML = icon('pause'); pb.setAttribute('data-p', '1'); }); au.addEventListener('pause', function () { pb.innerHTML = icon('play'); pb.removeAttribute('data-p'); });
    au.addEventListener('ended', function () { pb.innerHTML = icon('play'); fill.style.width = '0'; tm.textContent = fmtDur(md.dur); });
    au.addEventListener('timeupdate', function () { var d = au.duration || md.dur || 1; fill.style.width = Math.min(100, au.currentTime / d * 100) + '%'; tm.textContent = fmtDur(au.currentTime); });
    bar.addEventListener('click', function (e) { var r = bar.getBoundingClientRect(), d = au.duration || md.dur; if (d && isFinite(d)) au.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d; });

function openLightbox(src) { var lb = $('#lb'); lb.querySelector('img').src = src; lb.classList.add('on'); }

function setBusy(on) { var c = $('#cnt'); if (on) { c.className = ''; c.textContent = T.uploading; } else if (c.textContent === T.uploading) c.textContent = ''; }
function mediaErr(code, retry) { var msg = errText(code); if (code === 'media_rate' && retry) msg += ' (' + Math.ceil(retry / 1000) + ' s)'; flashCount(msg); }
function uploadFile(kind, blob, roomKey) {

  setBusy(true);
  return S.user.getIdToken().then(function (tok) { return fetch('/api/chat/upload?kind=' + kind + '&room=' + encodeURIComponent(roomKey || ''), { method: 'POST', headers: { Authorization: 'Bearer ' + tok }, body: blob }); })
    .then(function (r) { return r.json().catch(function () { return { error: 'server_error' }; }).then(function (j) { if (!r.ok || j.error) { var e = new Error(j.error || 'server_error'); e.retry = j.retry; throw e; } return j; }); })
    .finally(function () { setBusy(false); });
}
function sendImageFile(file) {

}

$('#fileStk').addEventListener('change', function () { var f = this.files[0]; if (!f) return; if (f.size > 5000000) { mediaErr('media_too_large'); return; } uploadFile('sticker', f, '').then(function () { wsend({ t: 'sticker.list' }); toast(T.createSt); }).catch(function (e) { mediaErr(e.message, e.retry); }); });

function closePanel() { $('#panel').classList.remove('on'); }

var REC = { mr: null, chunks: [], stream: null, t0: 0, iv: null, blob: null, type: '' };
function micAvailable() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function recReset() { clearInterval(REC.iv); if (REC.stream) REC.stream.getTracks().forEach(function (t) { t.stop(); }); REC.mr = null; REC.stream = null; REC.chunks = []; REC.blob = null; $('#rec').classList.remove('on'); $('#recA').hidden = true; $('#recA').removeAttribute('src'); $('#recSend').hidden = true; $('#recStop').hidden = false; $('#in').style.display = ''; $('#go').style.display = ''; $('#recT').hidden = false; }
function recStop() { if (REC.mr && REC.mr.state !== 'inactive') REC.mr.stop(); }
$('#bMic').addEventListener('click', function () {
  if (!micAvailable()) { toast(T.micDenied); return; }
  var kind = cur().kind; if (kind !== 'dm' && kind !== 'class') { toast(T.voiceOnly); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    REC.stream = stream; REC.chunks = [];
    var type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].filter(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0] || '';
    REC.type = type; REC.mr = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
    REC.mr.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
    REC.mr.onstop = function () {
      clearInterval(REC.iv); REC.stream && REC.stream.getTracks().forEach(function (t) { t.stop(); });
      REC.blob = new Blob(REC.chunks, { type: REC.mr.mimeType || REC.type || 'audio/webm' });
      $('#recA').src = URL.createObjectURL(REC.blob); $('#recA').hidden = false; $('#recT').hidden = true; $('#recStop').hidden = true; $('#recSend').hidden = false; $('#recSend').textContent = T.sendVoice;
    };
    REC.mr.start(); REC.t0 = Date.now(); $('#in').style.display = 'none'; $('#go').style.display = 'none'; $('#rec').classList.add('on');
    REC.iv = setInterval(function () { var s = (Date.now() - REC.t0) / 1000; $('#recT').textContent = T.rec + ' ' + fmtDur(s); if (s >= 30) recStop(); }, 250);
  }).catch(function () { toast(T.micDenied); });
});
$('#recStop').addEventListener('click', recStop);
$('#recCancel').addEventListener('click', function () { if (REC.mr && REC.mr.state !== 'inactive') { REC.mr.onstop = null; REC.mr.stop(); } recReset(); });
$('#recSend').addEventListener('click', function () {
  if (!REC.blob) return; var key = S.cur || 'global', blob = REC.blob; recReset();
  uploadFile('audio', blob, key).then(function (j) { wsend({ t: 'send', room: key, media: j.id, text: '', cid: 'a' + Date.now() }); }).catch(function (e) { mediaErr(e.message, e.retry); });
});

function readShare() { try { var o = JSON.parse(localStorage.getItem('bc_share') || 'null'); if (o && o.track && Date.now() - o.t < 15 * 60000) return o.track; } catch (e) {} return null; }
