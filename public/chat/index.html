<title>Budsin Chat</title>
<style>
:root{color-scheme:dark;--bg:#121212;--panel:#181818;--card:#1f1f1f;--line:rgba(255,255,255,.09);--text:#fff;--muted:#a7a7a7;--accent:#25d0b4;--danger:#ff6b6b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:260px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:800;font-size:1.1rem}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#25d0b4,#1fa7d8);display:grid;place-items:center;font-style:normal}
.back{margin:0 16px 8px;color:var(--muted);text-decoration:none;font-size:.82rem}
.back:hover{color:#fff}
#rooms{overflow:auto;padding:6px 8px 16px;flex:1}
.sec{margin:14px 10px 6px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.room{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;text-align:left}
.room:hover{background:rgba(255,255,255,.06)}.room.on{background:rgba(37,208,180,.16)}
.room .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room .c{font-size:.72rem;color:var(--muted)}
.hint{margin:6px 10px;color:var(--muted);font-size:.8rem;line-height:1.4}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#menuBtn{display:none;border:0;background:none;font-size:1.3rem;padding:4px 8px}
#title{font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#sub{color:var(--muted);font-size:.8rem;white-space:nowrap}
#top .sp{flex:1}
#me{display:flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;flex:none}
#state{width:9px;height:9px;border-radius:50%;background:#777}#state.ok{background:#3ddc84}#state.bad{background:var(--danger)}
#msgs{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:10px;padding:5px 8px;border-radius:10px;position:relative}
.msg:hover{background:rgba(255,255,255,.04)}.msg .av{margin-top:2px}
.body{min-width:0}.who{display:flex;gap:8px;align-items:baseline}.who b{font-size:.9rem}.who time{color:var(--muted);font-size:.7rem}
.txt{overflow-wrap:anywhere;line-height:1.4;white-space:pre-wrap}
.msg.mine .who b{color:var(--accent)}
.uname{cursor:pointer}.uname:hover{text-decoration:underline}
.mini{border:0;background:rgba(255,255,255,.1);border-radius:50%;width:24px;height:24px;padding:0;line-height:1;margin-left:4px}.mini.ok{background:var(--accent);color:#000}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}.dot.on{background:#3ddc84}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.room .av{width:22px;height:22px;font-size:.8rem}
.rep{position:absolute;right:8px;top:2px;border:0;background:var(--card);border-radius:8px;padding:2px 8px;font-size:.8rem;opacity:0;color:var(--muted)}
.msg:hover .rep,.rep:focus{opacity:1}
.more{align-self:center;border:0;background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;margin-bottom:8px;font-size:.8rem}
.sys{align-self:center;color:var(--muted);font-size:.8rem;margin:8px 0}
#composer{display:flex;flex-wrap:wrap;gap:8px;padding:10px 70px 14px 14px;border-top:1px solid var(--line);background:var(--panel)}
#in{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;color:inherit;padding:11px 16px;font:inherit;outline:none}
#in:focus{border-color:var(--accent)}
#go{border:0;border-radius:999px;background:var(--accent);color:#000;font-weight:800;padding:0 20px}
#go:disabled{opacity:.4;cursor:default}
#cnt{width:100%;font-size:.72rem;color:var(--muted);padding-left:16px;min-height:1em}#cnt.err{color:var(--danger)}
#gate{position:absolute;inset:0;z-index:5;background:rgba(18,18,18,.97);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate.on{display:flex}
.card{width:min(460px,100%);background:var(--card);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.card h1{margin:0;font-size:1.4rem}.card p{margin:0;color:var(--muted);line-height:1.5}
.btn{border:0;border-radius:999px;background:var(--accent);color:#000;font-weight:800;padding:12px 20px;letter-spacing:.03em}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:inherit;padding:12px 14px;font:inherit;width:100%;outline:none}.field:focus{border-color:var(--accent)}
#avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#avs button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;font-size:1.4rem;padding:0}
#avs button.on{border-color:#fff}
.error{color:var(--danger);font-size:.85rem;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.85rem;z-index:30;display:none;max-width:90vw}
.menu{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;border-radius:8px}.menu button:hover{background:rgba(255,255,255,.08)}
.menu .h{padding:6px 14px;color:var(--muted);font-size:.75rem}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-102%);transition:transform .2s;width:auto;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #side.open{transform:none}
  #menuBtn{display:block}
  #composer{padding-right:64px}
  #me span{display:none}#me{padding:4px}
}
</style>
</head>

    var row = el('div', 'room'); row.appendChild(avatar(u.avatar)); row.appendChild(el('span', 'n', u.username || '?'));
    var ok = el('button', null, '✓'); ok.title = T.sendReq; ok.className = 'mini ok'; ok.addEventListener('click', function () { wsend({ t: 'friend.accept', uid: u.uid }); });
    var no = el('button', null, '✗'); no.className = 'mini'; no.addEventListener('click', function () { wsend({ t: 'friend.decline', uid: u.uid }); });
    row.appendChild(ok); row.appendChild(no); box.appendChild(row);
  });
  S.friends.forEach(function (f) {
    var b = el('button', 'room' + (S.cur === f.room ? ' on' : '')); var a = avatar(f.avatar); b.appendChild(a);
    b.appendChild(el('span', 'n', f.username || '?')); var dot = el('span', 'dot' + (f.online ? ' on' : '')); b.appendChild(dot);
    if (S.unread[f.room]) b.appendChild(el('span', 'badge', String(S.unread[f.room])));
    b.addEventListener('click', function () { openRoom(f.room, f.username); }); box.appendChild(b);
  });
  S.outgoing.forEach(function (u) { var row = el('div', 'room'); row.appendChild(el('span', null, '⏳')); row.appendChild(el('span', 'n', (u.username || '?') + ' · ' + T.pending)); var no = el('button', null, '✗'); no.className = 'mini'; no.addEventListener('click', function () { wsend({ t: 'friend.decline', uid: u.uid }); }); row.appendChild(no); box.appendChild(row); });
  var fb = el('button', 'room'); fb.appendChild(el('span', null, '＋')); fb.appendChild(el('span', 'n', T.addFriend)); fb.id = 'addFriendBtn'; fb.addEventListener('click', function () { gate('friendAdd'); }); box.appendChild(fb);
  box.appendChild(el('div', 'sec', T.games));
  var seen = {};
  S.gameRooms.forEach(function (g) { seen[g.key] = 1; add(g.key, g.name, '🎮', g.online); });
  Object.keys(S.rooms).forEach(function (k) { if (k.indexOf('game:') === 0 && !seen[k]) add(k, S.rooms[k].name, '🎮', S.rooms[k].online); });
  if (!S.gameRooms.length && !Object.keys(S.rooms).some(function (k) { return k.indexOf('game:') === 0; })) box.appendChild(el('div', 'hint', T.gamesNone));
}
function renderTop() {
  var r = room(S.cur || 'global');
  $('#title').textContent = r.kind === 'dm' ? '💬 ' + T.dmWith + ' ' + r.name : r.kind === 'game' ? T.gameRoom + ' ' + r.name : (r.key === 'global' ? T.global : r.name);
  $('#sub').textContent = r.online ? r.online + ' ' + T.online : '';
  $('#manage').hidden = r.kind !== 'class' && r.kind !== 'dm';
  $('#manageT').textContent = r.kind === 'dm' ? '⋯' : T.manage;
}
function classMenuRender() {
  var list = $('#memList'); if (!list || !S.cur) return;
  var d = S.members[S.cur]; if (!d) return; list.textContent = '';
  d.items.forEach(function (u) {
    var row = el('div', 'h'); row.style.cssText = 'display:flex;gap:8px;align-items:center;color:#fff'; row.appendChild(avatar(u.avatar)); row.appendChild(el('span', null, (u.username || '?') + (u.uid === d.owner ? ' ⭐' : '')));
    if (S.me && d.owner === S.me.uid && u.uid !== S.me.uid) { var k = el('button', null, T.kick); k.style.cssText = 'width:auto;margin-left:auto;padding:2px 8px;font-size:.75rem'; k.addEventListener('click', function (e) { e.stopPropagation(); wsend({ t: 'class.kick', room: S.cur, uid: u.uid }); row.parentNode.removeChild(row); }); row.appendChild(k); }
    list.appendChild(row);
  });
}
function classInfo(key) { return S.classes.filter(function (c) { return c.key === key; })[0] || null; }
function shareLink(code) { return location.origin + '/chat/#/class/' + code; }
function copy(text) { try { navigator.clipboard.writeText(text).then(function () { toast(T.copied); }, function () {}); } catch (e) {} }
$('#manage').addEventListener('click', function (e) {
  e.stopPropagation(); closeMenu();
  var cur = room(S.cur || 'global');
  if (cur.kind === 'dm') {
    var dmenu = el('div', 'menu'); dmenu.style.minWidth = '220px';
    var dadd = function (t, fn) { var b = el('button', null, t); b.addEventListener('click', function () { closeMenu(); fn(); }); dmenu.appendChild(b); };
    dadd('➖ ' + T.removeFriend, function () { if (confirm(T.removeAsk)) wsend({ t: 'friend.remove', uid: cur.peer }); });
    dadd('🚫 ' + T.blockUser, function () { if (confirm(T.blockAsk)) wsend({ t: 'block', uid: cur.peer }); });
    document.body.appendChild(dmenu); var dr = this.getBoundingClientRect(); dmenu.style.top = (dr.bottom + 6) + 'px'; dmenu.style.left = Math.max(8, Math.min(window.innerWidth - 230, dr.right - 220)) + 'px';
    return;
  }
  var ci = classInfo(S.cur); if (!ci) return;
  wsend({ t: 'class.members', room: ci.key });
  var menu = el('div', 'menu'); menu.id = 'classMenu'; menu.style.minWidth = '240px';
  menu.appendChild(el('div', 'h', T.code + ': ' + ci.code));
  var add = function (t, fn) { var b = el('button', null, t); b.addEventListener('click', function () { closeMenu(); fn(); }); menu.appendChild(b); };
  add('📋 ' + T.copyCode, function () { copy(ci.code); });
  add('🔗 ' + T.copyLink, function () { copy(shareLink(ci.code)); });
  menu.appendChild(el('div', 'h', T.members)); var list = el('div'); list.id = 'memList'; menu.appendChild(list);
  add('🚪 ' + T.leave, function () { if (confirm(T.leaveAsk)) wsend({ t: 'class.leave', room: ci.key }); });
  document.body.appendChild(menu);
  var r = this.getBoundingClientRect(); menu.style.top = (r.bottom + 6) + 'px'; menu.style.left = Math.max(8, Math.min(window.innerWidth - 250, r.right - 240)) + 'px';
});
function renderMe() {
  var b = $('#me'); b.hidden = !S.me || !S.me.username; if (b.hidden) return;
  b.textContent = ''; b.appendChild(avatar(S.me.avatar)); b.appendChild(el('span', null, S.me.username));
}
function fmtTime(ts) { var d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function msgNode(m) {
  var mine = S.me && m.uid === S.me.uid;
  var d = el('div', 'msg' + (mine ? ' mine' : '')); d.setAttribute('data-id', m.id);
  d.appendChild(avatar(m.a));
  var body = el('div', 'body'); var who = el('div', 'who'); who.appendChild(el('b', null, m.u)); who.appendChild(el('time', null, fmtTime(m.ts)));
  if (!mine) { who.firstChild.className = 'uname'; who.firstChild.addEventListener('click', function (e) { e.stopPropagation(); userMenu(who.firstChild, m); }); }
  body.appendChild(who); body.appendChild(el('div', 'txt', m.text)); d.appendChild(body);
  if (!mine) { var r = el('button', 'rep', '⚑'); r.title = T.report; r.setAttribute('aria-label', T.report); r.addEventListener('click', function (e) { e.stopPropagation(); reportMenu(r, m); }); d.appendChild(r); }
  return d;
}
function nearBottom(box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 120; }
function renderMsgs(toBottom, keepPos) {
  var box = $('#msgs'), r = room(S.cur || 'global'), prevH = box.scrollHeight;
  box.textContent = '';
  if (r.more) { var mb = el('button', 'more', T.older); mb.addEventListener('click', function () { var first = r.msgs[0]; if (first) wsend({ t: 'history', room: r.key, before: first.id }); }); box.appendChild(mb); }
  box.appendChild(el('div', 'sys', T.welcome + ' ' + T.rules));
  r.msgs.forEach(function (m) { if (!isBlockedUid(m.uid)) box.appendChild(msgNode(m)); });
  if (keepPos) box.scrollTop = box.scrollHeight - prevH; else if (toBottom) box.scrollTop = box.scrollHeight;
}
function isBlockedUid(uid) { return S.blocked.some(function (b) { return b.uid === uid; }); }
function appendMsg(m, stick) { if (isBlockedUid(m.uid)) return; var box = $('#msgs'), was = nearBottom(box); box.appendChild(msgNode(m)); if (was || (S.me && m.uid === S.me.uid)) box.scrollTop = box.scrollHeight; }

// ---- reportar ----
function closeMenu() { var m = document.querySelector('.menu'); if (m && m.parentNode) m.parentNode.removeChild(m); }
function reportMenu(anchor, m) {
  closeMenu();
  var menu = el('div', 'menu'); menu.appendChild(el('div', 'h', T.reportT));
  Object.keys(T.reasons).forEach(function (k) { var b = el('button', null, T.reasons[k]); b.addEventListener('click', function () { closeMenu(); wsend({ t: 'report', id: m.id, reason: k }); }); menu.appendChild(b); });
  document.body.appendChild(menu);
  var r = anchor.getBoundingClientRect(); menu.style.top = Math.min(window.innerHeight - menu.offsetHeight - 8, r.bottom + 4) + 'px'; menu.style.left = Math.max(8, Math.min(window.innerWidth - menu.offsetWidth - 8, r.right - menu.offsetWidth)) + 'px';
}
document.addEventListener('click', function (e) { if (!e.target.closest('.menu')) closeMenu(); });

// ---- mi perfil / cuenta ----
$('#me').addEventListener('click', function (e) {
  e.stopPropagation(); closeMenu();
  var menu = el('div', 'menu');
  var add = function (t, fn) { var b = el('button', null, t); b.addEventListener('click', function () { closeMenu(); fn(); }); menu.appendChild(b); };
  add('✏️ ' + T.edit, function () { gate('profile'); });
  if (S.me && S.me.admin) add('🛡️ ' + T.admin, function () { location.href = '/admin.html#chat'; });
  add('🚫 ' + T.blockedL + (S.blocked.length ? ' (' + S.blocked.length + ')' : ''), function () { blockedMenu(); });
  add('↩ ' + T.signout, function () { if (S.fb) S.fb.signOut(); });
  document.body.appendChild(menu);
  var r = this.getBoundingClientRect(); menu.style.top = (r.bottom + 6) + 'px'; menu.style.left = Math.max(8, r.right - 220) + 'px'; menu.style.minWidth = '200px';
});

function blockedMenu() {
  closeMenu(); var menu = el('div', 'menu'); menu.style.minWidth = '240px'; menu.appendChild(el('div', 'h', T.blockedL));
  if (!S.blocked.length) menu.appendChild(el('div', 'h', T.blockedNone));
  S.blocked.forEach(function (u) { var b = el('button', null, (u.username || '?') + ' — ' + T.unblock); b.addEventListener('click', function () { closeMenu(); wsend({ t: 'unblock', uid: u.uid }); }); menu.appendChild(b); });
  document.body.appendChild(menu); var r = $('#me').getBoundingClientRect(); menu.style.top = (r.bottom + 6) + 'px'; menu.style.left = Math.max(8, r.right - 250) + 'px';
}
// clic en el nombre de alguien: agregar amigo o bloquear
function userMenu(anchor, m) {
  closeMenu(); var menu = el('div', 'menu'); menu.style.minWidth = '200px'; menu.appendChild(el('div', 'h', m.u));
  var add = function (t, fn) { var b = el('button', null, t); b.addEventListener('click', function () { closeMenu(); fn(); }); menu.appendChild(b); };
  add('➕ ' + T.addToFriends, function () { S.sentTo = m.u; wsend({ t: 'friend.request', username: m.u }); toast(T.reqSent); });
  add('🚫 ' + T.blockUser, function () { if (confirm(T.blockAsk)) wsend({ t: 'block', uid: m.uid }); });
  document.body.appendChild(menu); var r = anchor.getBoundingClientRect(); menu.style.top = Math.min(window.innerHeight - menu.offsetHeight - 8, r.bottom + 4) + 'px'; menu.style.left = Math.max(8, Math.min(window.innerWidth - menu.offsetWidth - 8, r.left)) + 'px';
}

// ---- escribir ----
function updateCount() { var v = $('#in').value.length; var c = $('#cnt'); if (c.className === 'err') return; c.textContent = v > 240 ? v + ' / 300' : ''; }
function clearInput(cid) { if ($('#in').getAttribute('data-cid') === cid) { $('#in').value = ''; $('#in').removeAttribute('data-cid'); updateCount(); } }
$('#in').addEventListener('input', updateCount);
$('#composer').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = $('#in').value.trim(); if (!v || !S.authed) return;
  var cid = String(Date.now()) + Math.random().toString(36).slice(2, 6);
  $('#in').setAttribute('data-cid', cid);
  wsend({ t: 'send', room: S.cur || 'global', text: v, cid: cid });
});

$('#menuBtn').addEventListener('click', function () { $('#side').classList.toggle('open'); });
$('#msgs').addEventListener('click', function () { $('#side').classList.remove('open'); });
$('#in').placeholder = T.ph; $('#go').textContent = T.send; $('#manageT').textContent = T.manage;
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.user && !S.ws) { clearTimeout(S.reconnect); connect(); } });

// #/game/<slug>/<nombre>: entra a la sala de ese juego (así enlazan los juegos)
(function () {
  var m = /^#\/game\/([a-z0-9][a-z0-9-]{0,59})(?:\/(.*))?$/.exec(location.hash || '');
  if (m) { var name = ''; try { name = decodeURIComponent(m[2] || ''); } catch (e) {} S.wantJoin = { key: 'game:' + m[1], name: name }; }
})();

(function () {
  var m = /^#\/class\/([A-Za-z0-9]{8})$/.exec(location.hash || '');
  if (m) S.wantClass = m[1].toUpperCase();
})();

if (window.__BUDSIN_CHAT_TEST) { window.__chat = { S: S }; }
boot();
})();
</script>
<script src="https://games.budsin.dev/classroom-hotkey.js"></script>
