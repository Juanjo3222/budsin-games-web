<style>
:root{color-scheme:dark;--bg:#121212;--panel:#181818;--card:#1f1f1f;--line:rgba(255,255,255,.09);--text:#fff;--muted:#a7a7a7;--accent:#25d0b4;--danger:#ff6b6b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:260px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:800;font-size:1.1rem}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#25d0b4,#1fa7d8);display:grid;place-items:center;font-style:normal}
.back{margin:0 16px 8px;color:var(--muted);text-decoration:none;font-size:.82rem}
.back:hover{color:#fff}
#rooms{overflow:auto;padding:6px 8px 16px;flex:1}
.sec{margin:14px 10px 6px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.room{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;text-align:left}
.room:hover{background:rgba(255,255,255,.06)}.room.on{background:rgba(37,208,180,.16)}
.room .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room .c{font-size:.72rem;color:var(--muted)}
.hint{margin:6px 10px;color:var(--muted);font-size:.8rem;line-height:1.4}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#menuBtn{display:none;border:0;background:none;font-size:1.3rem;padding:4px 8px}
#title{font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#sub{color:var(--muted);font-size:.8rem;white-space:nowrap}
#top .sp{flex:1}
#me{display:flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;flex:none}
#state{width:9px;height:9px;border-radius:50%;background:#777}#state.ok{background:#3ddc84}#state.bad{background:var(--danger)}
#msgs{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:10px;padding:5px 8px;border-radius:10px;position:relative}
.msg:hover{background:rgba(255,255,255,.04)}.msg .av{margin-top:2px}
.body{min-width:0}.who{display:flex;gap:8px;align-items:baseline}.who b{font-size:.9rem}.who time{color:var(--muted);font-size:.7rem}
.txt{overflow-wrap:anywhere;line-height:1.4;white-space:pre-wrap}
.msg.mine .who b{color:var(--accent)}
.tools{display:flex;gap:4px;align-items:center}.tool{border:0;background:var(--card);color:var(--text);width:40px;height:40px;border-radius:50%;font-size:1.1rem;display:grid;place-items:center;padding:0}.tool:hover{background:rgba(255,255,255,.12)}.tool[hidden]{display:none}
.mimg{position:relative;display:inline-block;margin-top:4px;border-radius:12px;overflow:hidden;max-width:min(320px,100%);cursor:zoom-in;background:var(--card)}
.mimg img{display:block;max-width:100%;max-height:320px;width:auto;height:auto}
.mimg.blur img{filter:blur(26px) brightness(.8);cursor:pointer}
.mimg .veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:.8rem;font-weight:700;padding:10px;background:rgba(0,0,0,.25);cursor:pointer}
.mimg.blur .veil{display:flex}
.stk{margin-top:4px;position:relative;display:inline-block}.stk img{width:140px;height:140px;object-fit:contain;display:block}.stk.blur img{filter:blur(18px)}.stk .veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;text-align:center;cursor:pointer}.stk.blur .veil{display:flex}
.stk .save{position:absolute;right:0;top:0;border:0;background:var(--card);border-radius:50%;width:26px;height:26px;opacity:0;padding:0}.stk:hover .save{opacity:1}
.pst{font-size:76px;line-height:1.1;margin-top:2px}
.aud{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;margin-top:4px;width:min(300px,100%)}
.aud button{border:0;background:var(--accent);color:#000;width:34px;height:34px;border-radius:50%;font-size:.95rem;padding:0;flex:none}
.aud .bar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.18);position:relative;cursor:pointer}.aud .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:var(--accent)}.aud time{font-size:.75rem;color:var(--muted);min-width:34px;text-align:right}
.hid{margin-top:4px;color:var(--muted);font-size:.85rem;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;display:inline-block}
#panel{position:fixed;left:14px;bottom:78px;width:min(360px,calc(100vw - 28px));max-height:min(420px,60vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:25;display:none;flex-direction:column;overflow:hidden}
#panel.on{display:flex}#panel .tabs{display:flex;gap:4px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--line)}#panel .tabs button{border:0;background:none;border-radius:999px;padding:6px 12px;white-space:nowrap;color:var(--muted)}#panel .tabs button.on{background:var(--accent);color:#000;font-weight:700}
#panel .grid{padding:10px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#panel .grid button{border:0;background:rgba(255,255,255,.05);border-radius:12px;aspect-ratio:1;padding:0;font-size:2.2rem;position:relative;display:grid;place-items:center}#panel .grid button:hover{background:rgba(255,255,255,.12)}
#panel .grid img{width:100%;height:100%;object-fit:contain;border-radius:10px}#panel .grid .x{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--bg);font-size:.7rem;display:none}#panel .grid button:hover .x{display:grid;place-items:center}
#panel .grid .add{font-size:1.6rem;color:var(--accent)}#panel .note{padding:10px 14px;color:var(--muted);font-size:.8rem;line-height:1.4}
#rec{flex:1;display:none;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px 8px 6px 16px}#rec.on{display:flex}
#rec .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
#rec audio{height:34px;flex:1;min-width:0}#rec .t{font-variant-numeric:tabular-nums;flex:1}
#rec button{border:0;border-radius:999px;padding:8px 14px;font-weight:700}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px}
.trk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px;margin-top:4px;width:min(340px,100%)}
.trk img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#222;flex:none}.trk .ti{min-width:0;flex:1}.trk .ti b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trk .ti span{display:block;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trk .ti small{color:#25d0b4;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.trk button,.trk a{border:0;background:var(--accent);color:#000;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:.95rem;text-decoration:none;flex:none}.trk a{background:rgba(255,255,255,.1);color:#fff}
.dest{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}.dest button{border:0;background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;display:flex;gap:10px;align-items:center}.dest button:hover{background:rgba(255,255,255,.08)}
body.has-bmmini #app{height:calc(100% - 92px)}#bm-mini:not(.bm-game){bottom:10px!important}
.uname{cursor:pointer}.uname:hover{text-decoration:underline}
.mini{border:0;background:rgba(255,255,255,.1);border-radius:50%;width:24px;height:24px;padding:0;line-height:1;margin-left:4px}.mini.ok{background:var(--accent);color:#000}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}.dot.on{background:#3ddc84}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.room .av{width:22px;height:22px;font-size:.8rem}
.rep{position:absolute;right:8px;top:2px;border:0;background:var(--card);border-radius:8px;padding:2px 8px;font-size:.8rem;opacity:0;color:var(--muted)}
.msg:hover .rep,.rep:focus{opacity:1}
.more{align-self:center;border:0;background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;margin-bottom:8px;font-size:.8rem}
.sys{align-self:center;color:var(--muted);font-size:.8rem;margin:8px 0}
#composer{display:flex;flex-wrap:wrap;gap:8px;padding:10px 70px 14px 14px;border-top:1px solid var(--line);background:var(--panel)}
#in{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;color:inherit;padding:11px 16px;font:inherit;outline:none}
#in:focus{border-color:var(--accent)}
#go{border:0;border-radius:999px;background:var(--accent);color:#000;font-weight:800;padding:0 20px}
#go:disabled{opacity:.4;cursor:default}
#cnt{width:100%;font-size:.72rem;color:var(--muted);padding-left:16px;min-height:1em}#cnt.err{color:var(--danger)}
#gate{position:absolute;inset:0;z-index:5;background:rgba(18,18,18,.97);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate.on{display:flex}
.card{width:min(460px,100%);background:var(--card);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.card h1{margin:0;font-size:1.4rem}.card p{margin:0;color:var(--muted);line-height:1.5}
.btn{border:0;border-radius:999px;background:var(--accent);color:#000;font-weight:800;padding:12px 20px;letter-spacing:.03em}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:inherit;padding:12px 14px;font:inherit;width:100%;outline:none}.field:focus{border-color:var(--accent)}
#avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#avs button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;font-size:1.4rem;padding:0}
#avs button.on{border-color:#fff}
.error{color:var(--danger);font-size:.85rem;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.85rem;z-index:30;display:none;max-width:90vw}
.menu{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;border-radius:8px}.menu button:hover{background:rgba(255,255,255,.08)}
.menu .h{padding:6px 14px;color:var(--muted);font-size:.75rem}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-102%);transition:transform .2s;width:auto;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #side.open{transform:none}
  #menuBtn{display:block}
  #composer{padding-right:64px}
  #me span{display:none}#me{padding:4px}
}
</style>
</head>

  c.appendChild(play);

}
function mediaNode(m, mine) {
  if (m.track) return trackCard(m.track);
  if (m.sticker) { var p = el('div', 'pst', PRESET[m.sticker] || '🙂'); return p; }
  var md = m.media; if (!md) return null;
  if (md.hidden) return el('div', 'hid', T.hiddenMedia);
  var blur = isPublicRoom() && !mine && !S.revealed[md.id];
  if (md.kind === 'image' || md.kind === 'sticker') {
    var wrap = el('div', md.kind === 'sticker' ? 'stk' : 'mimg'); if (blur) wrap.classList.add('blur');
    var img = el('img'); img.loading = 'lazy'; img.alt = ''; img.src = mediaUrl(md.id); if (md.w && md.kind === 'image') { img.width = Math.min(md.w, 320); img.height = Math.round(Math.min(md.w, 320) * md.h / md.w); }
    wrap.appendChild(img);
    var veil = el('div', 'veil', '👁 ' + T.tapView); wrap.appendChild(veil);
    wrap.addEventListener('click', function (e) {
      if (e.target.closest('.save')) return;
      if (wrap.classList.contains('blur')) { S.revealed[md.id] = 1; wrap.classList.remove('blur'); return; }
      if (md.kind === 'image') openLightbox(mediaUrl(md.id));
    });
    if (md.kind === 'sticker' && !mine) { var sv = el('button', 'save', '💾'); sv.title = T.saveSt; sv.addEventListener('click', function (e) { e.stopPropagation(); wsend({ t: 'sticker.save', id: md.id }); toast(T.saveSt + ' ✓'); }); wrap.appendChild(sv); }
    return wrap;
  }
  if (md.kind === 'audio') {
    var a = el('div', 'aud'); var au = new Audio(); au.preload = 'none'; au.src = mediaUrl(md.id);
    var pb = el('button', null, '▶'); var bar = el('div', 'bar'); var fill = el('i'); bar.appendChild(fill); var tm = el('time', null, fmtDur(md.dur));
    pb.addEventListener('click', function () { if (au.paused) { document.querySelectorAll('.aud button').forEach(function (b) { if (b !== pb && b._stop) b._stop(); }); au.play().catch(function () {}); } else au.pause(); });
    pb._stop = function () { au.pause(); };
    au.addEventListener('play', function () { pb.textContent = '⏸'; }); au.addEventListener('pause', function () { pb.textContent = '▶'; });
    au.addEventListener('ended', function () { pb.textContent = '▶'; fill.style.width = '0'; tm.textContent = fmtDur(md.dur); });
    au.addEventListener('timeupdate', function () { var d = au.duration || md.dur || 1; fill.style.width = Math.min(100, au.currentTime / d * 100) + '%'; tm.textContent = fmtDur(au.currentTime); });
    bar.addEventListener('click', function (e) { var r = bar.getBoundingClientRect(), d = au.duration || md.dur; if (d && isFinite(d)) au.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d; });
    a.appendChild(pb); a.appendChild(bar); a.appendChild(tm); return a;
  }
  return null;
}
function openLightbox(src) { var lb = $('#lb'); lb.querySelector('img').src = src; lb.classList.add('on'); }
$('#lb').addEventListener('click', function () { this.classList.remove('on'); this.querySelector('img').removeAttribute('src'); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('#lb').classList.remove('on'); closePanel(); } });
function nearBottom(box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 120; }
function renderMsgs(toBottom, keepPos) {
  var box = $('#msgs'), r = room(S.cur || 'global'), prevH = box.scrollHeight;
  box.textContent = '';
  if (r.more) { var mb = el('button', 'more', T.older); mb.addEventListener('click', function () { var first = r.msgs[0]; if (first) wsend({ t: 'history', room: r.key, before: first.id }); }); box.appendChild(mb); }
  box.appendChild(el('div', 'sys', T.welcome + ' ' + T.rules));

  if (keepPos) box.scrollTop = box.scrollHeight - prevH; else if (toBottom) box.scrollTop = box.scrollHeight;
}
function isBlockedUid(uid) { return S.blocked.some(function (b) { return b.uid === uid; }); }
function appendMsg(m, stick) { if (isBlockedUid(m.uid)) return; var box = $('#msgs'), was = nearBottom(box); box.appendChild(msgNode(m)); if (was || (S.me && m.uid === S.me.uid)) box.scrollTop = box.scrollHeight; }

// ---- compartir una canción desde Budsin Music (#/share) ----
function readShare() { try { var o = JSON.parse(localStorage.getItem('bc_share') || 'null'); if (o && o.track && Date.now() - o.t < 15 * 60000) return o.track; } catch (e) {} return null; }
function clearShare() { try { localStorage.removeItem('bc_share'); } catch (e) {} if (/^#\/share/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} } }
function shareTo(key, tr) {
  var r = room(key);
  if (r.loaded) { wsend({ t: 'send', room: key, track: tr, text: '', cid: 't' + Date.now() }); finishShare(key); }
  else { S.pendingShare = { key: key, track: tr }; openRoom(key, r.name); }
}
function finishShare(key) { clearShare(); gate(null); toast(T.shareDone); S.cur = key; renderRooms(); renderTop(); renderMsgs(true); }
function openShare() {
  var tr = readShare();
  if (!tr) { if (/^#\/share/.test(location.hash)) { clearShare(); toast(T.shareNone); } return; }
  var c = $('#card'); c.textContent = ''; $('#gate').classList.add('on');
  c.appendChild(el('h1', null, '🎵 ' + T.shareH)); c.appendChild(trackCard(tr)); c.appendChild(el('p', null, T.shareP));
  var box = el('div', 'dest'); var add = function (icon, name, key) { var b = el('button'); b.appendChild(el('span', null, icon)); b.appendChild(el('span', null, name)); b.addEventListener('click', function () { shareTo(key, tr); }); box.appendChild(b); };
  add('🌍', T.global, 'global');
  S.classes.forEach(function (x) { add('🏫', x.name, x.key); });
  S.friends.forEach(function (f) { add('💬', f.username || '?', f.room); });
  Object.keys(S.rooms).forEach(function (k) { if (k.indexOf('game:') === 0 && S.rooms[k].loaded) add('🎮', S.rooms[k].name, k); });
  c.appendChild(box);
  var no = el('button', 'btn ghost', T.cancel); no.addEventListener('click', function () { clearShare(); gate(null); }); c.appendChild(no);
}

// ---- subir archivos ----
function setBusy(on, text) { var c = $('#cnt'); c.className = on ? '' : c.className; if (on) c.textContent = text || T.uploading; else if (c.textContent === (text || T.uploading) || c.textContent === T.uploading) c.textContent = ''; }
function mediaErr(code, retry) { var msg = errText(code); if (code === 'media_rate' && retry) msg += ' (' + Math.ceil(retry / 1000) + 's)'; var c = $('#cnt'); c.className = 'err'; c.textContent = msg; clearTimeout(onErr.t); onErr.t = setTimeout(function () { c.className = ''; c.textContent = ''; updateCount(); }, 5000); }
function uploadFile(kind, blob, roomKey) {
  if (!S.user) return Promise.reject(new Error('auth'));
  setBusy(true);
  return S.user.getIdToken().then(function (tok) {
    return fetch('/api/chat/upload?kind=' + kind + '&room=' + encodeURIComponent(roomKey || ''), { method: 'POST', headers: { Authorization: 'Bearer ' + tok }, body: blob });
  }).then(function (r) { return r.json().catch(function () { return { error: 'server_error' }; }).then(function (j) { if (!r.ok || j.error) { var e = new Error(j.error || 'server_error'); e.retry = j.retry; throw e; } return j; }); })
    .finally(function () { setBusy(false); });
}
function sendImageFile(file) {
  if (!file) return; var key = S.cur || 'global';
  if (file.size > 5000000) { mediaErr('media_too_large'); return; }
  uploadFile('image', file, key).then(function (j) {
    var cap = $('#in').value.trim().slice(0, 120); wsend({ t: 'send', room: key, media: j.id, text: cap, cid: 'm' + Date.now() }); $('#in').value = ''; updateCount();
  }).catch(function (e) { mediaErr(e.message, e.retry); });
}
$('#bAttach').addEventListener('click', function () { $('#fileImg').value = ''; $('#fileImg').click(); });
$('#fileImg').addEventListener('change', function () { sendImageFile(this.files[0]); });
$('#in').addEventListener('paste', function (e) { if (!S.features.images) return; var f = e.clipboardData && [].slice.call(e.clipboardData.files || []).filter(function (x) { return /^image\//.test(x.type); })[0]; if (f) { e.preventDefault(); sendImageFile(f); } });
$('#fileStk').addEventListener('change', function () {
  var f = this.files[0]; if (!f) return;
  if (f.size > 5000000) { mediaErr('media_too_large'); return; }
  uploadFile('sticker', f, '').then(function () { wsend({ t: 'sticker.list' }); toast(T.createSt + ' ✓'); }).catch(function (e) { mediaErr(e.message, e.retry); });
});

// ---- panel de stickers ----
function closePanel() { $('#panel').classList.remove('on'); }
function renderPanel() {
  var p = $('#panel'); p.textContent = '';
  var tabs = el('div', 'tabs'); var mk = function (id, label) { var b = el('button', S.stTab === id ? 'on' : '', label); b.type = 'button'; b.addEventListener('click', function (e) { e.stopPropagation(); S.stTab = id; renderPanel(); }); tabs.appendChild(b); };
  mk('mine', '⭐ ' + T.mySt); PACKS.forEach(function (pk) { mk(pk[0], T.packs[pk[0]]); }); p.appendChild(tabs);
  var grid = el('div', 'grid');
  var sendSticker = function (ref) { var key = S.cur || 'global'; wsend({ t: 'send', room: key, media: ref, text: '', cid: 's' + Date.now() }); closePanel(); };
  if (S.stTab === 'mine') {
    if (S.features.images) { var add = el('button', 'add', '＋'); add.type = 'button'; add.title = T.createSt; add.addEventListener('click', function () { $('#fileStk').value = ''; $('#fileStk').click(); }); grid.appendChild(add); }
    S.myStickers.forEach(function (st) {
      var b = el('button'); b.type = 'button'; var im = el('img'); im.src = mediaUrl(st.id); im.alt = ''; b.appendChild(im);
      var x = el('span', 'x', '✕'); x.addEventListener('click', function (e) { e.stopPropagation(); wsend({ t: 'sticker.remove', id: st.id }); }); b.appendChild(x);
      b.addEventListener('click', function () { sendSticker(st.id); }); grid.appendChild(b);
    });
    p.appendChild(grid); if (S.features.images) p.appendChild(el('div', 'note', T.stNote));
  } else {
    (PACKS.filter(function (pk) { return pk[0] === S.stTab; })[0] || PACKS[0])[1].forEach(function (id) { var b = el('button', null, PRESET[id]); b.type = 'button'; b.addEventListener('click', function () { sendSticker('preset:' + id); }); grid.appendChild(b); });
    p.appendChild(grid);
  }
}
$('#bStk').addEventListener('click', function (e) { e.stopPropagation(); var p = $('#panel'); if (p.classList.contains('on')) { closePanel(); return; } renderPanel(); p.classList.add('on'); });
document.addEventListener('click', function (e) { if (!e.target.closest('#panel') && !e.target.closest('#bStk')) closePanel(); });

// ---- notas de voz (solo chats privados y grupos de clase) ----
var REC = { mr: null, chunks: [], stream: null, t0: 0, iv: null, blob: null, type: '' };
function micAvailable() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function recReset() { clearInterval(REC.iv); if (REC.stream) REC.stream.getTracks().forEach(function (t) { t.stop(); }); REC.mr = null; REC.stream = null; REC.chunks = []; REC.blob = null; $('#rec').classList.remove('on'); $('#recA').hidden = true; $('#recA').removeAttribute('src'); $('#recSend').hidden = true; $('#recStop').hidden = false; $('#in').style.display = ''; $('#go').style.display = ''; $('#recT').hidden = false; }
function recStop() { if (REC.mr && REC.mr.state !== 'inactive') REC.mr.stop(); }
$('#bMic').addEventListener('click', function () {
  if (!micAvailable()) { toast(T.micDenied); return; }
  var kind = room(S.cur || 'global').kind; if (kind !== 'dm' && kind !== 'class') { toast(T.voiceOnly); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    REC.stream = stream; REC.chunks = [];
    var type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].filter(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0] || '';
    REC.type = type; REC.mr = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
    REC.mr.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
    REC.mr.onstop = function () {
      clearInterval(REC.iv); REC.stream && REC.stream.getTracks().forEach(function (t) { t.stop(); });
      REC.blob = new Blob(REC.chunks, { type: REC.mr.mimeType || REC.type || 'audio/webm' });
      $('#recA').src = URL.createObjectURL(REC.blob); $('#recA').hidden = false; $('#recT').hidden = true; $('#recStop').hidden = true; $('#recSend').hidden = false; $('#recSend').textContent = '➤ ' + T.sendVoice;
    };
    REC.mr.start(); REC.t0 = Date.now(); $('#in').style.display = 'none'; $('#go').style.display = 'none'; $('#rec').classList.add('on');
    REC.iv = setInterval(function () { var s = (Date.now() - REC.t0) / 1000; $('#recT').textContent = '🔴 ' + T.rec + ' ' + fmtDur(s); if (s >= 30) recStop(); }, 250);
  }).catch(function () { toast(T.micDenied); });
});
$('#recStop').addEventListener('click', recStop);
$('#recCancel').addEventListener('click', function () { if (REC.mr && REC.mr.state !== 'inactive') { REC.mr.onstop = null; REC.mr.stop(); } recReset(); });
$('#recSend').addEventListener('click', function () {
  if (!REC.blob) return; var key = S.cur || 'global', blob = REC.blob; recReset();
  uploadFile('audio', blob, key).then(function (j) { wsend({ t: 'send', room: key, media: j.id, text: '', cid: 'a' + Date.now() }); }).catch(function (e) { mediaErr(e.message, e.retry); });
});

}

function updateCount() { var v = $('#in').value.length; var c = $('#cnt'); if (c.className === 'err') return; c.textContent = v > 240 ? v + ' / 300' : ''; }
