    <style>
        :root {
            --bg: #edf1f5;
            --bg-2: #dfe6ee;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-strong: #ffffff;
            --line: rgba(18, 24, 38, 0.1);
            --text: #111827;
            --muted: #5c6678;
            --red: #ef3f45;
            --blue: #2daeff;
            --shadow: 0 24px 64px rgba(15, 23, 42, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Sora", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top center, rgba(255,216,74,0.34), transparent 26%), linear-gradient(180deg, #f7fafc 0%, var(--bg) 48%, var(--bg-2) 100%);
            padding: 20px;
        }
        .card {
            width: min(480px, 100%);
            padding: 40px 36px;
            border-radius: 42px;
            border: 1px solid rgba(255,255,255,0.8);
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(246,249,252,0.88)), linear-gradient(135deg, rgba(239,63,69,0.08), rgba(45,174,255,0.08));
            box-shadow: var(--shadow);
            text-align: center;
        }
        .code {
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(6rem, 20vw, 10rem);
            line-height: 0.85;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, var(--red), #ff8c55);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        h1 {
            margin: 8px 0;
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(2rem, 6vw, 3.2rem);
            letter-spacing: 0.04em;
        }
        p {
            margin: 12px 0 24px;
            color: var(--muted);
            line-height: 1.7;
            font-size: 0.95rem;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .nav-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 999px;
            background: var(--surface-strong);
            border: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .nav-links a:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .nav-links .primary {
            background: linear-gradient(135deg, var(--red), #ff8c55);
            color: #fff;
            border-color: transparent;
        }
        @media (max-width: 600px) {
            .card { padding: 28px 20px; border-radius: 28px; }
        }
        html[data-site-theme="dark"] body {
            color: #e6edf8;
            background: radial-gradient(circle at top center, rgba(255,216,74,0.12), transparent 26%), linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
        }
        html[data-site-theme="dark"] .card {
            background: linear-gradient(135deg, rgba(9,15,28,0.96), rgba(15,23,42,0.92));
            border-color: rgba(148,163,184,0.14);
        }
        html[data-site-theme="dark"] h1 { color: #f1f5f9; }
        html[data-site-theme="dark"] p { color: #94a3b8; }
        html[data-site-theme="dark"] .nav-links a { background: rgba(9,15,28,0.92); border-color: rgba(148,163,184,0.28); color: #e2e8f0; }
    </style>
</head>
