/* ---------- layout ---------- */
#app {

.card .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.round .cv { border-radius: 50%; }

.top10 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }

.tracks { display: flex; flex-direction: column; }

.tr .like.on { color: var(--accent); }

.tr .like.on:hover { color: var(--accent); }

.viz-cap .nxt { margin-top: 6px; font-size: clamp(.82rem, 1.5vw, 1.05rem); color: rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- recommendations & account ---------- */
.reco-hint { margin: 18px 0 4px; padding: 14px 18px; border-radius: 14px; background: var(--panel); color: var(--muted); font-size: .92rem; }
.row-title .chip { font-size: .78rem; padding: 6px 14px; }
.qsep { padding: 10px 10px 4px; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
.qrow .auto-tag { font-size: .6rem; background: var(--panel2); color: var(--muted); padding: 1px 6px; border-radius: 999px; margin-left: 6px; font-weight: 700; vertical-align: middle; }
#queue header .chip { font-size: .72rem; padding: 5px 11px; margin-right: 6px; }
#queue header .chip.on { background: var(--accent); color: var(--on-accent); }
.box { margin-top: 26px; padding: 18px; border-radius: 14px; background: var(--panel); }
.box h3 { margin: 0 0 6px; font-size: 1.05rem; }
.box p { margin: 0 0 14px; color: var(--muted); font-size: .88rem; line-height: 1.5; }
.box .btns { gap: 10px; }
.acct { margin: 14px 4px 0; padding: 12px; border-radius: 12px; background: var(--panel); font-size: .8rem; line-height: 1.45; }
.acct .who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.acct img.av { width: 34px; height: 34px; border-radius: 50%; background: #222; object-fit: cover; flex: none; }

.acct .em { color: var(--muted); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .sync { color: var(--muted); font-size: .74rem; margin-bottom: 8px; }
.acct .sync.ok { color: var(--accent); }
.acct .sync.err { color: var(--danger); }
.acct .sub { color: var(--muted); margin-bottom: 10px; }
.acct .btn { padding: 8px 14px; font-size: .8rem; }
.acct .linkbtn { color: var(--muted); font-size: .72rem; text-decoration: underline; margin-left: 6px; }
.acct .linkbtn:hover { color: var(--text); }
#acctLib { display: none; }   /* en escritorio la cuenta ya está en la barra lateral */

/* ---------- album save & artist avatar ---------- */
.card .cv .albsave { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(8,10,12,.72); color: #fff; display: grid; place-items: center; font-size: 18px; line-height: 1; opacity: 0; transition: .15s; cursor: pointer; z-index: 2; backdrop-filter: blur(4px); }
.card:hover .albsave, .card:focus-within .albsave, .albsave.on { opacity: 1; }
.albsave:hover { background: var(--accent); color: var(--on-accent); }
.albsave.on { background: var(--accent); color: var(--on-accent); }
.cv.ph-av { display: grid; place-items: center; background: linear-gradient(135deg, var(--ph1), var(--ph2)); color: #7b869c; font-size: 3.2rem; font-weight: 800; }
.grid-albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 16px; }
.grid-albums .card { width: auto; }
@media (max-width: 760px) { .card .cv .albsave { opacity: 1; } .grid-albums { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); } }

/* ---------- Tus gustos ---------- */
.linkbar { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 9px 14px; border-radius: 10px; background: var(--soft); color: var(--muted); font-size: .88rem; }
.linkbar b { color: var(--text, #fff); }
.why-link { font-size: .78rem; font-weight: 600; color: var(--muted); margin-left: 8px; text-decoration: underline; }
.why-link:hover { color: var(--text); }
.tstat { display: grid; grid-template-columns: 28px minmax(0, 1.1fr) minmax(0, 2fr) 70px auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; }
.tstat:hover { background: var(--panel); }
.tstat .rk { color: var(--accent); font-weight: 800; text-align: center; }
.tstat .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tstat .nm small { display: block; color: var(--muted); font-weight: 400; font-size: .72rem; }
.tstat .bar { height: 10px; border-radius: 6px; background: var(--panel2); overflow: hidden; }
.tstat .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.tstat.neg .bar i { background: linear-gradient(90deg, #ff5d6c, #ff9b5d); }
.tstat .sc { text-align: right; font-variant-numeric: tabular-nums; color: var(--chip-text); font-size: .88rem; }
.tstat .fg { color: var(--muted); font-size: .75rem; text-decoration: underline; }
.tstat .fg:hover { color: var(--danger); }
.tlog { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: .9rem; }
.tlog:nth-child(odd) { background: var(--panel); }
.tlog .w { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 42px; }
.tlog .w.pos { color: var(--accent); }
.tlog .w.neg { color: var(--danger); }
.tlog .ag { margin-left: auto; color: var(--muted); font-size: .76rem; white-space: nowrap; }
.thow { margin: 0; padding-left: 20px; color: #c8cedb; line-height: 1.8; font-size: .92rem; }
.thow b { color: var(--text); }
@media (max-width: 760px) { .tstat { grid-template-columns: 22px 1fr 56px auto; } .tstat .bar { grid-column: 2 / 4; grid-row: 2; } .tstat .fg { grid-row: 1; grid-column: 4; } }

/* ---------- playlist covers ---------- */
.pl-art { width: 100%; height: 100%; display: grid; place-items: center; font-size: 3rem; color: #fff; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; }
.mosaic img, .plthumb img, .plhead-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.plhead-art { position: relative; width: 220px; height: 220px; border-radius: 14px; overflow: hidden; flex: none; background: #222; box-shadow: 0 16px 44px rgba(0,0,0,.55); }
.plhead-art .pl-art { font-size: 5.5rem; }
.plhead-edit { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 10px; background: linear-gradient(to top, rgba(0,0,0,.82), transparent); color: #fff; font-weight: 700; font-size: .85rem; opacity: 0; transition: .15s; cursor: pointer; }

#plmodal { position: fixed; inset: 0; z-index: 160; background: rgba(4,6,9,.72); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 18px; }
#plmodal.on { display: flex; }
.plm-card { width: min(520px, 100%); max-height: 92vh; overflow-y: auto; background: var(--modal-bg); border: 1px solid var(--modal-line); border-radius: 18px; padding: 18px 18px 22px; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
.plm-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 1.1rem; }
.plm-top { display: flex; gap: 16px; align-items: center; margin-bottom: 6px; }
.plm-prev { width: 120px; height: 120px; border-radius: 12px; overflow: hidden; flex: none; background: #222; }
.plm-prev .pl-art { font-size: 3.4rem; }
.plm-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.plm-sec { margin: 18px 0 8px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.plm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.plm-song { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #222; border: 2px solid transparent; padding: 0; }
.plm-song img { width: 100%; height: 100%; object-fit: cover; display: block; }
.plm-song:hover { border-color: var(--accent); }
.plm-none { color: var(--muted); font-size: .85rem; grid-column: 1 / -1; }
.plm-grads, .plm-emojis { display: flex; flex-wrap: wrap; gap: 8px; }
.plm-g { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 2px var(--ring); }
.plm-g.on, .plm-e.on { border-color: var(--text); }
.plm-e { width: 40px; height: 40px; border-radius: 10px; font-size: 1.35rem; background: var(--panel2); border: 2px solid transparent; }
.plm-e:hover, .plm-g:hover { transform: scale(1.08); }
@media (max-width: 760px) { .plhead-art { width: 180px; height: 180px; } .plhead-edit { opacity: 1; } }

/* ---------- lyrics ---------- */
#lyrics { position: fixed; left: 0; right: 0; top: 0; bottom: var(--player); z-index: 36; background: #07090c; display: none; flex-direction: column; overflow: hidden; }
#lyrics.on { display: flex; }
.lyr-bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(80px) saturate(1.3); opacity: .32; transform: scale(1.2); }
.lyr-top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; background: linear-gradient(to bottom, rgba(7,9,12,.85), transparent); flex: none; }
#lyrBody { position: relative; flex: 1; overflow-y: auto; padding: 0 22px; scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); }
#lyrBody::-webkit-scrollbar { display: none; }
.lyr-pad { max-width: 780px; margin: 0 auto; padding: 38vh 0 38vh; }
.lyr-line { margin: 0; padding: 7px 0; font-size: clamp(1.35rem, 2.7vw, 2.3rem); font-weight: 800; line-height: 1.22; letter-spacing: -.4px; color: rgba(255,255,255,.34); transition: color .25s, transform .25s; transform-origin: left center; cursor: pointer; overflow-wrap: anywhere; }
.lyr-line:hover { color: rgba(255,255,255,.7); }
.lyr-line.cur { color: color-mix(in srgb, var(--accent) 62%, #fff); transform: scale(1.04); }
.lyr-line .trl { display: block; margin-top: 3px; font-size: .58em; font-weight: 600; letter-spacing: 0; color: rgba(255,255,255,.4); }
.lyr-line.cur .trl { color: rgba(255,255,255,.78); }
.lyr-plain { white-space: pre-wrap; font-size: 1.15rem; line-height: 1.85; color: #d5d9e2; padding-bottom: 20px; }
.lyr-note { display: inline-block; margin-bottom: 16px; padding: 4px 12px; border-radius: 999px; background: var(--panel2); color: var(--muted); font-size: .78rem; }
.lyr-msg { text-align: center; color: var(--muted); padding: 30px 0; font-size: 1.05rem; }
.lyr-msg .big { font-size: 2.6rem; margin-bottom: 8px; }
.lyr-credit { position: relative; text-align: center; font-size: .72rem; color: #566; padding: 0 0 28px; }
.lyr-credit a { color: #7f93c9; text-decoration: underline; }
.lyr-pad.plain-pad { padding: 18px 0 24px; }
.lyr-tools { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; margin-right: 6px; }
#lyrics:not(.has-sync) .lyr-tools { display: none; }
.lyr-off { display: inline-flex; align-items: center; background: var(--panel2); border-radius: 999px; padding: 2px; }
.lyr-off button { width: 30px; height: 30px; border-radius: 50%; font-size: 1.15rem; line-height: 1; color: var(--text); }
.lyr-off button:hover { background: var(--hover); }
.lyr-off span { min-width: 52px; text-align: center; font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--chip-text); cursor: pointer; }
.lyr-tools .chip { padding: 7px 13px; font-size: .78rem; }

/* ---------- tablet / mobile ---------- */
@media (max-width: 960px) {
  .top10 { grid-template-columns: 1fr; }
  .tr.has-album { grid-template-columns: 36px minmax(0, 1fr) 36px 52px 36px; }
  .tr .alb { display: none; }
}
@media (max-width: 760px) {
  :root { --player: 80px; --nav: 58px; }
  #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; grid-template-areas: "main" "player"; padding-bottom: var(--nav); }
  #side { position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav); flex-direction: row; padding: 0; z-index: 60; border-right: 0; border-top: 1px solid var(--line); background: var(--side-bg); overflow: visible; gap: 0; justify-content: space-around; }
  #side .brand, #side .brandrow, #side .sect, #side .plist, #side .libfilter, #side .side-foot, #side .nav-desktop, #side .acct, #side .instbtn { display: none; }
  #side .navlink { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: .68rem; flex: 1; justify-content: center; border-radius: 0; background: none !important; }
  #side .navlink svg { font-size: 22px; }
  #side .navlink.active { color: var(--accent); }
  #player { grid-template-columns: 1fr; grid-template-rows: auto auto; gap: 2px; padding: 8px 12px 6px; height: auto; align-content: center; }
  .np img { width: 44px; height: 44px; }
  .right { display: none; }
  .ctrl { flex-direction: column-reverse; gap: 0; }
  .np { padding-right: 124px; gap: 8px; }
  .np .iconbtn { width: 34px; height: 34px; font-size: 19px; flex: none; }
  .ctrl .row { position: absolute; right: 10px; top: 14px; gap: 0; }
  .ctrl .row .hide-m { display: none; }
  .seek { margin-top: 2px; }
  .topbar { padding: 10px 14px; }
  .back span { display: none; }
  .view { padding: 2px 14px 30px; }
  h1.page { font-size: 1.5rem; }
  .hero-in { flex-direction: column; align-items: flex-start; gap: 14px; padding: 18px; }
  .hero img { width: 130px; height: 130px; }
  .hero h2 { font-size: 1.7rem; }
  .phead { flex-direction: column; align-items: center; text-align: center; }
  .phead .art, .phead .ph-fallback { width: 180px; height: 180px; }
  .phead h1 { font-size: 1.9rem; }
  .phead .btns, .actions { justify-content: center; }
  .card { width: 138px; padding: 10px; }
  .tr .like, .tr .more { opacity: 1; }
  .tr { grid-template-columns: 26px minmax(0, 1fr) 34px 34px; gap: 8px; padding: 6px 4px; }
  .tr.has-album { grid-template-columns: 26px minmax(0, 1fr) 34px 34px; }
  .tr .dur { display: none; }
  /* Chrome móvil "pega" el toque al enlace más cercano: tocar el título abría el artista en vez de reproducir. */
  .tr .aa a, .tr .alb a { pointer-events: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- Design system inspired by Spotify (DESIGN.md) ----------
 * Near-black surfaces, pill buttons with uppercase labels, heavy shadows on what floats, compact type, and album art as
 * the colour. Inter stands in for Spotify's proprietary font and the accent stays Budsin's. The light theme keeps its own
 * values (these rules use the variables); borders become shadows. */
h1.page { font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; }
h2.row-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
.brand b { color: inherit; }
.hero small, .phead small { color: var(--muted); }
.top10 .tr .idx { color: var(--muted); }
.sect { color: #7c7c7c; }
.side-foot, .legal { color: #7c7c7c; }
.side-foot a, .legal a { color: var(--muted); }
/* buttons: pills, uppercase label with wide tracking */
.btn { padding: 12px 28px; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.btn:hover { transform: scale(1.04); }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px #7c7c7c; }
.btn.ghost:hover { background: transparent; box-shadow: inset 0 0 0 1px var(--text); }
.chip { font-weight: 700; }
.navlink { font-weight: 700; }
.plist .navlink { font-weight: 400; }
.navlink.active { background: var(--panel2); }
/* surfaces: #181818 cards, lighter on hover with a medium shadow; radii 6-8px */
.card { border-radius: 8px; }
.card:hover { background: var(--hover); box-shadow: rgba(0,0,0,.3) 0 8px 8px; }
.card .cv { border-radius: 6px; }
.card.round .cv { border-radius: 50%; }
.tile { border-radius: 8px; }
.tr { border-radius: 6px; }
.box, .acct { border-radius: 8px; }
.hero { border-radius: 16px; }
/* search: pill with the guide's inset border-shadow */
.searchbox input { border: 0; background: var(--panel2); box-shadow: rgb(18,18,18) 0 1px 0, #7c7c7c 0 0 0 1px inset; }
.searchbox input:hover { box-shadow: rgb(18,18,18) 0 1px 0, #fff 0 0 0 1px inset; }
.searchbox input:focus { background: var(--panel2); box-shadow: var(--accent) 0 0 0 2px inset; }
html[data-theme="light"] .searchbox input { box-shadow: #cfd4de 0 0 0 1px inset; }
html[data-theme="light"] .searchbox input:hover { box-shadow: #12151a 0 0 0 1px inset; }
html[data-theme="light"] .searchbox input:focus { box-shadow: var(--accent) 0 0 0 2px inset; }
/* floating things: heavy shadow, no hairline border */
.menu { border: 0; border-radius: 8px; box-shadow: rgba(0,0,0,.5) 0 8px 24px; }
.menu button { border-radius: 4px; }
.djm-box, .plm-card { border: 0; border-radius: 8px; box-shadow: rgba(0,0,0,.5) 0 8px 24px; }
#toast { box-shadow: rgba(0,0,0,.5) 0 8px 24px; }
/* "Budsin Games" link: a chevron next to the text on wide screens; on phones (text hidden) a gamepad, so it does not
 * look like a second "back" next to the history buttons. */
.back .b-gm { display: none; font-size: 20px; }
@media (max-width: 760px) {
  .back .b-ch { display: none; } .back .b-gm { display: block; }
  .back { padding: 8px 10px; }
}
/* phones: no "forward" (the system gesture covers it) so the search box keeps room; tighter buttons so labels do not wrap */
@media (max-width: 560px) {
  #nFwd { display: none; }
  .btn { padding: 11px 18px; letter-spacing: .08em; }
  .topbar { padding-left: 14px; padding-right: 14px; gap: 8px; }
}

/* ---------- 1A: profile top-right, (i) legal, library filter ---------- */
.prof { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--panel2); display: grid; place-items: center; flex: none; font-weight: 700; font-size: .95rem; cursor: pointer; }
.prof img { width: 100%; height: 100%; object-fit: cover; display: block; } .prof svg { width: 20px; height: 20px; color: var(--muted); }
.prof:hover { box-shadow: 0 0 0 2px var(--soft-h); }
.brandrow { display: flex; align-items: center; justify-content: space-between; } .brandrow .brand { flex: 1; min-width: 0; }
.infobtn { width: 22px; height: 22px; border-radius: 50%; flex: none; margin-right: 6px; box-shadow: inset 0 0 0 1px #7c7c7c; color: var(--muted); font: italic 700 12px/1 Georgia, serif; display: grid; place-items: center; cursor: pointer; }
.infobtn:hover { color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.libfilter { display: flex; gap: 6px; margin: 0 8px 10px; flex-wrap: wrap; } .libfilter .chip { padding: 5px 12px; font-size: .78rem; cursor: pointer; }
.lib-item { padding: 6px 8px !important; gap: 12px !important; } .lib-item .plthumb { width: 48px; height: 48px; border-radius: 4px; } .lib-item .plthumb .pl-art { font-size: 22px; }
.plthumb.round { border-radius: 50% !important; display: grid; place-items: center; background: var(--panel2); } .plthumb i { font-style: normal; font-weight: 700; font-size: 1.1rem; color: var(--muted); }
.li-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.plist .li-t b { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .li-t small { color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-empty { margin: 4px 12px; color: var(--muted); font-size: .82rem; line-height: 1.4; }
.mhead { padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 2px; min-width: 0; } .mhead b { font-size: .92rem; overflow: hidden; text-overflow: ellipsis; } .mhead small { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; }
.infopop { width: 290px; max-width: calc(100vw - 16px); padding: 8px 6px 12px; } .infopop p { margin: 4px 12px 0; font-size: .78rem; line-height: 1.5; color: var(--muted); } .infopop a { color: var(--text); text-decoration: underline; }
@media (max-width: 560px) { #nHome { display: none; } .prof { width: 32px; height: 32px; } }

/* ---------- 1B: home (hero without a box, glass chips, quick access) ---------- */
.chip { background: rgba(255,255,255,.1); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 0; }
.chip:hover { background: rgba(255,255,255,.17); }
.chip.on { background: var(--text); }
html[data-theme="light"] .chip { background: rgba(0,0,0,.06); } html[data-theme="light"] .chip:hover { background: rgba(0,0,0,.11); } html[data-theme="light"] .chip.on { background: var(--text); }
.chip.djopen { background: var(--accent); }
.hero { background: none; border-radius: 0; overflow: visible; min-height: 0; margin: 14px 0 22px; isolation: auto; }
.hero .bgimg, .hero::after, html[style*="--tint"] .hero::after { display: none !important; }
.hero-in { padding: 6px 0 0; }
.hero img { border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.6); }
.hero p { color: var(--muted); }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 6px; }
.qk { display: flex; align-items: center; gap: 12px; height: 56px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; padding-right: 12px; font-size: .9rem; transition: background .15s; }
.qk:hover { background: rgba(255,255,255,.14); }
html[data-theme="light"] .qk { background: rgba(0,0,0,.05); } html[data-theme="light"] .qk:hover { background: rgba(0,0,0,.1); }
.qk-img { width: 56px; height: 56px; flex: none; display: grid; place-items: center; background: var(--panel2); overflow: hidden; }
.qk-img img, .qk-img .mosaic, .qk-img .pl-art { width: 100%; height: 100%; object-fit: cover; display: grid; }
.qk-img .pl-art { place-items: center; font-size: 24px; }
.qk-heart { width: 100%; height: 100%; display: grid; place-items: center; font-size: 22px; background: linear-gradient(135deg, #5b3df5, #8fa8ff); color: #fff; }
.qk-emo { font-size: 24px; } .qk b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
@media (max-width: 760px) { .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } .qk b { font-size: .82rem; } }

/* ---------- 1C: right panel (tabs, modular cards, lyric hierarchy) ---------- */
.brand { white-space: nowrap; font-size: 1.05rem; } .brand span { white-space: nowrap; }
#npv { background: linear-gradient(180deg, rgba(var(--tint, 37,208,180), calc(var(--gs, .22) + .08)), var(--player-bg) 60%); padding: 0 !important; gap: 0; }
.npv-tabs { display: flex; align-items: center; gap: 2px; padding: 12px 12px 2px; flex: none; }
.npv-tab { padding: 9px 10px; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
.npv-tab:hover { color: var(--text); } .npv-tab.on { color: var(--text); border-bottom-color: var(--text); }
.npv-close { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; color: var(--muted); font-size: 14px; display: grid; place-items: center; cursor: pointer; } .npv-close:hover { color: var(--text); background: var(--soft); }
.npv-card { background: #18181b; border-radius: 12px; margin: 10px 12px 0; position: relative; }
html[data-theme="light"] .npv-card { background: #ffffff; }
.npv-now { display: flex; align-items: center; gap: 12px; padding: 12px; flex: none; }
#npv .npv-now .npv-art { flex: none; } #npv .npv-now .npv-art img { width: 56px; height: 56px; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.45); }
.npv-who { min-width: 0; } #npv .npv-now .npv-t { margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#npv .npv-now .npv-a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.npv-main { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 12px; overflow: hidden; }
.npv-bodyin { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; padding: 12px 14px; scrollbar-width: thin; }
#npv .npv-ly { margin-top: 0; padding: 6px 0 40vh; }
.npv-exp { position: absolute; top: 8px; right: 8px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--text); display: grid; place-items: center; cursor: pointer; opacity: .8; } .npv-exp svg { width: 16px; height: 16px; } .npv-exp:hover { opacity: 1; background: var(--soft-h); }
.npv-sec { margin: 8px 0 4px; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); } .npv-sec:first-child { margin-top: 0; }
#npv .qrow { cursor: pointer; } #npv .qrow .grip { color: var(--muted); cursor: grab; font-size: 14px; letter-spacing: -3px; opacity: .6; flex: none; }
#npv .qrow.drag { opacity: .4; } #npv .qrow.over { box-shadow: 0 -2px 0 var(--accent) inset; } #npv .qrow .rm.add { font-size: 18px; }
/* lyrics: the line being sung is pure and bold, the others sit back at 35 % */
#npv .npv-line { font-weight: 700; color: var(--cur-base); opacity: .35; transition: all .3s ease; }
#npv .npv-line.prev, #npv .npv-line.past { color: var(--cur-base); opacity: .35; }
#npv .npv-line:hover { color: var(--cur-base); opacity: .7; }
#npv .npv-line.cur { color: var(--cur-base); opacity: 1; transform: scale(1.03); }
#npv .npv-line .trl { opacity: .85; }
.lyr-line.cur { color: var(--cur-base); }

/* ---------- 1D: player (bars, "hide" button, only the essential icons) ---------- */
#player input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--text) var(--p), var(--track) var(--p)); }
#player input[type=range]:hover::-webkit-slider-runnable-track, #player input[type=range]:focus-visible::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
#player input[type=range]::-moz-range-progress { background: var(--text); } #player input[type=range]:hover::-moz-range-progress { background: var(--accent); }
#player input[type=range]::-webkit-slider-thumb { opacity: 0; } #player input[type=range]:hover::-webkit-slider-thumb, #player input[type=range]:focus-visible::-webkit-slider-thumb { opacity: 1; }
#bViz, #bDj, #bNpv, #bPip { display: none !important; }
#player .right { gap: 2px; }
#bLyr { order: 1; } #bQueue { order: 2; } #bMute { order: 3; } #vol { order: 4; } .volpct { order: 5; } #bFs { order: 6; } #bMore { order: 7; }
/* the portal's "Ocultar" (classroom-hotkey.js) shows up as a small dark circle with a chevron on the cover's corner, only on hover */
#juanjo-classroom-quick-toggle { left: 48px !important; bottom: 44px !important; min-height: 0 !important; width: 22px !important; height: 22px !important; padding: 0 !important; font-size: 0 !important; background: rgba(0,0,0,.72) !important; opacity: 0; transition: opacity .15s; }

body:has(#np:hover) #juanjo-classroom-quick-toggle, #juanjo-classroom-quick-toggle:hover, #juanjo-classroom-quick-toggle:focus-visible { opacity: 1; }
@media (hover: none) { #juanjo-classroom-quick-toggle { opacity: .85; } }
/* bars: separated by shadow, not by a line */
#side { border-right: 0; box-shadow: 1px 0 0 rgba(255,255,255,.05); }
#player { border-top: 0; box-shadow: 0 -8px 24px rgba(0,0,0,.35); }

</style>

// Tracks from YouTube Music carry no catalogue ids: the link finds the artist/album page by name when clicked.
var ONE_ARTIST = /^(tyler, the creator|earth, wind & fire|crosby, stills,? (&|and) nash|simon & garfunkel|hall & oates|florence \+ the machine)$/i;
function artistNames(tr) {      // "Peso Pluma & Tito Double P" -> ["Peso Pluma", "Tito Double P"]
  var a = String(tr.artist || '').trim();
  if (!a) return [];
  if (ONE_ARTIST.test(a)) return [a];
  var out = a.split(/\s*(?:,|&|;|\bfeat\.?|\bft\.?|\bfeaturing\b|\bx\b)\s*/i).map(function (x) { return x.trim(); }).filter(Boolean);
  return out.length ? out : [a];
}
function artistLink(tr, cls) {
  var names = artistNames(tr);
  if (!names.length) return '';
  if (names.length === 1) {
    return tr.artistId ? '<a href="#/artist/' + esc(tr.artistId) + '">' + esc(tr.artist) + '</a>'
      : '<a href="#" data-lka="' + esc(names[0]) + '">' + esc(tr.artist) + '</a>';
  }
  // Several credited artists: each one is its own link (the catalogue id on the track belongs to the first).
  return names.map(function (n, i) {
    return i === 0 && tr.artistId ? '<a href="#/artist/' + esc(tr.artistId) + '">' + esc(n) + '</a>' : '<a href="#" data-lka="' + esc(n) + '">' + esc(n) + '</a>';
  }).join(', ');
}
function albumLink(tr, text) {
  if (!tr.albumId && !tr.album) return esc(text);
  return tr.albumId ? '<a href="#/album/' + esc(tr.albumId) + '">' + esc(text) + '</a>'
    : '<a href="#" data-lkb="' + esc(tr.album) + '" data-lkr="' + esc(primaryArtist(tr)) + '">' + esc(text) + '</a>';
}
function goToArtist(tr) {
  if (tr.artistId) { location.hash = '#/artist/' + tr.artistId; return; }
  api('lookup/artist?name=' + encodeURIComponent(primaryArtist(tr))).then(function (d) { location.hash = '#/artist/' + d.id; })
    .catch(function () { toast(t('noPage')); });
}
function goToAlbum(tr) {
  if (tr.albumId) { location.hash = '#/album/' + tr.albumId; return; }
  api('lookup/album?artist=' + encodeURIComponent(primaryArtist(tr)) + '&title=' + encodeURIComponent(tr.album || tr.title)).then(function (d) { location.hash = '#/album/' + d.id; })
    .catch(function () { toast(t('noPage')); });
}

  if (!a) return;

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  var tr = cur(); if (!tr) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: tr.title, artist: tr.artist, album: tr.album || '',
      artwork: tr.artwork ? [{ src: tr.artwork, sizes: '640x640', type: 'image/jpeg' }] : []
    });
    navigator.mediaSession.setActionHandler('play', function () { audio.play(); });
    navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', function () { next(false); });
    navigator.mediaSession.setActionHandler('seekto', function (d) { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  } catch (e) {}
}

function renderQueue() {

  var sepDone = false;

    if (tr.auto && !sepDone && i > qi) { sepDone = true; sep = '<div class="qsep">' + esc(t('upNextAuto')) + '</div>'; }
    return sep + '<div class="qrow' + (i === qi ? ' playing' : '') + '" data-qi="' + i + '">' + img(tr.artwork) +
      '<div class="m"><div class="tt">' + esc(tr.title) + (tr.auto ? '<span class="auto-tag">AUTO</span>' : '') + '</div><div class="aa">' + esc(tr.artist) + '</div></div>' +
      '<button class="rm" data-rm="' + i + '" aria-label="' + esc(t('remove')) + '">✕</button></div>';

  if (npv.on && npv.tab === 'queue' && $('#npvBody')) $('#npvBody').innerHTML = npvQueueHtml();

function qRemove(i) {
  queue.splice(i, 1);
  if (i < qi) qi--; else if (i === qi) { if (qi >= queue.length) qi = queue.length - 1; if (queue.length) playIndex(qi); else { audio.pause(); audio.removeAttribute('src'); qi = -1; updateNowPlaying(); } }
  renderQueue();
}

function toggleLike(tr) {
  if (isLiked(tr)) { liked = liked.filter(function (x) { return tid(x) !== tid(tr); }); toast(t('unliked_t')); }
  else { liked.unshift(slim(tr)); toast(t('liked_t')); }
  store.set('bm_liked', liked); cloudMark('likes');
  tasteAdd(tr, isLiked(tr) ? 3 : -2, isLiked(tr) ? 'like' : 'unlike');
  if (cur() && tid(cur()) === tid(tr)) updateNowPlaying();
  $$('[data-like]').forEach(function (b) {
    if (b.getAttribute('data-like') === tid(tr)) { var on = isLiked(tr); b.classList.toggle('on', on); b.innerHTML = on ? ICON.heart : ICON.heartO; }
  });
  if (route.name === 'liked') render();
}

/* ================= menu ================= */
var menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, items) {
  closeMenu();
  var m = document.createElement('div'); m.className = 'menu';
  items.forEach(function (it) {
    if (it === '-') { m.appendChild(document.createElement('hr')); return; }
    if (it.head) { var hd = document.createElement('div'); hd.className = 'mhead'; hd.innerHTML = it.head; m.appendChild(hd); return; }
    if (it.label && !it.fn) { var l = document.createElement('div'); l.className = 'lbl'; l.textContent = it.label; m.appendChild(l); return; }
    var b = document.createElement('button'); b.textContent = it.label;
    b.addEventListener('click', function (e) { e.stopPropagation(); closeMenu(); it.fn(); });
    m.appendChild(b);
  });
  document.body.appendChild(m); menuEl = m;
  var mw = m.offsetWidth, mh = m.offsetHeight, left, top;
  if (anchor.pt) {        // right click: the menu opens at the pointer
    left = Math.min(window.innerWidth - mw - 8, Math.max(8, anchor.pt.x));
    top = anchor.pt.y; if (top + mh > window.innerHeight - 8) top = Math.max(8, window.innerHeight - mh - 8);
  } else {
    var r = anchor.getBoundingClientRect();
    left = Math.min(window.innerWidth - mw - 8, Math.max(8, r.right - mw));
    top = r.bottom + 6; if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  }
  m.style.left = left + 'px'; m.style.top = top + 'px';
}
document.addEventListener('click', function (e) { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
window.addEventListener('resize', closeMenu);
$('#main').addEventListener('scroll', closeMenu);

function trackMenu(anchor, tr, pl) {

    { label: t('radio'), fn: function () { startRadio(tr); } },
    { label: isLiked(tr) ? t('unlike') : t('like'), fn: function () { toggleLike(tr); } },
    '-', { label: t('addPl') }
  ];
  playlists.forEach(function (p) { items.push({ label: p.name, fn: function () { addToPlaylist(p, tr); } }); });
  items.push({ label: '+ ' + t('newPl'), fn: function () { newPlaylist(tr); } });
  if (tr.artist || tr.album) items.push('-');
  var names = artistNames(tr);
  if (names.length > 1) names.forEach(function (n, i) { items.push({ label: t('goArtist') + ': ' + n, fn: function () { goToArtist(i === 0 ? tr : { artist: n }); } }); });
  else if (tr.artist) items.push({ label: t('goArtist'), fn: function () { goToArtist(tr); } });
  if (tr.albumId || tr.album) items.push({ label: t('goAlbum'), fn: function () { goToAlbum(tr); } });
  if (pl) { items.push('-'); items.push({ label: t('remove'), fn: function () { pl.tracks = pl.tracks.filter(function (x) { return tid(x) !== tid(tr); }); savePl(); render(); } }); }
  openMenu(anchor, items);
}

function parseRoute() {
  var h = (location.hash || '#/').replace(/^#\/?/, '');
  var parts = h.split('/');
  var name = parts[0] || 'home';
  var arg = decodeURIComponent(parts.slice(1).join('/') || '');
  if (name === 'search') return { name: 'search', q: arg };
  if (['album', 'artist', 'playlist', 'genre'].indexOf(name) >= 0) return { name: name, id: arg };
  if (name === 'liked' || name === 'library' || name === 'albums' || name === 'taste' || name === 'settings') return { name: name };
  return { name: 'home' };
}
function markNav() {
  var key = route.name === 'home' ? 'home' : route.name === 'search' || route.name === 'genre' ? 'search' : route.name === 'playlist' ? 'pl-' + route.id : route.name;
  $$('[data-nav]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-nav') === key); });
}
function render() {
  route = parseRoute();
  lists = [];
  markNav();
  var tok = ++renderToken;
  var q = $('#q');
  if (route.name === 'search') { if (document.activeElement !== q) q.value = route.q; }
  $('#clearQ').classList.toggle('on', !!q.value);

}

// Back / forward next to the search box (they follow the browser history). Chrome's Navigation API says whether
// there is somewhere to go, so the buttons grey out; elsewhere they stay enabled.
(function () {
  var nav = window.navigation;
  function sync() {
    $('#nBack').disabled = !!(nav && 'canGoBack' in nav) && !nav.canGoBack;
    $('#nFwd').disabled = !!(nav && 'canGoForward' in nav) && !nav.canGoForward;
  }
  $('#nBack').addEventListener('click', function () { history.back(); });
  $('#nFwd').addEventListener('click', function () { history.forward(); });
  window.addEventListener('hashchange', sync); window.addEventListener('popstate', sync);
  if (nav && nav.addEventListener) nav.addEventListener('currententrychange', sync);
  sync();
})();

/* ---- search ---- */
function vSearch(tok) {

    view.innerHTML = '<h1 class="page">' + esc(t('explore')) + '</h1><p style="color:var(--muted);margin:-8px 0 20px">' + esc(t('searchhint')) + '</p>' + genreTiles() + legalBlock();
    return;
  }
  view.innerHTML = '<div class="status">' + esc(t('loading')) + '</div>';
  // A pasted Spotify / YouTube link: the server reads its title and artist, and we search for that.
  var linkNote = '';

    ? api('resolve?url=' + encodeURIComponent(q)).then(function (r) {
        linkNote = '<div class="linkbar">🔗 <span>' + esc(t('linkOk').replace('{p}', r.provider === 'spotify' ? 'Spotify' : 'YouTube').replace('{q}', r.query)) + '</span></div>';
        return r.query;
      })

  step.then(function (sq) { return api('search?q=' + encodeURIComponent(sq)); }, function () { throw 'link'; }).then(function (d) {
    if (tok !== renderToken) return;

/* ---- Tus gustos: lo que aprendió y por qué ---- */
function agoText(ms) {
  var m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return t('agoNow');
  var n = m < 60 ? m : m < 1440 ? Math.round(m / 60) : Math.round(m / 1440), u = m < 60 ? 'min' : m < 1440 ? 'h' : 'd';
  return t('agoFmt').replace('{n}', n).replace('{u}', u);
}
function whyText(y) { return ({ listen: 'yListen', ended: 'yEnded', skip: 'ySkip', like: 'yLike', unlike: 'yUnlike', playlist: 'yPlaylist', album: 'yAlbum' }[y]) ? t({ listen: 'yListen', ended: 'yEnded', skip: 'ySkip', like: 'yLike', unlike: 'yUnlike', playlist: 'yPlaylist', album: 'yAlbum' }[y]) : ''; }
function vTaste() {
  var now = Date.now(), all = Object.keys(taste.artists).map(function (k) { var e = taste.artists[k]; return { k: k, n: e.n, s: decayed(e, now), t: e.t }; });
  var pos = all.filter(function (a) { return a.s > 0.4; }).sort(function (a, b) { return b.s - a.s; });
  var neg = all.filter(function (a) { return a.s < -0.4; }).sort(function (a, b) { return a.s - b.s; });
  var gen = Object.keys(taste.genres).map(function (g) { return { g: g, s: decayed(taste.genres[g], now) }; }).filter(function (g) { return g.s > 0.3; }).sort(function (a, b) { return b.s - a.s; });
  var h = '<h1 class="page">🧠 ' + esc(t('tasteHead')) + '</h1><p style="color:var(--muted);margin:-6px 0 18px;max-width:760px;line-height:1.55">' + esc(t('tasteLead')) + '</p>';
  if (!pos.length && !neg.length && !(taste.log || []).length) h += '<div class="empty-lib">' + esc(t('tasteNone')) + '</div>';
  function bars(rows, max, negative) {
    return '<div>' + rows.map(function (a, i) {
      return '<div class="tstat' + (negative ? ' neg' : '') + '"><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(a.n || t('g_' + a.g)) + '<small>' + (a.t ? esc(agoText(a.t)) : '') + '</small></span>' +
        '<span class="bar"><i style="width:' + Math.max(4, Math.min(100, Math.abs(a.s) / max * 100)).toFixed(0) + '%"></i></span><span class="sc">' + (a.s > 0 ? '' : '−') + Math.abs(a.s).toFixed(1) + ' ' + esc(t('pts')) + '</span>' +
        (a.k ? '<button class="fg" data-tforget="' + esc(a.k) + '">' + esc(t('tasteForget')) + '</button>' : '<span></span>') + '</div>';
    }).join('') + '</div>';
  }
  if (pos.length) h += rowTitle(t('tasteArtists')) + bars(pos.slice(0, 15), pos[0].s, false);
  if (gen.length) h += rowTitle(t('tasteGenres')) + bars(gen.map(function (g) { return { g: g.g, s: g.s }; }), gen[0].s, false);
  if (neg.length) h += rowTitle(t('tasteSkipped')) + bars(neg.slice(0, 8), Math.abs(neg[0].s), true);
  var log = (taste.log || []).slice().reverse();
  h += rowTitle(t('tasteActivity')) + (log.length ? '<div>' + log.map(function (e) {
    return '<div class="tlog"><span class="w ' + (e.w > 0 ? 'pos' : 'neg') + '">' + (e.w > 0 ? '+' : '−') + Math.abs(e.w) + '</span><span><b>' + esc(e.n) + '</b>' + (e.s ? ' · ' + esc(e.s) : '') + ' <span style="color:var(--muted)">— ' + esc(whyText(e.y)) + '</span></span><span class="ag">' + esc(agoText(e.t)) + '</span></div>';
  }).join('') + '</div>' : '<div class="empty-lib">' + esc(t('tasteNoLog')) + '</div>');
  h += rowTitle(t('tasteHow')) + '<ul class="thow"><li>' + t('tasteHow1') + '</li><li>' + t('tasteHow2') + '</li><li>' + t('tasteHow3') + '</li><li>' + t('tasteHow4') + '</li><li>' + esc(t('tasteHow5')) + '</li><li>' + t('tasteHow6') + '</li></ul>';
  h += '<div class="btns" style="margin-top:18px"><a class="btn ghost" href="#/library">⚙️ ' + esc(t('library')) + '</a></div>';

  mint: function (t) { return [172 + t * 24, 78, 52 + t * 8]; },
  rainbow: function (t, now) { return [(t * 300 + now / 30) % 360, 85, 58]; },
  neon: function (t) { return [320 - t * 130, 95, 62]; },
  fire: function (t) { return [t * 52, 95, 52 + t * 8]; },
  custom: function (t) { return customColor(t); }
};
// Custom palette: two colors the user picks, mixed in HSL along the shortest way round the hue wheel.
var CUSTOM_DEFAULT = { a: '#ff4d8d', b: '#7c5cff' };
var HEX_RE = /^#[0-9a-f]{6}$/i;

  var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0;
  if (mx !== mn) {
    var d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;

  return [h, s * 100, l * 100];
}
function customColor(t) {

  return [(A[0] + dh * t + 360) % 360, A[1] + (B[1] - A[1]) * t, Math.min(92, Math.max(32, A[2] + (B[2] - A[2]) * t))];
}
function vizSetCustom(a, b) {
  viz.custom = { a: a, b: b }; viz.cA = hexToHsl(a); viz.cB = hexToHsl(b);

var viz = {
  on: false, ctx: null, an: null, freq: null, time: null, raf: 0, cv: null, g: null, w: 0, h: 0,
  gain: Math.max(.4, Math.min(1.6, (+store.get('bm_vizgain', 100) || 100) / 100)), mode: store.get('bm_vizmode', 'bars'), pal: store.get('bm_vizpal', 'mint'), peaks: [], parts: [], bass: 0

var savedCustom = store.get('bm_vizcustom', CUSTOM_DEFAULT);
vizSetCustom(savedCustom && HEX_RE.test(savedCustom.a) ? savedCustom.a : CUSTOM_DEFAULT.a, savedCustom && HEX_RE.test(savedCustom.b) ? savedCustom.b : CUSTOM_DEFAULT.b);

var TAU = Math.PI * 2;
(function () {      // sensitivity of the bars (all modes that read the spectrum)
  var sl = $('#vizSens'); sl.value = Math.round(viz.gain * 100); setRange(sl, (sl.value - 40) / 1.2);

})();

function vizGraph() {

/* ---------- qué se sincroniza ---------- */
/* The algorithm and the activity travel with the account (user's explicit order, 17-nov-2026): per-artist / per-genre summary,
 * songs already heard (last 150), skips (up to 300 songs) and the recent-activity log (last 40). Whatever comes back is validated. */
function cleanSeen(a) { var o = [], seen = {}; (Array.isArray(a) ? a : []).forEach(function (x) { if (typeof x === 'string' && x.length <= 80 && !seen[x]) { seen[x] = 1; o.push(x); } }); return o.slice(-150); }
function cleanSkips(m) { var o = {}; if (m && typeof m === 'object' && !Array.isArray(m)) Object.keys(m).slice(-300).forEach(function (k) { var v = +m[k]; if (k.length <= 80 && v > 0 && v < 1000) o[k] = Math.round(v); }); return o; }
function sumSkips(a, b) { var o = {}; [a || {}, b || {}].forEach(function (m) { Object.keys(m).forEach(function (k) { o[k] = (o[k] || 0) + (+m[k] || 0); }); }); return cleanSkips(o); }
function cleanLog(a) {
  return (Array.isArray(a) ? a : []).filter(function (e) { return e && typeof e.t === 'number' && typeof e.w === 'number'; })
    .map(function (e) { return { t: e.t, n: String(e.n || '').slice(0, 80), w: e.w, y: String(e.y || '').slice(0, 12), s: String(e.s || '').slice(0, 120) }; })
    .sort(function (x, y) { return x.t - y.t; }).slice(-40);
}
function mergeLog(a, b) { var seen = {}, out = []; cleanLog(a).concat(cleanLog(b)).forEach(function (e) { var k = e.t + '|' + e.s; if (!seen[k]) { seen[k] = 1; out.push(e); } }); return cleanLog(out); }
var KINDS = {
  likes: {
    get: function () { return { items: liked.slice(0, 1000) }; },
    set: function (d) { liked = d.items || []; store.set('bm_liked', liked); },
    merge: function (a, b) { var seen = {}, out = []; (a.items || []).concat(b.items || []).forEach(function (x) { if (!seen[tid(x)]) { seen[tid(x)] = 1; out.push(x); } }); return { items: out.slice(0, 1000) }; }
  },
  albums: {
    get: function () { return { items: savedAlbums.slice(0, 500) }; },
    set: function (d) { savedAlbums = d.items || []; store.set('bm_albums', savedAlbums); },
    merge: function (a, b) { var seen = {}, out = []; (a.items || []).concat(b.items || []).forEach(function (x) { if (!seen[x.id]) { seen[x.id] = 1; out.push(x); } }); return { items: out.slice(0, 500) }; }
  },
  taste: {
    get: function () { return { artists: taste.artists, genres: taste.genres, seen: cleanSeen(taste.seen), skips: cleanSkips(taste.skips), log: cleanLog(taste.log) }; },
    set: function (d) { taste.artists = d.artists || {}; taste.genres = d.genres || {}; taste.seen = cleanSeen(d.seen); taste.skips = cleanSkips(d.skips); taste.log = cleanLog(d.log); store.set(TASTE_KEY, taste); try { localStorage.removeItem(RECS_KEY); } catch (e) {} },
    merge: function (a, b) {      // dos dispositivos que nunca se habían visto: se suman, con el decaimiento aplicado
      var now = Date.now();
      function sum(x, y) { var o = {}; [x || {}, y || {}].forEach(function (m) { Object.keys(m).forEach(function (k) { var e = m[k], v = decayed(e, now); if (o[k]) { o[k].s += v; } else { o[k] = { n: e.n, i: e.i || null, s: v, t: now }; } if (e.i && !o[k].i) o[k].i = e.i; }); }); return o; }
      return { artists: sum(a.artists, b.artists), genres: sum(a.genres, b.genres), seen: cleanSeen((a.seen || []).concat(b.seen || [])), skips: sumSkips(a.skips, b.skips), log: mergeLog(a.log, b.log) };
    }
  },
  prefs: {
    get: function () { return { autoplay: autoplay, vizmode: viz.mode, vizpal: viz.pal, vizcustom: viz.custom, lyrprefs: lyrPrefs }; },
    set: function (d) {
      if (typeof d.autoplay === 'boolean') { autoplay = d.autoplay; store.set('bm_autoplay', autoplay); autoplaySync(); }
      if (VIZ_MODES.indexOf(d.vizmode) >= 0) { viz.mode = d.vizmode; store.set('bm_vizmode', viz.mode); }
      if (VIZ_PAL[d.vizpal]) { viz.pal = d.vizpal; store.set('bm_vizpal', viz.pal); }
      if (d.vizcustom && HEX_RE.test(d.vizcustom.a) && HEX_RE.test(d.vizcustom.b)) vizSetCustom(d.vizcustom.a, d.vizcustom.b);
      if (d.lyrprefs && typeof d.lyrprefs === 'object') { lyrPrefs = d.lyrprefs; store.set('bm_lyrprefs', lyrPrefs); }
      vizBuildUI();
    },
    merge: function (a, b) { var o = {}; for (var k in a) o[k] = a[k]; for (var j in b) if (j !== 'lyrprefs') o[j] = b[j]; var lp = {}; for (var x in (a.lyrprefs || {})) lp[x] = a.lyrprefs[x]; for (var y in (b.lyrprefs || {})) lp[y] = b.lyrprefs[y]; o.lyrprefs = lp; return o; }
  }
};

/* ---------- escribir (local -> nube) ---------- */
function cloudMark(kind) {
  // Called from code that also runs while the page starts, before `cloud` exists.
  if (!cloud || cloud.applying || !cloud.user || cloud.state === 'off') return;
  if (kind !== 'playlists') { cloud.sync.ts[kind] = Date.now(); cloudMeta(); }
  var queued = !!cloud.timers[kind];
  clearTimeout(cloud.timers[kind]);
  cloud.timers[kind] = setTimeout(function () { cloud.timers[kind] = null; cloudPush(kind); }, 1500);
  if (!queued) { cloud.pending++; renderAccount(); }
}
function cloudDone(err) {
  cloud.pending = Math.max(0, cloud.pending - 1);
  if (err) cloudFail(err); else if (cloud.state === 'err' && !cloud.pending) { cloud.state = 'in'; cloud.err = ''; }
  renderAccount();
}
function cloudFail(e) {
  cloud.state = 'err'; cloud.err = e && e.code === 'permission-denied' ? 'perm' : 'other';
  console.warn('[music] cloud sync failed:', e && (e.code || e.message || e));
}
function cloudPush(kind) {
  if (!cloud.user || !cloud.refs) { cloudDone(); return; }
  if (kind === 'playlists') return cloudPushPlaylists();
  var K = KINDS[kind]; if (!K) { cloudDone(); return; }
  var doc = K.get(); doc.updatedAt = cloud.sync.ts[kind] || Date.now();
  cloud.refs.kv.doc(kind).set(doc).then(function () { cloudDone(); }, cloudDone);
}
function cloudPushPlaylists() {
  var ops = [], now = Date.now(), live = {};
  playlists.forEach(function (p) {
    live[p.id] = 1;
    var sig = plSig(p);
    if (cloud.plSig[p.id] === sig) return;
    p.updatedAt = now; cloud.plSig[p.id] = sig;
    ops.push(cloud.refs.pls.doc(p.id).set({ name: p.name, tracks: p.tracks.slice(0, 1000), cover: p.cover || null, updatedAt: now }));
  });
  Object.keys(cloud.plSig).forEach(function (id) { if (!live[id]) { delete cloud.plSig[id]; ops.push(cloud.refs.pls.doc(id).delete()); } });
  if (ops.length) store.set('bm_playlists', playlists);
  Promise.all(ops).then(function () { cloudDone(); }, cloudDone);
}

/* ---------- leer (nube -> local) ---------- */
function cloudOnUser(u) {
  if (!u) {
    var had = cloud.sync.uid;
    cloudDetach(); cloud.user = null; cloud.state = 'off'; cloud.err = '';
    if (had) { cloudClearLocal(); toast(t('acctSignedOut')); }       // no dejar los datos de una cuenta en un equipo compartido
    renderAccount(); return;
  }
  cloud.user = u; cloud.state = 'loading'; renderAccount();
  cloudSync(u).then(function () { cloud.state = cloud.state === 'err' ? 'err' : 'in'; renderAccount(); },
    function (e) { cloudFail(e); renderAccount(); });
}
function cloudSync(u) {
  var uid = u.uid, root = cloud.db.collection('music_profiles').doc(uid);
  cloud.refs = { kv: root.collection('kv'), pls: root.collection('playlists') };
  return Promise.all([cloud.refs.kv.get(), cloud.refs.pls.get()]).then(function (res) {
    var rkv = {}, rpl = {};
    res[0].docs.forEach(function (d) { rkv[d.id] = d.data(); });
    res[1].docs.forEach(function (d) { rpl[d.id] = d.data(); });
    var foreign = !!cloud.sync.uid && cloud.sync.uid !== uid;        // lo que hay aquí es de otra cuenta: se reemplaza, no se mezcla
    var first = cloud.sync.uid !== uid;
    if (foreign) cloudClearLocal();
    cloud.applying = true;
    try {
      Object.keys(KINDS).forEach(function (kind) {
        var K = KINDS[kind], r = rkv[kind], mine = cloud.sync.ts[kind] || 0;
        if (!r) { if (!foreign && first) cloud.sync.ts[kind] = Date.now(); return; }       // la nube no tiene nada: se sube lo local
        if (first && !foreign) { K.set(K.merge(K.get(), r)); cloud.sync.ts[kind] = Date.now(); }  // primera vez: unión
        else if ((r.updatedAt || 0) > mine) { K.set(r); cloud.sync.ts[kind] = r.updatedAt; }       // luego: gana lo más reciente
      });
      var local = {}; playlists.forEach(function (p) { local[p.id] = p; });
      Object.keys(rpl).forEach(function (id) {
        var r = rpl[id], l = local[id];
        if (!l) { var n0 = { id: id, name: r.name, tracks: r.tracks || [], updatedAt: r.updatedAt || 0 }; if (r.cover) n0.cover = r.cover; playlists.push(n0); }
        else if ((r.updatedAt || 0) > (l.updatedAt || 0)) { l.name = r.name; l.tracks = r.tracks || []; l.updatedAt = r.updatedAt; if (r.cover) l.cover = r.cover; else delete l.cover; }
        var p2 = playlists.filter(function (p) { return p.id === id; })[0];
        cloud.plSig[id] = plSig(p2);
      });
      store.set('bm_playlists', playlists);
    } finally { cloud.applying = false; }
    cloud.sync.uid = uid; cloudMeta();
    renderSidebar(); updateNowPlaying(); if (route.name !== 'search') render();
    cloudAttach();
    Object.keys(KINDS).forEach(function (kind) { if (!rkv[kind] || first) cloudMark(kind); });    // sube lo que la nube no tenía o se mezcló
    cloudMark('playlists');
  });
}
function cloudAttach() {
  cloudDetach();
  cloud.unsub.push(cloud.refs.kv.onSnapshot(function (snap) {
    snap.docChanges().forEach(function (c) {
      if (c.type === 'removed' || c.doc.metadata.hasPendingWrites) return;
      var r = c.doc.data(), K = KINDS[c.doc.id];
      if (!K || (r.updatedAt || 0) <= (cloud.sync.ts[c.doc.id] || 0)) return;       // es nuestro eco o algo más viejo
      cloud.applying = true; try { K.set(r); cloud.sync.ts[c.doc.id] = r.updatedAt; cloudMeta(); } finally { cloud.applying = false; }
      if (route.name === 'home' || route.name === 'liked' || route.name === 'library' || route.name === 'albums') render();
    });
  }, function () {}));
  cloud.unsub.push(cloud.refs.pls.onSnapshot(function (snap) {
    var changed = false;
    snap.docChanges().forEach(function (c) {
      if (c.doc.metadata.hasPendingWrites) return;
      var id = c.doc.id, r = c.doc.data(), i = -1;
      playlists.forEach(function (p, k) { if (p.id === id) i = k; });
      if (c.type === 'removed') { if (i >= 0) { playlists.splice(i, 1); delete cloud.plSig[id]; changed = true; } return; }
      if (i >= 0 && (r.updatedAt || 0) <= (playlists[i].updatedAt || 0)) return;
      var np = { id: id, name: r.name, tracks: r.tracks || [], updatedAt: r.updatedAt || 0 };
      if (r.cover) np.cover = r.cover;
      if (i >= 0) playlists[i] = np; else playlists.push(np);
      cloud.plSig[id] = plSig(np); changed = true;
    });
    if (changed) { store.set('bm_playlists', playlists); renderSidebar(); if (route.name === 'library' || route.name === 'playlist') render(); }
  }, function () {}));
}
function cloudDetach() { cloud.unsub.forEach(function (f) { try { f(); } catch (e) {} }); cloud.unsub = []; }

function cloudClearLocal() {
  ['bm_liked', 'bm_albums', 'bm_playlists', 'bm_taste', 'bm_recs', 'bm_recent', 'bm_lyrprefs', 'bm_sync'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
  liked = []; savedAlbums = []; playlists = []; recent = []; lyrPrefs = {};
  taste = { v: 2, artists: {}, genres: {}, seen: [], skips: {} };
  cloud.sync = { uid: null, ts: {} }; cloud.plSig = {};
  renderSidebar(); updateNowPlaying(); render();
}

/* ================= gustos, recomendaciones y autoplay ================= */
// El gusto se guarda AGREGADO (puntaje por artista y por género, con decaimiento), no como historial: sube menos
// datos y es más privado. 'seen' y 'skips' (ids de canciones) se quedan sólo en este navegador.
var HALF_LIFE_MS = 21 * 86400000;     // lo que escuchaste hace tres semanas pesa la mitad
var TASTE_KEY = 'bm_taste', RECS_KEY = 'bm_recs';
var taste = store.get(TASTE_KEY, null);
if (!taste || taste.v !== 2) taste = { v: 2, artists: {}, genres: {}, seen: [], skips: {} };
var autoplay = store.get('bm_autoplay', true);
var browseGenres = {};                // id de canción -> géneros (filas del Home en las que aparece)
var extending = null;
var lis = null;                       // la canción que se está escuchando

function nk(s) { return String(s == null ? '' : s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function primaryArtist(tr) { return String(tr.artist || '').split(/\s*(?:,|&|;|\bfeat\.?|\bft\.?|\bx\b)\s*/i)[0].trim(); }
function decayed(e, now) { return e.s * Math.pow(0.5, (now - e.t) / HALF_LIFE_MS); }
function dayHash(str) {                // 0..1 estable durante un día: el mix cambia mañana, no en cada recarga
  var h = 0, x = str + '|' + new Date().toISOString().slice(0, 10);
  for (var i = 0; i < x.length; i++) h = (h * 31 + x.charCodeAt(i)) >>> 0;
  return (h % 1000) / 1000;
}

var tasteTimer;
function tasteChanged() {
  clearTimeout(tasteTimer);
  tasteTimer = setTimeout(function () { store.set(TASTE_KEY, taste); cloudMark('taste'); if (route.name === 'taste') render(); if (libFilter === 'ar') renderSidebar(); }, 600);
}
function tasteAdd(tr, w, why) {
  var name = primaryArtist(tr), k = nk(name);
  if (!k || !w) return;
  var now = Date.now();
  // Bitácora de las últimas señales, solo en este navegador (no se sincroniza): es lo que muestra «Tus gustos».
  taste.log = (taste.log || []).concat({ t: now, n: name, w: w, y: why || '', s: tr.title || '' }).slice(-40);
  var a = taste.artists[k] || (taste.artists[k] = { n: name, i: null, s: 0, t: now });
  a.s = decayed(a, now) + w; a.t = now;
  if (tr.artistId) a.i = tr.artistId;
  if (w > 0) (browseGenres[tid(tr)] || []).forEach(function (g) {
    var e = taste.genres[g] || (taste.genres[g] = { s: 0, t: now });
    e.s = decayed(e, now) + w; e.t = now;
  });
  var keys = Object.keys(taste.artists);
  if (keys.length > 120) {
    keys.sort(function (x, y) { return decayed(taste.artists[x], now) - decayed(taste.artists[y], now); });
    keys.slice(0, keys.length - 120).forEach(function (kk) { delete taste.artists[kk]; });
  }
  tasteChanged();
}
function markSeen(tr) {
  var id = tid(tr);
  taste.seen = taste.seen.filter(function (x) { return x !== id; }).concat(id).slice(-150);
}
function tasteScores() {
  var now = Date.now();
  var artists = Object.keys(taste.artists).map(function (k) { var e = taste.artists[k]; return { k: k, n: e.n, id: e.i, s: decayed(e, now) }; })
    .filter(function (a) { return a.s > 0.4; }).sort(function (a, b) { return b.s - a.s; });
  var genres = Object.keys(taste.genres).map(function (g) { return { g: g, s: decayed(taste.genres[g], now) }; })
    .filter(function (g) { return g.s > 0.3; }).sort(function (a, b) { return b.s - a.s; });
  return { artists: artists, genres: genres };
}
// A song stops being listened to: what it meant depends on how long it played and how it ended.
function tasteEnd(reason) {
  if (!lis) return;
  var tr = lis.tr, pos = audio.currentTime || 0;
  var d = (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : tr.duration) || 0;
  lis = null;
  if (reason === 'ended') { tasteAdd(tr, 1.5, 'ended'); markSeen(tr); return; }                 // la escuchó entera
  if (pos >= Math.min(30, d * 0.5 || 30)) { tasteAdd(tr, 1, 'listen'); markSeen(tr); }             // la escuchó de verdad
  else if (pos < 12 && reason === 'skip') { taste.skips[tid(tr)] = (taste.skips[tid(tr)] || 0) + 1; tasteAdd(tr, -0.7, 'skip'); }
}
window.addEventListener('pagehide', function () { tasteEnd('change'); if (tasteTimer) { clearTimeout(tasteTimer); store.set(TASTE_KEY, taste); } });

function indexBrowse(rows) {
  Object.keys(rows || {}).forEach(function (g) {
    (rows[g] || []).forEach(function (tr) { var a = browseGenres[tid(tr)] || (browseGenres[tid(tr)] = []); if (a.indexOf(g) < 0) a.push(g); });
  });
}

/* ---------- candidatos ---------- */
function artistPage(id) { return api('artist/' + encodeURIComponent(id)); }
function similarOf(id) { return api('artist/' + encodeURIComponent(id) + '/similar').then(function (d) { return d.artists || []; }).catch(function () { return []; }); }
function resolveArtistId(a) {          // a: { k, n, id }
  if (a.id) return Promise.resolve(a.id);
  return api('lookup/artist?name=' + encodeURIComponent(a.n)).then(function (d) {
    if (taste.artists[a.k]) { taste.artists[a.k].i = d.id; tasteChanged(); }
    return d.id;
  }).catch(function () { return null; });
}
// Picks n songs from scored candidates: best first, none already in the queue or skipped twice, one version of each
// song, and at most `cap` per artist so one name cannot take the whole list.
function titleKey(tr) { return nk(primaryArtist(tr)) + '|' + nk(String(tr.title).replace(/\(.*?\)|\[.*?\]/g, '')); }
function pickDiverse(pool, n, have, cap) {
  var seen = {}; taste.seen.slice(-40).forEach(function (id) { seen[id] = 1; });
  pool.forEach(function (p) { p.f = p.sc + dayHash(tid(p.tr)) * 0.15 - (seen[tid(p.tr)] ? 0.5 : 0); });
  pool.sort(function (a, b) { return b.f - a.f; });
  var out = [], perA = {}, titles = {};
  pool.forEach(function (p) {
    if (out.length >= n) return;
    var id = tid(p.tr);
    if (have[id] || (taste.skips[id] || 0) >= 2) return;
    var ak = nk(primaryArtist(p.tr)), tk = titleKey(p.tr);
    if (titles[tk] || have['t:' + tk] || (perA[ak] || 0) >= cap) return;   // la misma canción con otro id (single, álbum…) no cuenta como nueva
    titles[tk] = 1; perA[ak] = (perA[ak] || 0) + 1; if (p.why) p.tr._why = p.why; out.push(p.tr);
  });
  return out;
}

/* ---------- "Para ti" ---------- */
function getRecs() {
  var sc = tasteScores(), top = sc.artists.slice(0, 4);
  if (!top.length) return Promise.resolve(null);
  var sig = top.slice(0, 3).map(function (a) { return a.k; }).join(',') + '|' + sc.genres.slice(0, 2).map(function (g) { return g.g; }).join(',');
  var cached = store.get(RECS_KEY, null);
  if (cached && cached.sig === sig && Date.now() - cached.at < 3 * 3600000 && cached.data) return Promise.resolve(cached.data);
  var maxS = top[0].s, topKeys = {};
  top.forEach(function (a) { topKeys[a.k] = 1; });
  return Promise.all(top.map(function (a) {
    return resolveArtistId(a).then(function (id) {
      if (!id) return null;
      return Promise.all([artistPage(id).catch(function () { return null; }), similarOf(id)]).then(function (r) { return { a: a, id: id, page: r[0], sim: r[1] }; });
    });
  })).then(function (parts) {
    parts = parts.filter(Boolean);
    var picks = [];
    parts.slice(0, 3).forEach(function (p) {
      var n = 0;
      p.sim.forEach(function (x) {
        if (n < 2 && !topKeys[nk(x.name)] && !picks.some(function (y) { return y.s.id === x.id; })) { picks.push({ s: x, from: p }); n++; }
      });
    });
    return Promise.all(picks.map(function (x) { return artistPage(x.s.id).catch(function () { return null; }).then(function (pg) { return { x: x, page: pg }; }); })).then(function (simPages) {
      var pool = [], because = {};
      parts.forEach(function (p) {
        var aff = p.a.s / maxS;
        if (p.page) (p.page.tracks || []).forEach(function (tr, i) { pool.push({ tr: tr, sc: 1 * aff - i * 0.03, why: t('whyOwn') + ' ' + p.a.n }); });
      });
      simPages.forEach(function (sp) {
        if (!sp.page) return;
        var aff = sp.x.from.a.s / maxS, list = because[sp.x.from.a.k] || (because[sp.x.from.a.k] = { artist: sp.x.from.a.n, tracks: [] });
        (sp.page.tracks || []).slice(0, 8).forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.6 * aff - i * 0.04, why: t('whySim') + ' ' + sp.x.from.a.n }); list.tracks.push(tr); });
      });
      // exploración: lo más escuchado de tus géneros por artistas que todavía no escuchas
      var explore = api('browse').then(function (d) {
        var known = {}; sc.artists.forEach(function (a) { known[a.k] = 1; });
        sc.genres.slice(0, 2).forEach(function (g) {
          ((d.rows || {})[g.g] || []).filter(function (tr) { return !known[nk(primaryArtist(tr))]; }).slice(0, 8)
            .forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.28 - i * 0.01, why: t('whyExplore') + ' ' + t('g_' + g.g) }); });
        });
      }).catch(function () {});
      return explore.then(function () {
        var mix = pickDiverse(pool, 30, {}, 3);
        var rows = Object.keys(because).map(function (k) { return because[k]; }).map(function (b) {
          var seenT = {}; return { artist: b.artist, tracks: b.tracks.filter(function (tr) { var id = tid(tr); if (seenT[id]) return false; seenT[id] = 1; return true; }).slice(0, 12) };
        }).filter(function (b) { return b.tracks.length >= 4; }).slice(0, 2);
        var cutoff = new Date(Date.now() - 120 * 86400000).toISOString().slice(0, 10), albums = [], aseen = {};
        parts.forEach(function (p) {
          if (!p.page) return;
          (p.page.albums || []).concat(p.page.eps || []).forEach(function (al) { if (al.releaseDate && al.releaseDate >= cutoff && !aseen[al.id]) { aseen[al.id] = 1; albums.push(al); } });
        });
        albums.sort(function (a, b) { return (b.releaseDate || '').localeCompare(a.releaseDate || ''); });
        var artists = parts.filter(function (p) { return p.page && p.page.artist; }).map(function (p) { return { id: p.page.artist.id, name: p.page.artist.name, picture: p.page.artist.picture }; });
        return Promise.all(artists.map(function (a) { return a.picture ? a : findArtistPicture(a).then(function (pic) { a.picture = pic; return a; }); })).then(function (fixed) {
          var data = { mix: mix, because: rows, albums: albums.slice(0, 10), artists: fixed };
          store.set(RECS_KEY, { at: Date.now(), sig: sig, data: data });
          return data;
        });
      });
    });
  });
}
function recoHtml(r) {
  if (!r || !r.mix.length) return '';
  var L = regList(r.mix);
  var h = '<h2 class="row-title"><span>✨ ' + esc(t('forYou')) + ' <a class="why-link" href="#/taste">' + esc(t('tasteWhyLink')) + '</a></span><button class="chip" data-playall="' + L + '">▶ ' + esc(t('playMix')) + '</button></h2>' + trackCardsFor(L, r.mix);
  r.because.forEach(function (b) { h += rowTitle(t('becauseYou') + ' ' + b.artist) + trackCards(b.tracks); });
  if (r.albums.length) h += rowTitle(t('newFromYours')) + albumCards(r.albums);
  if (r.artists.length) h += rowTitle(t('yourArtists')) + artistCards(r.artists);
  return h;
}
function trackCardsFor(L, tracks) {        // as trackCards, but over a list that is already registered
  return '<div class="hrow">' + tracks.map(function (tr, i) {
    return '<div class="card" data-l="' + L + '" data-i="' + i + '" data-cardplay tabindex="0"' + (tr._why ? ' title="' + esc(tr._why) + '"' : '') + '><div class="cv">' + img(tr.artwork) + '<span class="playfab">' + ICON.play + '</span></div>' +
      '<div class="t">' + esc(tr.title) + '</div><div class="s">' + artistLink(tr) + '</div></div>';
  }).join('') + '</div>';
}
function recoFill(tok) {
  var box = $('#recoBox');
  if (!box) return;
  if (!tasteScores().artists.length) { box.innerHTML = '<div class="reco-hint">' + esc(t('homeLearning')) + '</div>'; return; }
  box.innerHTML = rowTitle(t('forYou')) + skeletonRow();
  getRecs().then(function (r) { if (tok === renderToken && $('#recoBox')) $('#recoBox').innerHTML = recoHtml(r); })
    .catch(function () { if ($('#recoBox')) $('#recoBox').innerHTML = ''; });
}

/* ---------- radio y autoplay ---------- */
// Songs that follow `seed`: its artist's best known, similar artists', and a few from what you usually play.
function radioTracks(seed, n) {
  var name = primaryArtist(seed), k = nk(name), sc = tasteScores(), aff = {};
  sc.artists.forEach(function (a) { aff[a.k] = a.s / (sc.artists[0].s || 1); });
  var have = {}; queue.concat([seed]).forEach(function (q) { have[tid(q)] = 1; have['t:' + titleKey(q)] = 1; });
  var ta = taste.artists[k];
  return resolveArtistId({ k: k, n: name, id: seed.artistId || (ta && ta.i) || null }).then(function (id) {
    if (!id) return [];
    return Promise.all([artistPage(id).catch(function () { return null; }), similarOf(id)]).then(function (r) {
      var pool = [];
      if (r[0]) (r[0].tracks || []).forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.9 - i * 0.04 }); });
      var sims = r[1].filter(function (x) { return nk(x.name) !== k; }).slice(0, 5);
      return Promise.all(sims.map(function (x) { return artistPage(x.id).catch(function () { return null; }); })).then(function (pages) {
        pages.forEach(function (pg, si) {
          if (pg) (pg.tracks || []).slice(0, 6).forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.8 - si * 0.04 - i * 0.05 + (aff[nk(primaryArtist(tr))] || 0) * 0.4 }); });
        });
        var rc = store.get(RECS_KEY, null);
        if (rc && rc.data && rc.data.mix) rc.data.mix.slice(0, 8).forEach(function (tr) { pool.push({ tr: tr, sc: 0.55 }); });
        return pickDiverse(pool, n, have, 2);
      });
    });
  }).catch(function () { return []; });
}
function autoFlag(tr) { var s = slim(tr); s.auto = 1; return s; }
// Appends similar songs to the end of the queue; resolves to how many were added. One run at a time.
function autoExtend() {
  if (!autoplay || repeat !== 0) return Promise.resolve(0);
  if (extending) return extending;
  var tr = cur();
  if (!tr) return Promise.resolve(0);
  extending = radioTracks(tr, 12).then(function (list) {
    var have = {}; queue.forEach(function (q) { have[tid(q)] = 1; });
    var add = list.filter(function (x) { return !have[tid(x)]; }).map(autoFlag);
    if (add.length) { queue = queue.concat(add); renderQueue(); }
    return add.length;
  }).catch(function () { return 0; }).then(function (n) { extending = null; return n; });
  return extending;
}
function startRadio(tr) {
  toast(t('radioLoading'));
  radioTracks(tr, 24).then(function (list) {
    if (!list.length) { toast(t('radioNone')); return; }
    playList([tr].concat(list), 0);
    queue = queue.map(function (q, i) { if (i > 0) q.auto = 1; return q; }); renderQueue();
  });
}
function autoplaySync() {
  var b = $('#qAuto');
  b.textContent = t(autoplay ? 'autoplayOn' : 'autoplayOff');
  b.title = t('autoplayT'); b.classList.toggle('on', autoplay); b.setAttribute('aria-pressed', String(autoplay));
}
$('#qAuto').addEventListener('click', function () {
  autoplay = !autoplay; store.set('bm_autoplay', autoplay); cloudMark('prefs'); autoplaySync();
  if (autoplay) autoExtend();
});
function tasteClear() {
  taste = { v: 2, artists: {}, genres: {}, seen: [], skips: {} };
  store.set(TASTE_KEY, taste); try { localStorage.removeItem(RECS_KEY); } catch (e) {}
  cloudMark('taste');
}
api('browse').then(function (d) { indexBrowse(d.rows); }).catch(function () {});

/* ================= init static text ================= */
function applyStatic() {
  $$('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
  $$('[data-ti]').forEach(function (el) { var k = el.getAttribute('data-ti'); var txt = t(k === 'clearQ' ? 'clearQ' : k === 'queue' ? 'queue' : k); el.title = txt; el.setAttribute('aria-label', txt); if (k === 'clearQ') el.textContent = txt; });
  qEl.placeholder = t('ph');
  if (typeof inst !== 'undefined' && inst) instSync();      // the install button's label follows the language
}
applyStatic(); vizBuildUI(); autoplaySync(); renderAccount(); syncModes(); applyVol(); syncPlayBtn(); updateNowPlaying(); renderSidebar(); renderQueue();
/* ---- installable app (PWA): the browser's own install, no store needed ---- */
var inst = { ev: window.__bip || null, ios: /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream,
  standalone: (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true };
function instCan() { return !inst.standalone && !!(inst.ev || inst.ios); }
function instBoxHtml() {
  var body = inst.standalone ? '<p>' + esc(t('instHave')) + '</p>'
    : instCan() ? '<p>' + esc(t('instInfo')) + '</p><div class="btns"><button class="btn" id="setInstall">' + esc(t('instBtn')) + '</button></div>'
    : '<p>' + esc(t('instInfo')) + '</p><p style="color:var(--muted)">' + esc(t('instNone')) + '</p>';
  return '<div class="box" id="instBox"><h3>📲 ' + esc(t('instTitle')) + '</h3>' + body + '</div>';
}
function instSync() {
  var b = $('#installBtn'); if (b) { b.hidden = !instCan(); b.textContent = t('instBtn'); }
  var box = $('#instBox'); if (box) box.outerHTML = instBoxHtml();
}
function instAsk() {
  if (inst.ev) { var e = inst.ev; inst.ev = null; e.prompt(); (e.userChoice || Promise.resolve()).then(function () { instSync(); }); }
  else if (inst.ios) toast(t('instIos'));
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); inst.ev = e; instSync(); });
window.addEventListener('appinstalled', function () { inst.ev = null; inst.standalone = true; toast(t('instDone')); instSync(); });
document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('#installBtn, #setInstall')) instAsk(); });
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
instSync();

sessionRestore();
render();
cloudMaybeInit();

fetch('/api/music/source').then(function (r) { return r.json(); }).then(function (s) {
  if (s.configured && !s.configured.ytm) toast(t('noPlay'));
}).catch(function () {});
})();
