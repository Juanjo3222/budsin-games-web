<title>Budsin Music</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --panel: #12151a;
  --panel2: #181c23;
  --hover: #1f2430;
  --line: #232833;
  --text: #eef0f4;
  --muted: #8d95a6;
  --accent: #25d0b4;
  --accent2: #1fa7d8;
  --danger: #ff5d6c;
  --side: 232px;
  --player: 84px;
  --nav: 0px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 1em; height: 1em; fill: currentColor; display: block; }

/* ---------- layout ---------- */
#app {
  display: grid;
  grid-template-columns: var(--side) 1fr;
  grid-template-rows: 1fr var(--player);
  grid-template-areas: "side main" "player player";
  height: 100%;
}
#side { grid-area: side; background: #080a0c; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; border-right: 1px solid var(--line); }
#main { grid-area: main; overflow-y: auto; position: relative; scroll-behavior: smooth; background: linear-gradient(180deg, rgba(var(--tint, 37,208,180), .22) 0, rgba(var(--tint, 37,208,180), 0) 380px) no-repeat; transition: --tint .6s; }
#player { grid-area: player; }

.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; font-weight: 800; font-size: 1.15rem; letter-spacing: -.3px; }
.brand .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; color: #04201b; font-size: 18px; }
.brand b { color: var(--accent); }
.navlink { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: .95rem; }
.navlink svg { font-size: 22px; }
.navlink:hover { color: var(--text); background: var(--panel); }
.navlink.active { color: var(--text); background: var(--panel2); }
.sect { margin: 18px 12px 6px; font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: #5f6777; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.sect button { color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.sect button:hover { color: var(--text); background: var(--panel2); }
.plist { display: flex; flex-direction: column; gap: 2px; }
.plist .navlink { padding: 8px 12px; font-weight: 500; }
.plist .navlink span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { margin-top: auto; padding: 14px 10px 4px; font-size: .7rem; color: #566; line-height: 1.5; }
.side-foot a { color: #7f93c9; text-decoration: underline; }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 28px;
  background: linear-gradient(to bottom, rgba(11,13,16,.96) 70%, rgba(11,13,16,0));
  backdrop-filter: blur(8px);
}
.back { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; padding: 8px 12px; border-radius: 999px; background: var(--panel); white-space: nowrap; }
.back:hover { color: var(--text); background: var(--panel2); }
.searchbox { flex: 1; max-width: 520px; position: relative; }
.searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; pointer-events: none; }
.searchbox input {
  width: 100%; padding: 11px 38px 11px 42px; border-radius: 999px;
  border: 1px solid transparent; background: var(--panel2); color: var(--text); font-size: .95rem;
}
.searchbox input:focus { border-color: var(--accent); background: var(--panel); outline: none; }
.searchbox .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: none; place-items: center; }
.searchbox .clear.on { display: grid; }
.searchbox .clear:hover { color: var(--text); background: var(--hover); }

.view { padding: 4px 28px 40px; max-width: 1400px; margin: 0 auto; }
h1.page { font-size: 1.9rem; margin: 6px 0 16px; letter-spacing: -.03em; font-weight: 800; }
button, input, select, textarea { font-family: inherit; }
h2.row-title { font-size: 1.25rem; margin: 30px 0 12px; letter-spacing: -.3px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h2.row-title a { font-size: .8rem; font-weight: 600; color: var(--muted); }
h2.row-title a:hover { color: var(--text); text-decoration: underline; }

/* ---------- chips ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 16px; border-radius: 999px; background: var(--panel2); font-size: .86rem; font-weight: 600; color: #cfd4df; }
.chip:hover { background: var(--hover); }
.chip.on { background: var(--text); color: #0b0d10; }

/* ---------- hero ---------- */
.hero { position: relative; border-radius: 20px; overflow: hidden; margin: 10px 0 6px; min-height: 250px; display: flex; align-items: flex-end; background: var(--panel); isolation: isolate; }
.hero .bgimg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(46px) saturate(1.4); opacity: .55; z-index: -2; transform: scale(1.2); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,10,12,.85), rgba(8,10,12,.25)); z-index: -1; }
.hero-in { display: flex; gap: 24px; align-items: flex-end; padding: 26px; width: 100%; }
.hero img { width: 200px; height: 200px; border-radius: 14px; object-fit: cover; box-shadow: 0 14px 40px rgba(0,0,0,.55); flex: none; background: #222; }
.hero small { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--accent); font-weight: 800; }
.hero h2 { font-size: 2.4rem; margin: 6px 0 4px; letter-spacing: -1px; line-height: 1.05; }
.hero p { margin: 0 0 16px; color: #c4cad6; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 999px; font-weight: 700; font-size: .92rem; background: var(--accent); color: #04201b; }
.btn:hover { filter: brightness(1.1); transform: scale(1.02); }
.btn.ghost { background: rgba(255,255,255,.1); color: var(--text); }
.btn.ghost:hover { background: rgba(255,255,255,.18); }
.btn svg { font-size: 18px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 22px; color: var(--muted); }
.iconbtn:hover { color: var(--text); background: var(--panel2); }
.iconbtn.on { color: var(--accent); }

/* ---------- horizontal rows & cards ---------- */
.hrow { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: #2a303c transparent; }
.card { flex: none; width: 164px; scroll-snap-align: start; padding: 12px; border-radius: 14px; background: var(--panel); transition: background .15s; cursor: pointer; position: relative; }
.card:hover { background: var(--panel2); }
.card .cv { position: relative; width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #222; margin-bottom: 10px; }
.card .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.round .cv { border-radius: 50%; }
.card.round { text-align: center; }
.card .playfab { position: absolute; right: 8px; bottom: 8px; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #04201b; display: grid; place-items: center; font-size: 22px; opacity: 0; transform: translateY(8px); transition: .18s; box-shadow: 0 6px 16px rgba(0,0,0,.5); }
.card:hover .playfab, .card:focus-within .playfab { opacity: 1; transform: none; }
.card .t { font-weight: 700; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s { font-size: .8rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s a:hover { text-decoration: underline; color: var(--text); }

/* ---------- genre tiles ---------- */
.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.tile { position: relative; overflow: hidden; border-radius: 14px; min-height: 110px; padding: 16px; font-weight: 800; font-size: 1.15rem; cursor: pointer; display: flex; align-items: flex-start; }
.tile:hover { filter: brightness(1.12); }
.tile .em { position: absolute; right: -6px; bottom: -8px; font-size: 3.4rem; transform: rotate(18deg); opacity: .9; }

/* ---------- top 10 ---------- */
.top10 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.top10 .tr .idx { font-size: 1.15rem; font-weight: 800; color: var(--accent); }

/* ---------- track list ---------- */
.tracks { display: flex; flex-direction: column; }
.tr { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px 52px 36px; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 10px; cursor: pointer; }
.tr.has-album { grid-template-columns: 36px minmax(0, 2fr) minmax(0, 1fr) 36px 52px 36px; }
.tr:hover { background: var(--panel2); }
.tr.playing { background: rgba(37,208,180,.1); }
.tr.playing .tt { color: var(--accent); }
.tr .idx { text-align: center; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.tr .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tr .who img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #222; flex: none; }
.tr .who .m { min-width: 0; }
.tr .tt { font-size: .95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.tr .aa { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr .aa a:hover { text-decoration: underline; color: var(--text); }
.tr .alb { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr .alb a:hover { text-decoration: underline; color: var(--text); }
.tr .dur { color: var(--muted); font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }
.tr .like, .tr .more { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 19px; opacity: .0; }
.tr:hover .like, .tr:hover .more, .tr .like.on, .tr:focus-within .more, .tr:focus-within .like { opacity: 1; }
.tr .like.on { color: var(--accent); }
.tr .like:hover, .tr .more:hover { color: var(--text); background: var(--hover); }
.tr .like.on:hover { color: var(--accent); }
.exp { font-size: .6rem; background: #3a404d; color: #ddd; padding: 1px 5px; border-radius: 3px; font-weight: 800; flex: none; }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.eq i { width: 3px; background: var(--accent); animation: eq 1s infinite ease-in-out; border-radius: 1px; }
.eq i:nth-child(1) { height: 60%; animation-delay: -.2s; } .eq i:nth-child(2) { height: 100%; animation-delay: -.5s; } .eq i:nth-child(3) { height: 40%; animation-delay: -.8s; }
@keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.paused .eq i { animation-play-state: paused; }

/* ---------- headers (album / artist / playlist) ---------- */
.phead { display: flex; gap: 24px; align-items: flex-end; padding: 18px 0 8px; }
.phead .art { width: 220px; height: 220px; border-radius: 14px; object-fit: cover; background: #222; box-shadow: 0 16px 44px rgba(0,0,0,.55); flex: none; }
.phead .art.round { border-radius: 50%; }
.phead .ph-fallback { width: 220px; height: 220px; flex: none; display: grid; place-items: center; font-size: 5rem; font-weight: 800; background: linear-gradient(135deg, #2c3342, #1a1f29); border-radius: 50%; color: #6b7387; }
.phead small { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--accent); font-weight: 800; }
.phead h1 { font-size: 2.8rem; margin: 6px 0 8px; letter-spacing: -1.2px; line-height: 1.05; overflow-wrap: anywhere; }
.phead .meta { color: #b6bcc9; font-size: .9rem; margin-bottom: 16px; }
.phead .meta a:hover { text-decoration: underline; color: var(--text); }
.actions { display: flex; gap: 10px; align-items: center; margin: 14px 0 10px; }

/* ---------- misc ---------- */
.status { padding: 50px 10px; text-align: center; color: var(--muted); }
.status .big { font-size: 2.6rem; margin-bottom: 8px; }
.status button { margin-top: 14px; }
.skel { height: 164px; flex: none; width: 164px; border-radius: 14px; background: linear-gradient(90deg, var(--panel) 25%, var(--panel2) 50%, var(--panel) 75%); background-size: 200% 100%; animation: sh 1.3s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.empty-lib { color: var(--muted); padding: 24px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; }

#toast { position: fixed; left: 50%; bottom: calc(var(--player) + var(--nav) + 18px); transform: translate(-50%, 20px); background: #e8ebf2; color: #0b0d10; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .88rem; opacity: 0; pointer-events: none; transition: .22s; z-index: 200; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

.menu { position: fixed; z-index: 300; min-width: 210px; max-width: 260px; background: #1b1f29; border: 1px solid #2c3342; border-radius: 12px; padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
.menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu button:hover { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
.menu .lbl { padding: 6px 12px 3px; font-size: .68rem; text-transform: uppercase; color: #667; letter-spacing: .08em; font-weight: 700; }

/* ---------- player bar ---------- */
#player { background: #0a0c10; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(180px, 1fr) minmax(300px, 1.5fr) minmax(180px, 1fr); align-items: center; gap: 14px; padding: 0 18px; position: relative; z-index: 40; }
.np { display: flex; align-items: center; gap: 12px; min-width: 0; }
.np img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #222; flex: none; }
.np .m { min-width: 0; }
.np .tt { font-weight: 600; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .tt a:hover { text-decoration: underline; }
.np .aa { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .aa a:hover { text-decoration: underline; color: var(--text); }
.ctrl { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.ctrl .row { display: flex; align-items: center; gap: 8px; }
.ctrl .iconbtn { width: 36px; height: 36px; font-size: 20px; }
.ctrl .main { width: 44px; height: 44px; background: var(--text); color: #0b0d10; font-size: 24px; }
.ctrl .main:hover { transform: scale(1.06); background: #fff; color: #000; }
.seek { display: flex; align-items: center; gap: 10px; width: 100%; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek span { width: 38px; }
.seek span:first-child { text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 16px; cursor: pointer; flex: 1; margin: 0; --p: 0%; min-width: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--text) var(--p), #353b49 var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: #353b49; }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; margin-top: -4px; opacity: 0; transition: opacity .1s; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; opacity: 0; }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { opacity: 1; }
input[type=range]:hover { --c: var(--accent); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(0,0,0,.18); border-top-color: #0b0d10; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.np .ld { display: none; font-size: .78rem; color: var(--accent); font-weight: 600; }
#player.loading .np .ld { display: block; }
#player.loading .np .aa { display: none; }
#player.loading .seek input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, #353b49 0%, var(--accent) 50%, #353b49 100%); background-size: 200% 100%; animation: sh 1s linear infinite; }
.right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.right input[type=range] { max-width: 110px; flex: none; width: 110px; }
.right .iconbtn { font-size: 20px; width: 36px; height: 36px; }

/* ---------- queue panel ---------- */
#queue { position: fixed; right: 0; top: 0; bottom: var(--player); width: 360px; max-width: 100%; background: #0e1116; border-left: 1px solid var(--line); z-index: 50; transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column; }
#queue.on { transform: none; }
#queue header { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 8px; font-weight: 800; font-size: 1.1rem; }
#queue .body { overflow-y: auto; padding: 4px 8px 16px; flex: 1; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
.qrow:hover { background: var(--panel2); }
.qrow.playing { background: rgba(37,208,180,.1); }
.qrow img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #222; flex: none; }
.qrow .m { flex: 1; min-width: 0; }
.qrow .tt { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow.playing .tt { color: var(--accent); }
.qrow .aa { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .rm { width: 28px; height: 28px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; font-size: 16px; }
.qrow .rm:hover { background: var(--hover); color: var(--text); }

.legal { font-size: .72rem; color: #5f6777; line-height: 1.5; padding: 24px 0 0; border-top: 1px solid var(--line); margin-top: 40px; }
.legal a { color: #7f93c9; text-decoration: underline; }

/* ---------- visualizer ---------- */
.only-m { display: none; }
#viz { position: fixed; left: 0; right: 0; top: 0; bottom: var(--player); z-index: 35; background: #07090c; display: none; flex-direction: column; overflow: hidden; }
#viz.on { display: flex; }
#viz:fullscreen { bottom: 0; }
.viz-bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(70px) saturate(1.3); opacity: .3; transform: scale(1.2); transition: background-image .4s; }
#vizCv { position: relative; flex: 1; width: 100%; min-height: 0; display: block; }
.viz-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; z-index: 2; background: linear-gradient(to bottom, rgba(7,9,12,.85), transparent); }
.viz-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
.viz-info img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #222; flex: none; }
.viz-info .tt { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viz-info .aa { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viz-info .m { min-width: 0; }
.viz-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 24px; padding: 40px 18px 18px; z-index: 2; background: linear-gradient(to top, rgba(7,9,12,.9) 40%, transparent); }
.viz-modes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.viz-colors { display: flex; gap: 10px; align-items: center; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
.swatch:hover { transform: scale(1.12); }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
.swatch.custom { position: relative; }
.swatch.custom span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
.viz-pop { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); bottom: 96px; display: none; flex-direction: column; gap: 10px; padding: 14px 16px; min-width: 220px; background: #171b24; border: 1px solid #2c3342; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
.viz-pop.on { display: flex; }
.viz-pop label { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: .86rem; color: #cfd4df; }
.viz-pop input[type=color] { width: 48px; height: 30px; padding: 0; border: 2px solid #2c3342; border-radius: 8px; background: none; cursor: pointer; }
.viz-pop .prev { height: 10px; border-radius: 6px; }
.viz-pop .chip { align-self: center; }
.viz-tr { display: flex; align-items: center; gap: 4px; }
.viz-tr .iconbtn { color: var(--text); }
.viz-tr .main { width: 44px; height: 44px; background: var(--text); color: #0b0d10; }
.viz-idle { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 1rem; pointer-events: none; text-align: center; padding: 0 30px; }
.np img { cursor: pointer; }
.viz-cap { position: absolute; left: 0; right: 0; top: 70px; height: 76px; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 0 5vw; z-index: 1; pointer-events: none; text-shadow: 0 2px 14px rgba(0,0,0,.85); overflow: hidden; }
.viz-cap .cur { font-size: clamp(1.1rem, 2.4vw, 1.9rem); font-weight: 800; line-height: 1.2; }
.viz-cap .nxt { margin-top: 6px; font-size: clamp(.82rem, 1.5vw, 1.05rem); color: rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- recommendations & account ---------- */
.reco-hint { margin: 18px 0 4px; padding: 14px 18px; border-radius: 14px; background: var(--panel); color: var(--muted); font-size: .92rem; }
.row-title .chip { font-size: .78rem; padding: 6px 14px; }
.qsep { padding: 10px 10px 4px; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
.qrow .auto-tag { font-size: .6rem; background: var(--panel2); color: var(--muted); padding: 1px 6px; border-radius: 999px; margin-left: 6px; font-weight: 700; vertical-align: middle; }
#queue header .chip { font-size: .72rem; padding: 5px 11px; margin-right: 6px; }
#queue header .chip.on { background: var(--accent); color: #04201b; }
.box { margin-top: 26px; padding: 18px; border-radius: 14px; background: var(--panel); }
.box h3 { margin: 0 0 6px; font-size: 1.05rem; }
.box p { margin: 0 0 14px; color: var(--muted); font-size: .88rem; line-height: 1.5; }
.box .btns { gap: 10px; }
.acct { margin: 14px 4px 0; padding: 12px; border-radius: 12px; background: var(--panel); font-size: .8rem; line-height: 1.45; }
.acct .who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.acct img.av { width: 34px; height: 34px; border-radius: 50%; background: #222; object-fit: cover; flex: none; }
.acct .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .em { color: var(--muted); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .sync { color: var(--muted); font-size: .74rem; margin-bottom: 8px; }
.acct .sync.ok { color: var(--accent); }
.acct .sync.err { color: var(--danger); }
.acct .sub { color: var(--muted); margin-bottom: 10px; }
.acct .btn { padding: 8px 14px; font-size: .8rem; }
.acct .linkbtn { color: var(--muted); font-size: .72rem; text-decoration: underline; margin-left: 6px; }
.acct .linkbtn:hover { color: var(--text); }
#acctLib { display: none; }   /* en escritorio la cuenta ya está en la barra lateral */

/* ---------- album save & artist avatar ---------- */
.card .cv .albsave { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(8,10,12,.72); color: #fff; display: grid; place-items: center; font-size: 18px; line-height: 1; opacity: 0; transition: .15s; cursor: pointer; z-index: 2; backdrop-filter: blur(4px); }
.card:hover .albsave, .card:focus-within .albsave, .albsave.on { opacity: 1; }
.albsave:hover { background: var(--accent); color: #04201b; }
.albsave.on { background: var(--accent); color: #04201b; }
.cv.ph-av { display: grid; place-items: center; background: linear-gradient(135deg, #2c3342, #1a1f29); color: #7b869c; font-size: 3.2rem; font-weight: 800; }
.grid-albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 16px; }
.grid-albums .card { width: auto; }
@media (max-width: 760px) { .card .cv .albsave { opacity: 1; } .grid-albums { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); } }

/* ---------- Tus gustos ---------- */
.linkbar { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 9px 14px; border-radius: 10px; background: var(--surface, rgba(255,255,255,.06)); color: var(--muted); font-size: .88rem; }
.linkbar b { color: var(--text, #fff); }
.why-link { font-size: .78rem; font-weight: 600; color: var(--muted); margin-left: 8px; text-decoration: underline; }
.why-link:hover { color: var(--text); }
.tstat { display: grid; grid-template-columns: 28px minmax(0, 1.1fr) minmax(0, 2fr) 70px auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; }
.tstat:hover { background: var(--panel); }
.tstat .rk { color: var(--accent); font-weight: 800; text-align: center; }
.tstat .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tstat .nm small { display: block; color: var(--muted); font-weight: 400; font-size: .72rem; }
.tstat .bar { height: 10px; border-radius: 6px; background: var(--panel2); overflow: hidden; }
.tstat .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.tstat.neg .bar i { background: linear-gradient(90deg, #ff5d6c, #ff9b5d); }
.tstat .sc { text-align: right; font-variant-numeric: tabular-nums; color: #cfd4df; font-size: .88rem; }
.tstat .fg { color: var(--muted); font-size: .75rem; text-decoration: underline; }
.tstat .fg:hover { color: var(--danger); }
.tlog { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: .9rem; }
.tlog:nth-child(odd) { background: var(--panel); }
.tlog .w { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 42px; }
.tlog .w.pos { color: var(--accent); }
.tlog .w.neg { color: var(--danger); }
.tlog .ag { margin-left: auto; color: var(--muted); font-size: .76rem; white-space: nowrap; }
.thow { margin: 0; padding-left: 20px; color: #c8cedb; line-height: 1.8; font-size: .92rem; }
.thow b { color: var(--text); }
@media (max-width: 760px) { .tstat { grid-template-columns: 22px 1fr 56px auto; } .tstat .bar { grid-column: 2 / 4; grid-row: 2; } .tstat .fg { grid-row: 1; grid-column: 4; } }

/* ---------- playlist covers ---------- */
.pl-art { width: 100%; height: 100%; display: grid; place-items: center; font-size: 3rem; color: #fff; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; }
.mosaic img, .plthumb img, .plhead-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.plhead-art { position: relative; width: 220px; height: 220px; border-radius: 14px; overflow: hidden; flex: none; background: #222; box-shadow: 0 16px 44px rgba(0,0,0,.55); }
.plhead-art .pl-art { font-size: 5.5rem; }
.plhead-edit { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 10px; background: linear-gradient(to top, rgba(0,0,0,.82), transparent); color: #fff; font-weight: 700; font-size: .85rem; opacity: 0; transition: .15s; cursor: pointer; }
.plhead-art:hover .plhead-edit, .plhead-edit:focus-visible { opacity: 1; }
.plthumb { width: 28px; height: 28px; border-radius: 6px; overflow: hidden; flex: none; background: #222; }
.plthumb .pl-art { font-size: 15px; }
.plthumb .mosaic { grid-template-columns: 1fr 1fr; }
#plmodal { position: fixed; inset: 0; z-index: 160; background: rgba(4,6,9,.72); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 18px; }
#plmodal.on { display: flex; }
.plm-card { width: min(520px, 100%); max-height: 92vh; overflow-y: auto; background: #12161d; border: 1px solid #2a3140; border-radius: 18px; padding: 18px 18px 22px; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
.plm-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 1.1rem; }
.plm-top { display: flex; gap: 16px; align-items: center; margin-bottom: 6px; }
.plm-prev { width: 120px; height: 120px; border-radius: 12px; overflow: hidden; flex: none; background: #222; }
.plm-prev .pl-art { font-size: 3.4rem; }
.plm-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.plm-sec { margin: 18px 0 8px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.plm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.plm-song { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #222; border: 2px solid transparent; padding: 0; }
.plm-song img { width: 100%; height: 100%; object-fit: cover; display: block; }
.plm-song:hover { border-color: var(--accent); }
.plm-none { color: var(--muted); font-size: .85rem; grid-column: 1 / -1; }
.plm-grads, .plm-emojis { display: flex; flex-wrap: wrap; gap: 8px; }
.plm-g { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
.plm-g.on, .plm-e.on { border-color: #fff; }
.plm-e { width: 40px; height: 40px; border-radius: 10px; font-size: 1.35rem; background: var(--panel2); border: 2px solid transparent; }
.plm-e:hover, .plm-g:hover { transform: scale(1.08); }
@media (max-width: 760px) { .plhead-art { width: 180px; height: 180px; } .plhead-edit { opacity: 1; } }

/* ---------- lyrics ---------- */
#lyrics { position: fixed; left: 0; right: 0; top: 0; bottom: var(--player); z-index: 36; background: #07090c; display: none; flex-direction: column; overflow: hidden; }
#lyrics.on { display: flex; }
.lyr-bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(80px) saturate(1.3); opacity: .32; transform: scale(1.2); }
.lyr-top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; background: linear-gradient(to bottom, rgba(7,9,12,.85), transparent); flex: none; }
#lyrBody { position: relative; flex: 1; overflow-y: auto; padding: 0 22px; scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); }
#lyrBody::-webkit-scrollbar { display: none; }
.lyr-pad { max-width: 780px; margin: 0 auto; padding: 38vh 0 38vh; }
.lyr-line { margin: 0; padding: 7px 0; font-size: clamp(1.35rem, 2.7vw, 2.3rem); font-weight: 800; line-height: 1.22; letter-spacing: -.4px; color: rgba(255,255,255,.34); transition: color .25s, transform .25s; transform-origin: left center; cursor: pointer; overflow-wrap: anywhere; }
.lyr-line:hover { color: rgba(255,255,255,.7); }
.lyr-line.cur { color: #fff; transform: scale(1.04); }
.lyr-plain { white-space: pre-wrap; font-size: 1.15rem; line-height: 1.85; color: #d5d9e2; padding-bottom: 20px; }
.lyr-note { display: inline-block; margin-bottom: 16px; padding: 4px 12px; border-radius: 999px; background: var(--panel2); color: var(--muted); font-size: .78rem; }
.lyr-msg { text-align: center; color: var(--muted); padding: 30px 0; font-size: 1.05rem; }
.lyr-msg .big { font-size: 2.6rem; margin-bottom: 8px; }
.lyr-credit { position: relative; text-align: center; font-size: .72rem; color: #566; padding: 0 0 28px; }
.lyr-credit a { color: #7f93c9; text-decoration: underline; }
.lyr-pad.plain-pad { padding: 18px 0 24px; }
.lyr-tools { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; margin-right: 6px; }
#lyrics:not(.has-sync) .lyr-tools { display: none; }
.lyr-off { display: inline-flex; align-items: center; background: var(--panel2); border-radius: 999px; padding: 2px; }
.lyr-off button { width: 30px; height: 30px; border-radius: 50%; font-size: 1.15rem; line-height: 1; color: var(--text); }
.lyr-off button:hover { background: var(--hover); }
.lyr-off span { min-width: 52px; text-align: center; font-size: .78rem; font-variant-numeric: tabular-nums; color: #cfd4df; cursor: pointer; }
.lyr-tools .chip { padding: 7px 13px; font-size: .78rem; }

/* ---------- tablet / mobile ---------- */
@media (max-width: 960px) {
  .top10 { grid-template-columns: 1fr; }
  .tr.has-album { grid-template-columns: 36px minmax(0, 1fr) 36px 52px 36px; }
  .tr .alb { display: none; }
}
@media (max-width: 760px) {
  :root { --player: 80px; --nav: 58px; }
  #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; grid-template-areas: "main" "player"; padding-bottom: var(--nav); }
  #side { position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav); flex-direction: row; padding: 0; z-index: 60; border-right: 0; border-top: 1px solid var(--line); background: #080a0c; overflow: visible; gap: 0; justify-content: space-around; }
  #side .brand, #side .sect, #side .plist, #side .side-foot, #side .nav-desktop, #side .acct { display: none; }
  #side .navlink { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: .68rem; flex: 1; justify-content: center; border-radius: 0; background: none !important; }
  #side .navlink svg { font-size: 22px; }
  #side .navlink.active { color: var(--accent); }
  #player { grid-template-columns: 1fr; grid-template-rows: auto auto; gap: 2px; padding: 8px 12px 6px; height: auto; align-content: center; }
  .np img { width: 44px; height: 44px; }
  .right { display: none; }
  .ctrl { flex-direction: column-reverse; gap: 0; }
  .np { padding-right: 124px; gap: 8px; }
  .np .iconbtn { width: 34px; height: 34px; font-size: 19px; flex: none; }
  .ctrl .row { position: absolute; right: 10px; top: 14px; gap: 0; }
  .ctrl .row .hide-m { display: none; }
  .seek { margin-top: 2px; }
  .topbar { padding: 10px 14px; }
  .back span { display: none; }
  .view { padding: 2px 14px 30px; }
  h1.page { font-size: 1.5rem; }
  .hero-in { flex-direction: column; align-items: flex-start; gap: 14px; padding: 18px; }
  .hero img { width: 130px; height: 130px; }
  .hero h2 { font-size: 1.7rem; }
  .phead { flex-direction: column; align-items: center; text-align: center; }
  .phead .art, .phead .ph-fallback { width: 180px; height: 180px; }
  .phead h1 { font-size: 1.9rem; }
  .phead .btns, .actions { justify-content: center; }
  .card { width: 138px; padding: 10px; }
  .tr .like, .tr .more { opacity: 1; }
  .tr { grid-template-columns: 26px minmax(0, 1fr) 34px 34px; gap: 8px; padding: 6px 4px; }
  .tr.has-album { grid-template-columns: 26px minmax(0, 1fr) 34px 34px; }
  .tr .dur { display: none; }
  /* Chrome móvil "pega" el toque al enlace más cercano: tocar el título abría el artista en vez de reproducir. */
  .tr .aa a, .tr .alb a { pointer-events: none; }
  #queue { width: 100%; bottom: calc(var(--player) + var(--nav)); }
  #viz { bottom: calc(var(--player) + var(--nav)); }
  #lyrics { bottom: calc(var(--player) + var(--nav)); }
  .lyr-top { padding: 12px 14px; gap: 8px; }
  .lyr-tools { gap: 4px; margin-right: 0; }
  .lyr-off span { min-width: 44px; }
  #lyrBody { padding: 0 16px; }
  .viz-cap { top: 62px; }
  #viz:fullscreen { bottom: 0; }
  .only-m { display: inline-grid; }
  .viz-top { padding: 12px 14px; }
  .viz-bottom { padding: 36px 12px 12px; gap: 10px 16px; }
  .viz-pop { bottom: 150px; }
  #acctLib { display: block; }
  #toast { bottom: calc(var(--player) + var(--nav) + 12px); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

function agoText(ms) {

  return t('agoFmt').replace('{n}', n).replace('{u}', u);
}
function whyText(y) { return ({ listen: 'yListen', ended: 'yEnded', skip: 'ySkip', like: 'yLike', unlike: 'yUnlike', playlist: 'yPlaylist', album: 'yAlbum' }[y]) ? t({ listen: 'yListen', ended: 'yEnded', skip: 'ySkip', like: 'yLike', unlike: 'yUnlike', playlist: 'yPlaylist', album: 'yAlbum' }[y]) : ''; }

  var h = '<h1 class="page">🧠 ' + esc(t('tasteHead')) + '</h1><p style="color:var(--muted);margin:-6px 0 18px;max-width:760px;line-height:1.55">' + esc(t('tasteLead')) + '</p>';

  function bars(rows, max, negative) {

var VIZ_MODES = ['bars', 'mirror', 'wave', 'area', 'circle', 'particles'];

  neon: function (t) { return [320 - t * 130, 95, 62]; },

// Custom palette: two colors the user picks, mixed in HSL along the shortest way round the hue wheel.

}
function customColor(t) {

}
function vizSetCustom(a, b) {

}
var viz = {
  on: false, ctx: null, an: null, freq: null, time: null, raf: 0, cv: null, g: null, w: 0, h: 0,

var savedCustom = store.get('bm_vizcustom', CUSTOM_DEFAULT);
vizSetCustom(savedCustom && HEX_RE.test(savedCustom.a) ? savedCustom.a : CUSTOM_DEFAULT.a, savedCustom && HEX_RE.test(savedCustom.b) ? savedCustom.b : CUSTOM_DEFAULT.b);

/* The audio element goes through an analyser. Built on first open, from the click that opens it: an AudioContext

function vizGraph() {
  if (viz.an) { if (viz.ctx.state === 'suspended') viz.ctx.resume().catch(function () {}); return true; }
  try {

// Average of the bins in slice i of n, on a log scale (bass gets as much width as treble), 0..1.

var VIZ_DRAW = {

function lyrLoad(tr, force) {
  if (!tr) return;

  if (lyr.key !== key) { var pf = lyrPrefs[key] || {}; lyr.off = pf.off || 0; lyr.pick = pf.pick || null; }
  lyr.key = key; lyr.synced = []; lyr.plain = ''; lyr.instr = false; lyr.idx = -1; lyr.id = null;
  var ck = key + '|' + (lyr.pick || '');

  lyr.status = 'loading'; lyrRender(); lyrToolsUpdate(); vizCaption(-1);
  var q = new URLSearchParams({ title: tr.title, artist: tr.artist });
  if (tr.album) q.set('album', tr.album);
  if (tr.duration) q.set('duration', String(tr.duration));
  fetch('/api/music/lyrics?' + (lyr.pick ? 'id=' + encodeURIComponent(lyr.pick) : q.toString())).then(function (r) {
    if (r.status === 404) {
      // "No lyrics found" is the server's answer for a song without lyrics; any other 404 means the server has
      // no lyrics route at all (backend not updated), which is an error, not "this song has none".
      return r.json().then(function (j) {
        if (j && j.error === 'No lyrics found') return { none: true };
        throw new Error('no lyrics route');

    }
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();

  else if (lyr.status === 'none') h = lyrMsg('🎤', t('lyrNone'));

// Protocolo documentado en public/bm-mini.js. Una sola página tiene el audio: la que lo tiene (owner) guarda la
// sesión, manda latidos y obedece órdenes; las demás sólo miran.
var SESSION_KEY = 'bm_session';
var tabId = Math.random().toString(36).slice(2);
var bc = null;
try { bc = new BroadcastChannel('budsin-music'); } catch (e) {}
var owner = false;      // esta página tiene la música
var restoreT = 0;       // desde dónde seguirá una canción restaurada que todavía no se ha cargado

function bcPost(m) { if (bc) { m.id = tabId; try { bc.postMessage(m); } catch (e) {} } }
function bmState() {
  var tr = cur();
  if (!tr) return null;
  var d = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (tr.duration || 0);
  return { track: { id: tr.id, title: tr.title, artist: tr.artist, artwork: tr.artwork }, qi: qi, n: queue.length, pos: audio.getAttribute('src') ? (audio.currentTime || 0) : restoreT, dur: d, playing: !audio.paused };
}
function bmBeat() { if (!owner) return; var st = bmState(); if (st) bcPost({ t: 'hb', from: 'bm', st: st }); }
function sessionSave(closed) {
  if (qi < 0 || !queue.length) return;
  var start = Math.max(0, qi - 3), end = Math.min(queue.length, start + 60);   // una ventana de la cola basta
  store.set(SESSION_KEY, {
    v: 1, ts: Date.now(), owner: 'bm', closed: !!closed, playing: !audio.paused && !!audio.getAttribute('src'),
    qi: qi - start, t: audio.getAttribute('src') ? (audio.currentTime || 0) : restoreT, queue: queue.slice(start, end)
  });
}
function becomeOwner() { owner = true; bcPost({ t: 'claim', from: 'bm', st: bmState() }); }

audio.addEventListener('play', function () { if (!owner) becomeOwner(); bmBeat(); sessionSave(false); });
audio.addEventListener('pause', function () { bmBeat(); sessionSave(false); });
setInterval(bmBeat, 1000);
setInterval(function () { if (owner) sessionSave(false); }, 5000);

if (bc) bc.onmessage = function (e) {
  var m = e.data || {};
  if (!m || m.id === tabId) return;
  if (m.t === 'claim' && owner) { owner = false; if (!audio.paused) audio.pause(); }          // otra página empezó a sonar
  else if (m.t === 'cmd' && owner && m.to === tabId) {
    if (m.a === 'toggle') togglePlay();
    else if (m.a === 'play') { if (audio.paused) togglePlay(); }
    else if (m.a === 'pause') { if (!audio.paused) togglePlay(); }
    else if (m.a === 'next') next(false);
    else if (m.a === 'prev') prev();
    else if (m.a === 'seek' && isFinite(m.v)) audio.currentTime = Math.max(0, Number(m.v));
  }
};

// Al irse (botón "Budsin Games", atrás, cerrar): deja la sesión marcada como cerrada y avisa.
window.addEventListener('pagehide', function () {
  if (!owner) return;
  sessionSave(true);
  bcPost({ t: 'bye', from: 'bm', closed: true, playing: !audio.paused });
});
// "Atrás" puede devolver esta página desde la caché con el audio ya parado: se recarga para retomar la sesión.
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });

function sessionRestore() {
  var s = store.get(SESSION_KEY, null);
  if (!s || s.v !== 1 || !Array.isArray(s.queue) || Date.now() - (s.ts || 0) > 30 * 60000) return;
  var q = s.queue.filter(function (x) { return x && x.id != null && x.title; });
  if (!q.length) return;
  queue = q; qi = Math.max(0, Math.min(s.qi | 0, q.length - 1)); restoreT = Math.max(0, Number(s.t) || 0);
  updateNowPlaying(); updateMediaSession(); renderQueue();
  var gap = (Date.now() - s.ts) / 1000;
  // Venía sonando y se fue hace un momento (Budsin Games, recarga): sigue por donde iba.
  if (s.closed && s.playing && gap < 20) playIndex(qi, { seek: restoreT + gap, auto: true });
}

var PL_GRADS = ['linear-gradient(135deg,#8b5cf6,#ec4899)', 'linear-gradient(135deg,#25d0b4,#1d4ed8)', 'linear-gradient(135deg,#f59e0b,#ef4444)', 'linear-gradient(135deg,#10b981,#065f46)', 'linear-gradient(135deg,#6366f1,#0ea5e9)', 'linear-gradient(135deg,#f472b6,#fb923c)', 'linear-gradient(135deg,#ef4444,#7f1d1d)', 'linear-gradient(135deg,#a3e635,#15803d)', 'linear-gradient(135deg,#64748b,#0f172a)', 'linear-gradient(135deg,#eab308,#a16207)'];

  if (c && c.t === 'img' && typeof c.src === 'string' && PL_IMG_OK.test(c.src)) return img(c.src);
  if (c && c.t === 'grad' && PL_GRADS[c.g]) return '<div class="pl-art" style="background:' + PL_GRADS[c.g] + '">' + esc(PL_EMOJIS.indexOf(c.e) >= 0 ? c.e : '🎶') + '</div>';
  var seen = {}, arts = [];
  (p.tracks || []).forEach(function (tr) { if (tr.artwork && !seen[tr.artwork] && arts.length < 4) { seen[tr.artwork] = 1; arts.push(tr.artwork); } });
  if (arts.length >= 4) return '<div class="mosaic">' + arts.map(function (a) { return img(a); }).join('') + '</div>';
  if (arts.length) return img(arts[0]);

// A picked image becomes a small square JPEG (centered crop) so it stays light in localStorage and in the cloud doc.
function plSquare(im) {
  var side = Math.min(im.naturalWidth, im.naturalHeight);
  if (!side) return null;
  var sx = (im.naturalWidth - side) / 2, sy = (im.naturalHeight - side) / 2, sizes = [360, 300, 240];
  for (var si = 0; si < sizes.length; si++) {
    var c = document.createElement('canvas'); c.width = c.height = sizes[si];
    var g = c.getContext('2d'); g.fillStyle = '#111'; g.fillRect(0, 0, sizes[si], sizes[si]);
    g.drawImage(im, sx, sy, side, side, 0, 0, sizes[si], sizes[si]);
    for (var q = 0.86; q >= 0.4; q -= 0.12) { var d = c.toDataURL('image/jpeg', q); if (d.length <= 70000) return d; }
  }
  return null;
}

var KINDS = {
  likes: {
    get: function () { return { items: liked.slice(0, 1000) }; },
    set: function (d) { liked = d.items || []; store.set('bm_liked', liked); },
    merge: function (a, b) { var seen = {}, out = []; (a.items || []).concat(b.items || []).forEach(function (x) { if (!seen[tid(x)]) { seen[tid(x)] = 1; out.push(x); } }); return { items: out.slice(0, 1000) }; }
  },
  albums: {
    get: function () { return { items: savedAlbums.slice(0, 500) }; },
    set: function (d) { savedAlbums = d.items || []; store.set('bm_albums', savedAlbums); },
    merge: function (a, b) { var seen = {}, out = []; (a.items || []).concat(b.items || []).forEach(function (x) { if (!seen[x.id]) { seen[x.id] = 1; out.push(x); } }); return { items: out.slice(0, 500) }; }
  },
  taste: {
    get: function () { return { artists: taste.artists, genres: taste.genres }; },
    set: function (d) { taste.artists = d.artists || {}; taste.genres = d.genres || {}; store.set(TASTE_KEY, taste); try { localStorage.removeItem(RECS_KEY); } catch (e) {} },
    merge: function (a, b) {      // dos dispositivos que nunca se habían visto: se suman, con el decaimiento aplicado
      var now = Date.now();
      function sum(x, y) { var o = {}; [x || {}, y || {}].forEach(function (m) { Object.keys(m).forEach(function (k) { var e = m[k], v = decayed(e, now); if (o[k]) { o[k].s += v; } else { o[k] = { n: e.n, i: e.i || null, s: v, t: now }; } if (e.i && !o[k].i) o[k].i = e.i; }); }); return o; }
      return { artists: sum(a.artists, b.artists), genres: sum(a.genres, b.genres) };
    }
  },
  prefs: {
    get: function () { return { autoplay: autoplay, vizmode: viz.mode, vizpal: viz.pal, vizcustom: viz.custom, lyrprefs: lyrPrefs }; },
    set: function (d) {
      if (typeof d.autoplay === 'boolean') { autoplay = d.autoplay; store.set('bm_autoplay', autoplay); autoplaySync(); }
      if (VIZ_MODES.indexOf(d.vizmode) >= 0) { viz.mode = d.vizmode; store.set('bm_vizmode', viz.mode); }
      if (VIZ_PAL[d.vizpal]) { viz.pal = d.vizpal; store.set('bm_vizpal', viz.pal); }
      if (d.vizcustom && HEX_RE.test(d.vizcustom.a) && HEX_RE.test(d.vizcustom.b)) vizSetCustom(d.vizcustom.a, d.vizcustom.b);
      if (d.lyrprefs && typeof d.lyrprefs === 'object') { lyrPrefs = d.lyrprefs; store.set('bm_lyrprefs', lyrPrefs); }
      vizBuildUI();
    },
    merge: function (a, b) { var o = {}; for (var k in a) o[k] = a[k]; for (var j in b) if (j !== 'lyrprefs') o[j] = b[j]; var lp = {}; for (var x in (a.lyrprefs || {})) lp[x] = a.lyrprefs[x]; for (var y in (b.lyrprefs || {})) lp[y] = b.lyrprefs[y]; o.lyrprefs = lp; return o; }
  }
};

/* ---------- escribir (local -> nube) ---------- */
function cloudMark(kind) {
  // Called from code that also runs while the page starts, before `cloud` exists.
  if (!cloud || cloud.applying || !cloud.user || cloud.state === 'off') return;
  if (kind !== 'playlists') { cloud.sync.ts[kind] = Date.now(); cloudMeta(); }
  var queued = !!cloud.timers[kind];
  clearTimeout(cloud.timers[kind]);
  cloud.timers[kind] = setTimeout(function () { cloud.timers[kind] = null; cloudPush(kind); }, 1500);
  if (!queued) { cloud.pending++; renderAccount(); }
}
function cloudDone(err) {
  cloud.pending = Math.max(0, cloud.pending - 1);
  if (err) cloudFail(err); else if (cloud.state === 'err' && !cloud.pending) { cloud.state = 'in'; cloud.err = ''; }
  renderAccount();
}
function cloudFail(e) {
  cloud.state = 'err'; cloud.err = e && e.code === 'permission-denied' ? 'perm' : 'other';
  console.warn('[music] cloud sync failed:', e && (e.code || e.message || e));
}
function cloudPush(kind) {
  if (!cloud.user || !cloud.refs) { cloudDone(); return; }
  if (kind === 'playlists') return cloudPushPlaylists();
  var K = KINDS[kind]; if (!K) { cloudDone(); return; }
  var doc = K.get(); doc.updatedAt = cloud.sync.ts[kind] || Date.now();
  cloud.refs.kv.doc(kind).set(doc).then(function () { cloudDone(); }, cloudDone);
}
function cloudPushPlaylists() {
  var ops = [], now = Date.now(), live = {};
  playlists.forEach(function (p) {
    live[p.id] = 1;
    var sig = plSig(p);
    if (cloud.plSig[p.id] === sig) return;
    p.updatedAt = now; cloud.plSig[p.id] = sig;
    ops.push(cloud.refs.pls.doc(p.id).set({ name: p.name, tracks: p.tracks.slice(0, 1000), cover: p.cover || null, updatedAt: now }));
  });
  Object.keys(cloud.plSig).forEach(function (id) { if (!live[id]) { delete cloud.plSig[id]; ops.push(cloud.refs.pls.doc(id).delete()); } });
  if (ops.length) store.set('bm_playlists', playlists);
  Promise.all(ops).then(function () { cloudDone(); }, cloudDone);
}

/* ---------- leer (nube -> local) ---------- */
function cloudOnUser(u) {
  if (!u) {
    var had = cloud.sync.uid;
    cloudDetach(); cloud.user = null; cloud.state = 'off'; cloud.err = '';
    if (had) { cloudClearLocal(); toast(t('acctSignedOut')); }       // no dejar los datos de una cuenta en un equipo compartido
    renderAccount(); return;
  }
  cloud.user = u; cloud.state = 'loading'; renderAccount();
  cloudSync(u).then(function () { cloud.state = cloud.state === 'err' ? 'err' : 'in'; renderAccount(); },
    function (e) { cloudFail(e); renderAccount(); });
}
function cloudSync(u) {
  var uid = u.uid, root = cloud.db.collection('music_profiles').doc(uid);
  cloud.refs = { kv: root.collection('kv'), pls: root.collection('playlists') };
  return Promise.all([cloud.refs.kv.get(), cloud.refs.pls.get()]).then(function (res) {
    var rkv = {}, rpl = {};
    res[0].docs.forEach(function (d) { rkv[d.id] = d.data(); });
    res[1].docs.forEach(function (d) { rpl[d.id] = d.data(); });
    var foreign = !!cloud.sync.uid && cloud.sync.uid !== uid;        // lo que hay aquí es de otra cuenta: se reemplaza, no se mezcla
    var first = cloud.sync.uid !== uid;
    if (foreign) cloudClearLocal();
    cloud.applying = true;
    try {
      Object.keys(KINDS).forEach(function (kind) {
        var K = KINDS[kind], r = rkv[kind], mine = cloud.sync.ts[kind] || 0;
        if (!r) { if (!foreign && first) cloud.sync.ts[kind] = Date.now(); return; }       // la nube no tiene nada: se sube lo local
        if (first && !foreign) { K.set(K.merge(K.get(), r)); cloud.sync.ts[kind] = Date.now(); }  // primera vez: unión
        else if ((r.updatedAt || 0) > mine) { K.set(r); cloud.sync.ts[kind] = r.updatedAt; }       // luego: gana lo más reciente
      });
      var local = {}; playlists.forEach(function (p) { local[p.id] = p; });
      Object.keys(rpl).forEach(function (id) {
        var r = rpl[id], l = local[id];
        if (!l) { var n0 = { id: id, name: r.name, tracks: r.tracks || [], updatedAt: r.updatedAt || 0 }; if (r.cover) n0.cover = r.cover; playlists.push(n0); }
        else if ((r.updatedAt || 0) > (l.updatedAt || 0)) { l.name = r.name; l.tracks = r.tracks || []; l.updatedAt = r.updatedAt; if (r.cover) l.cover = r.cover; else delete l.cover; }
        var p2 = playlists.filter(function (p) { return p.id === id; })[0];
        cloud.plSig[id] = plSig(p2);
      });
      store.set('bm_playlists', playlists);
    } finally { cloud.applying = false; }
    cloud.sync.uid = uid; cloudMeta();
    renderSidebar(); updateNowPlaying(); if (route.name !== 'search') render();
    cloudAttach();
    Object.keys(KINDS).forEach(function (kind) { if (!rkv[kind] || first) cloudMark(kind); });    // sube lo que la nube no tenía o se mezcló
    cloudMark('playlists');
  });
}
function cloudAttach() {
  cloudDetach();
  cloud.unsub.push(cloud.refs.kv.onSnapshot(function (snap) {
    snap.docChanges().forEach(function (c) {
      if (c.type === 'removed' || c.doc.metadata.hasPendingWrites) return;
      var r = c.doc.data(), K = KINDS[c.doc.id];
      if (!K || (r.updatedAt || 0) <= (cloud.sync.ts[c.doc.id] || 0)) return;       // es nuestro eco o algo más viejo
      cloud.applying = true; try { K.set(r); cloud.sync.ts[c.doc.id] = r.updatedAt; cloudMeta(); } finally { cloud.applying = false; }
      if (route.name === 'home' || route.name === 'liked' || route.name === 'library' || route.name === 'albums') render();
    });
  }, function () {}));
  cloud.unsub.push(cloud.refs.pls.onSnapshot(function (snap) {
    var changed = false;
    snap.docChanges().forEach(function (c) {
      if (c.doc.metadata.hasPendingWrites) return;
      var id = c.doc.id, r = c.doc.data(), i = -1;
      playlists.forEach(function (p, k) { if (p.id === id) i = k; });
      if (c.type === 'removed') { if (i >= 0) { playlists.splice(i, 1); delete cloud.plSig[id]; changed = true; } return; }
      if (i >= 0 && (r.updatedAt || 0) <= (playlists[i].updatedAt || 0)) return;
      var np = { id: id, name: r.name, tracks: r.tracks || [], updatedAt: r.updatedAt || 0 };
      if (r.cover) np.cover = r.cover;
      if (i >= 0) playlists[i] = np; else playlists.push(np);
      cloud.plSig[id] = plSig(np); changed = true;
    });
    if (changed) { store.set('bm_playlists', playlists); renderSidebar(); if (route.name === 'library' || route.name === 'playlist') render(); }
  }, function () {}));
}
function cloudDetach() { cloud.unsub.forEach(function (f) { try { f(); } catch (e) {} }); cloud.unsub = []; }

function cloudClearLocal() {
  ['bm_liked', 'bm_albums', 'bm_playlists', 'bm_taste', 'bm_recs', 'bm_recent', 'bm_lyrprefs', 'bm_sync'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
  liked = []; savedAlbums = []; playlists = []; recent = []; lyrPrefs = {};
  taste = { v: 2, artists: {}, genres: {}, seen: [], skips: {} };
  cloud.sync = { uid: null, ts: {} }; cloud.plSig = {};
  renderSidebar(); updateNowPlaying(); render();
}

/* ---------- acciones y vista ---------- */
function cloudSignIn() {
  cloud.state = 'loading'; renderAccount();
  cloudInit().then(function () {
    return cloud.auth.signInWithPopup(new window.firebase.auth.GoogleAuthProvider());
  }).catch(function (e) {
    cloud.state = 'off'; renderAccount();
    if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
    toast(t(cloud.err === 'sdk' ? 'acctSdkFail' : 'acctFail'));
  });
}
function cloudSignOut() { if (cloud.auth) cloud.auth.signOut(); }
function cloudWipe() {
  if (!cloud.user || !confirm(t('acctWipeAsk'))) return;
  var ops = [];
  ['likes', 'albums', 'taste', 'prefs'].forEach(function (k) { ops.push(cloud.refs.kv.doc(k).delete()); });
  cloud.refs.pls.get().then(function (snap) { snap.docs.forEach(function (d) { ops.push(d.ref.delete()); }); return Promise.all(ops); })
    .then(function () { toast(t('acctWiped')); }, function (e) { cloudFail(e); renderAccount(); });
}
function accountHtml() {
  var u = cloud.user;
  if (cloud.state === 'loading' && !u) return '<div class="sub">' + esc(t('acctConnecting')) + '</div>';
  if (!u) return '<div class="sub">' + esc(t('acctPitch')) + '</div><button class="btn" data-acct="in">' + esc(t('acctIn')) + '</button>';
  var st = cloud.state === 'err' ? '<div class="sync err">' + esc(t(cloud.err === 'perm' ? 'acctErrPerm' : 'acctErr')) + '</div>'
    : (cloud.state === 'loading' || cloud.pending) ? '<div class="sync">' + esc(t('acctSyncing')) + '</div>' : '<div class="sync ok">' + esc(t('acctSynced')) + '</div>';
  return '<div class="who">' + (u.photoURL ? '<img class="av" src="' + esc(u.photoURL) + '" alt="" referrerpolicy="no-referrer">' : '<span class="av"></span>') +
    '<div style="min-width:0"><div class="nm">' + esc(u.displayName || t('acctTitle')) + '</div><div class="em">' + esc(u.email || '') + '</div></div></div>' + st +
    '<button class="btn ghost" data-acct="out">' + esc(t('acctOut')) + '</button><button class="linkbtn" data-acct="wipe">' + esc(t('acctWipe')) + '</button>';
}
function renderAccount() {
  var h = accountHtml();
  ['#acct', '#acctLib'].forEach(function (sel) { var el = $(sel); if (el) el.innerHTML = h; });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-acct]');
  if (!b) return;
  var a = b.getAttribute('data-acct');
  if (a === 'in') cloudSignIn(); else if (a === 'out') cloudSignOut(); else if (a === 'wipe') cloudWipe();
});

/* ================= gustos, recomendaciones y autoplay ================= */
// El gusto se guarda AGREGADO (puntaje por artista y por género, con decaimiento), no como historial: sube menos
// datos y es más privado. 'seen' y 'skips' (ids de canciones) se quedan sólo en este navegador.
var HALF_LIFE_MS = 21 * 86400000;     // lo que escuchaste hace tres semanas pesa la mitad
var TASTE_KEY = 'bm_taste', RECS_KEY = 'bm_recs';
var taste = store.get(TASTE_KEY, null);
if (!taste || taste.v !== 2) taste = { v: 2, artists: {}, genres: {}, seen: [], skips: {} };
var autoplay = store.get('bm_autoplay', true);
var browseGenres = {};                // id de canción -> géneros (filas del Home en las que aparece)
var extending = null;
var lis = null;                       // la canción que se está escuchando

function nk(s) { return String(s == null ? '' : s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function primaryArtist(tr) { return String(tr.artist || '').split(/\s*(?:,|&|;|\bfeat\.?|\bft\.?|\bx\b)\s*/i)[0].trim(); }
function decayed(e, now) { return e.s * Math.pow(0.5, (now - e.t) / HALF_LIFE_MS); }
function dayHash(str) {                // 0..1 estable durante un día: el mix cambia mañana, no en cada recarga
  var h = 0, x = str + '|' + new Date().toISOString().slice(0, 10);
  for (var i = 0; i < x.length; i++) h = (h * 31 + x.charCodeAt(i)) >>> 0;
  return (h % 1000) / 1000;
}

var tasteTimer;
function tasteChanged() {
  clearTimeout(tasteTimer);
  tasteTimer = setTimeout(function () { store.set(TASTE_KEY, taste); cloudMark('taste'); if (route.name === 'taste') render(); }, 600);
}
function tasteAdd(tr, w, why) {
  var name = primaryArtist(tr), k = nk(name);
  if (!k || !w) return;
  var now = Date.now();
  // Bitácora de las últimas señales, solo en este navegador (no se sincroniza): es lo que muestra «Tus gustos».
  taste.log = (taste.log || []).concat({ t: now, n: name, w: w, y: why || '', s: tr.title || '' }).slice(-40);
  var a = taste.artists[k] || (taste.artists[k] = { n: name, i: null, s: 0, t: now });
  a.s = decayed(a, now) + w; a.t = now;
  if (tr.artistId) a.i = tr.artistId;
  if (w > 0) (browseGenres[tid(tr)] || []).forEach(function (g) {
    var e = taste.genres[g] || (taste.genres[g] = { s: 0, t: now });
    e.s = decayed(e, now) + w; e.t = now;
  });
  var keys = Object.keys(taste.artists);
  if (keys.length > 120) {
    keys.sort(function (x, y) { return decayed(taste.artists[x], now) - decayed(taste.artists[y], now); });
    keys.slice(0, keys.length - 120).forEach(function (kk) { delete taste.artists[kk]; });
  }
  tasteChanged();
}
function markSeen(tr) {
  var id = tid(tr);
  taste.seen = taste.seen.filter(function (x) { return x !== id; }).concat(id).slice(-150);
}
function tasteScores() {
  var now = Date.now();
  var artists = Object.keys(taste.artists).map(function (k) { var e = taste.artists[k]; return { k: k, n: e.n, id: e.i, s: decayed(e, now) }; })
    .filter(function (a) { return a.s > 0.4; }).sort(function (a, b) { return b.s - a.s; });
  var genres = Object.keys(taste.genres).map(function (g) { return { g: g, s: decayed(taste.genres[g], now) }; })
    .filter(function (g) { return g.s > 0.3; }).sort(function (a, b) { return b.s - a.s; });
  return { artists: artists, genres: genres };
}
// A song stops being listened to: what it meant depends on how long it played and how it ended.
function tasteEnd(reason) {
  if (!lis) return;
  var tr = lis.tr, pos = audio.currentTime || 0;
  var d = (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : tr.duration) || 0;
  lis = null;
  if (reason === 'ended') { tasteAdd(tr, 1.5, 'ended'); markSeen(tr); return; }                 // la escuchó entera
  if (pos >= Math.min(30, d * 0.5 || 30)) { tasteAdd(tr, 1, 'listen'); markSeen(tr); }             // la escuchó de verdad
  else if (pos < 12 && reason === 'skip') { taste.skips[tid(tr)] = (taste.skips[tid(tr)] || 0) + 1; tasteAdd(tr, -0.7, 'skip'); }
}
window.addEventListener('pagehide', function () { tasteEnd('change'); if (tasteTimer) { clearTimeout(tasteTimer); store.set(TASTE_KEY, taste); } });

function indexBrowse(rows) {
  Object.keys(rows || {}).forEach(function (g) {
    (rows[g] || []).forEach(function (tr) { var a = browseGenres[tid(tr)] || (browseGenres[tid(tr)] = []); if (a.indexOf(g) < 0) a.push(g); });
  });
}

/* ---------- candidatos ---------- */
function artistPage(id) { return api('artist/' + encodeURIComponent(id)); }
function similarOf(id) { return api('artist/' + encodeURIComponent(id) + '/similar').then(function (d) { return d.artists || []; }).catch(function () { return []; }); }
function resolveArtistId(a) {          // a: { k, n, id }
  if (a.id) return Promise.resolve(a.id);
  return api('lookup/artist?name=' + encodeURIComponent(a.n)).then(function (d) {
    if (taste.artists[a.k]) { taste.artists[a.k].i = d.id; tasteChanged(); }
    return d.id;
  }).catch(function () { return null; });
}
// Picks n songs from scored candidates: best first, none already in the queue or skipped twice, one version of each
// song, and at most `cap` per artist so one name cannot take the whole list.
function titleKey(tr) { return nk(primaryArtist(tr)) + '|' + nk(String(tr.title).replace(/\(.*?\)|\[.*?\]/g, '')); }
function pickDiverse(pool, n, have, cap) {
  var seen = {}; taste.seen.slice(-40).forEach(function (id) { seen[id] = 1; });
  pool.forEach(function (p) { p.f = p.sc + dayHash(tid(p.tr)) * 0.15 - (seen[tid(p.tr)] ? 0.5 : 0); });
  pool.sort(function (a, b) { return b.f - a.f; });
  var out = [], perA = {}, titles = {};
  pool.forEach(function (p) {
    if (out.length >= n) return;
    var id = tid(p.tr);
    if (have[id] || (taste.skips[id] || 0) >= 2) return;
    var ak = nk(primaryArtist(p.tr)), tk = titleKey(p.tr);
    if (titles[tk] || have['t:' + tk] || (perA[ak] || 0) >= cap) return;   // la misma canción con otro id (single, álbum…) no cuenta como nueva
    titles[tk] = 1; perA[ak] = (perA[ak] || 0) + 1; if (p.why) p.tr._why = p.why; out.push(p.tr);
  });
  return out;
}

/* ---------- "Para ti" ---------- */
function getRecs() {
  var sc = tasteScores(), top = sc.artists.slice(0, 4);
  if (!top.length) return Promise.resolve(null);
  var sig = top.slice(0, 3).map(function (a) { return a.k; }).join(',') + '|' + sc.genres.slice(0, 2).map(function (g) { return g.g; }).join(',');
  var cached = store.get(RECS_KEY, null);
  if (cached && cached.sig === sig && Date.now() - cached.at < 3 * 3600000 && cached.data) return Promise.resolve(cached.data);
  var maxS = top[0].s, topKeys = {};
  top.forEach(function (a) { topKeys[a.k] = 1; });
  return Promise.all(top.map(function (a) {
    return resolveArtistId(a).then(function (id) {
      if (!id) return null;
      return Promise.all([artistPage(id).catch(function () { return null; }), similarOf(id)]).then(function (r) { return { a: a, id: id, page: r[0], sim: r[1] }; });
    });
  })).then(function (parts) {
    parts = parts.filter(Boolean);
    var picks = [];
    parts.slice(0, 3).forEach(function (p) {
      var n = 0;
      p.sim.forEach(function (x) {
        if (n < 2 && !topKeys[nk(x.name)] && !picks.some(function (y) { return y.s.id === x.id; })) { picks.push({ s: x, from: p }); n++; }
      });
    });
    return Promise.all(picks.map(function (x) { return artistPage(x.s.id).catch(function () { return null; }).then(function (pg) { return { x: x, page: pg }; }); })).then(function (simPages) {
      var pool = [], because = {};
      parts.forEach(function (p) {
        var aff = p.a.s / maxS;
        if (p.page) (p.page.tracks || []).forEach(function (tr, i) { pool.push({ tr: tr, sc: 1 * aff - i * 0.03, why: t('whyOwn') + ' ' + p.a.n }); });
      });
      simPages.forEach(function (sp) {
        if (!sp.page) return;
        var aff = sp.x.from.a.s / maxS, list = because[sp.x.from.a.k] || (because[sp.x.from.a.k] = { artist: sp.x.from.a.n, tracks: [] });
        (sp.page.tracks || []).slice(0, 8).forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.6 * aff - i * 0.04, why: t('whySim') + ' ' + sp.x.from.a.n }); list.tracks.push(tr); });
      });
      // exploración: lo más escuchado de tus géneros por artistas que todavía no escuchas
      var explore = api('browse').then(function (d) {
        var known = {}; sc.artists.forEach(function (a) { known[a.k] = 1; });
        sc.genres.slice(0, 2).forEach(function (g) {
          ((d.rows || {})[g.g] || []).filter(function (tr) { return !known[nk(primaryArtist(tr))]; }).slice(0, 8)
            .forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.28 - i * 0.01, why: t('whyExplore') + ' ' + t('g_' + g.g) }); });
        });
      }).catch(function () {});
      return explore.then(function () {
        var mix = pickDiverse(pool, 30, {}, 3);
        var rows = Object.keys(because).map(function (k) { return because[k]; }).map(function (b) {
          var seenT = {}; return { artist: b.artist, tracks: b.tracks.filter(function (tr) { var id = tid(tr); if (seenT[id]) return false; seenT[id] = 1; return true; }).slice(0, 12) };
        }).filter(function (b) { return b.tracks.length >= 4; }).slice(0, 2);
        var cutoff = new Date(Date.now() - 120 * 86400000).toISOString().slice(0, 10), albums = [], aseen = {};
        parts.forEach(function (p) {
          if (!p.page) return;
          (p.page.albums || []).concat(p.page.eps || []).forEach(function (al) { if (al.releaseDate && al.releaseDate >= cutoff && !aseen[al.id]) { aseen[al.id] = 1; albums.push(al); } });
        });
        albums.sort(function (a, b) { return (b.releaseDate || '').localeCompare(a.releaseDate || ''); });
        var artists = parts.filter(function (p) { return p.page && p.page.artist; }).map(function (p) { return { id: p.page.artist.id, name: p.page.artist.name, picture: p.page.artist.picture }; });
        return Promise.all(artists.map(function (a) { return a.picture ? a : findArtistPicture(a).then(function (pic) { a.picture = pic; return a; }); })).then(function (fixed) {
          var data = { mix: mix, because: rows, albums: albums.slice(0, 10), artists: fixed };
          store.set(RECS_KEY, { at: Date.now(), sig: sig, data: data });
          return data;
        });
      });
    });
  });
}

/* ---------- radio y autoplay ---------- */
// Songs that follow `seed`: its artist's best known, similar artists', and a few from what you usually play.
function radioTracks(seed, n) {
  var name = primaryArtist(seed), k = nk(name), sc = tasteScores(), aff = {};
  sc.artists.forEach(function (a) { aff[a.k] = a.s / (sc.artists[0].s || 1); });
  var have = {}; queue.concat([seed]).forEach(function (q) { have[tid(q)] = 1; have['t:' + titleKey(q)] = 1; });
  var ta = taste.artists[k];
  return resolveArtistId({ k: k, n: name, id: seed.artistId || (ta && ta.i) || null }).then(function (id) {
    if (!id) return [];
    return Promise.all([artistPage(id).catch(function () { return null; }), similarOf(id)]).then(function (r) {
      var pool = [];
      if (r[0]) (r[0].tracks || []).forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.9 - i * 0.04 }); });
      var sims = r[1].filter(function (x) { return nk(x.name) !== k; }).slice(0, 5);
      return Promise.all(sims.map(function (x) { return artistPage(x.id).catch(function () { return null; }); })).then(function (pages) {
        pages.forEach(function (pg, si) {
          if (pg) (pg.tracks || []).slice(0, 6).forEach(function (tr, i) { pool.push({ tr: tr, sc: 0.8 - si * 0.04 - i * 0.05 + (aff[nk(primaryArtist(tr))] || 0) * 0.4 }); });
        });
        var rc = store.get(RECS_KEY, null);
        if (rc && rc.data && rc.data.mix) rc.data.mix.slice(0, 8).forEach(function (tr) { pool.push({ tr: tr, sc: 0.55 }); });
        return pickDiverse(pool, n, have, 2);
      });
    });
  }).catch(function () { return []; });
}
function autoFlag(tr) { var s = slim(tr); s.auto = 1; return s; }
// Appends similar songs to the end of the queue; resolves to how many were added. One run at a time.
function autoExtend() {
  if (!autoplay || repeat !== 0) return Promise.resolve(0);
  if (extending) return extending;
  var tr = cur();
  if (!tr) return Promise.resolve(0);
  extending = radioTracks(tr, 12).then(function (list) {
    var have = {}; queue.forEach(function (q) { have[tid(q)] = 1; });
    var add = list.filter(function (x) { return !have[tid(x)]; }).map(autoFlag);
    if (add.length) { queue = queue.concat(add); renderQueue(); }
    return add.length;
  }).catch(function () { return 0; }).then(function (n) { extending = null; return n; });
  return extending;
}
function startRadio(tr) {
  toast(t('radioLoading'));
  radioTracks(tr, 24).then(function (list) {
    if (!list.length) { toast(t('radioNone')); return; }
    playList([tr].concat(list), 0);
    queue = queue.map(function (q, i) { if (i > 0) q.auto = 1; return q; }); renderQueue();
  });
}

}
