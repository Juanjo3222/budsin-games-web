<canvas id="canvas" tabindex="-1"></canvas>
<div id="input-container"><textarea id="input-textarea" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><input id="input-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false"></div>
<div class="hud"><span id="server"></span><span id="proxyenabled"></span></div>

<div id="loading-overlay" role="status" aria-busy="true">
  <div id="loading-background-image"></div>
  <div class="loading-card">
    <div id="loading-icon-shell"><img id="loading-experience-icon" alt=""></div>
    <h1 id="loading-experience-title">WebBlox</h1>
    <p id="loading-experience-creator"><span id="loading-verified-badge"></span></p>
    <div id="status" data-t="connecting">Conectando con Roblox…</div>
    <div class="loading-error-panel" hidden>
      <h2 id="loading-error-title"></h2>
      <div id="loading-error-message"></div>
      <div id="loading-error-code"></div>
      <button class="btn secondary" id="loading-error-leave" type="button" data-t="back">Volver a WebBlox</button>
    </div>
    <button class="btn secondary" id="loading-cancel" type="button" data-t="back">Volver a WebBlox</button>
  </div>
</div>

<div id="gate"><div class="box"><h1 id="gate-title"></h1><p id="gate-msg"></p><p><a id="gate-link" href="./"></a></p></div></div>

<script type="module" src="player.js"></script>
<script src="https://games.budsin.dev/classroom-hotkey.js"></script>
