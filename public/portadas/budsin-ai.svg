<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Budsin AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b1d"/>
      <stop offset="1" stop-color="#1a0f3d"/>
    </linearGradient>
    <radialGradient id="orb" cx=".34" cy=".28" r=".95">
      <stop offset="0" stop-color="#d9fff6"/>
      <stop offset=".22" stop-color="#58e8d0"/>
      <stop offset=".6" stop-color="#6f5cf0"/>
      <stop offset="1" stop-color="#2a1363"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#8a6bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9f87ff" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4be3c8" stop-opacity="0"/>
      <stop offset=".25" stop-color="#4be3c8"/>
      <stop offset=".75" stop-color="#b08cff"/>
      <stop offset="1" stop-color="#b08cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4be3c8"/>
      <stop offset="1" stop-color="#b08cff"/>
    </linearGradient>
    <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- aurora -->
  <g filter="url(#blur60)">
    <circle cx="110" cy="80" r="130" fill="#17d7b8" fill-opacity=".34"/>
    <circle cx="560" cy="320" r="150" fill="#d046b8" fill-opacity=".30"/>
    <circle cx="540" cy="60" r="120" fill="#4a6bff" fill-opacity=".34"/>
    <circle cx="90" cy="340" r="110" fill="#6a3df0" fill-opacity=".28"/>
  </g>
  <!-- estrellitas -->
  <g fill="#fff">
    <circle cx="64" cy="62" r="1.8" fill-opacity=".7"/><circle cx="168" cy="40" r="1.3" fill-opacity=".5"/>
    <circle cx="486" cy="44" r="1.6" fill-opacity=".6"/><circle cx="590" cy="150" r="1.4" fill-opacity=".5"/>
    <circle cx="52" cy="206" r="1.4" fill-opacity=".45"/><circle cx="604" cy="262" r="1.8" fill-opacity=".6"/>
    <circle cx="140" cy="262" r="1.2" fill-opacity=".4"/><circle cx="522" cy="226" r="1.3" fill-opacity=".45"/>
    <circle cx="256" cy="34" r="1.1" fill-opacity=".45"/><circle cx="410" cy="30" r="1.1" fill-opacity=".4"/>
  </g>
  <!-- halo del orbe -->
  <circle cx="320" cy="164" r="104" fill="#7b61ff" fill-opacity=".55" filter="url(#blur14)"/>
  <!-- anillo (parte de atrás) -->
  <g transform="rotate(-16 320 170)">
    <ellipse cx="320" cy="170" rx="158" ry="40" fill="none" stroke="url(#ring)" stroke-width="3.4" stroke-opacity=".55"/>
  </g>
  <!-- orbe -->
  <circle cx="320" cy="164" r="88" fill="url(#orb)"/>
  <circle cx="320" cy="164" r="88" fill="url(#rim)"/>
  <!-- reflejo -->
  <ellipse cx="286" cy="122" rx="34" ry="19" fill="#fff" fill-opacity=".34" transform="rotate(-28 286 122)" filter="url(#blur2)"/>
  <!-- destello dentro del orbe -->
  <path d="M338 128 C341 154 350 163 372 167 C350 171 341 180 338 206 C335 180 326 171 304 167 C326 163 335 154 338 128 Z" fill="#fff" fill-opacity=".95"/>
  <path d="M286 184 C287 191 290 194 297 195 C290 196 287 199 286 206 C285 199 282 196 275 195 C282 194 285 191 286 184 Z" fill="#fff" fill-opacity=".8"/>
  <!-- anillo (parte de delante, pasa por encima del orbe) -->
  <g transform="rotate(-16 320 170)">
    <path d="M162 170 A158 40 0 0 0 478 170" fill="none" stroke="url(#ring)" stroke-width="4.2" stroke-linecap="round"/>
  </g>
  <!-- chispas del anillo -->
  <path d="M476 126 C477 134 480 137 488 138 C480 139 477 142 476 150 C475 142 472 139 464 138 C472 137 475 134 476 126 Z" fill="#fff" fill-opacity=".95"/>
  <path d="M166 214 C167 220 169 222 175 223 C169 224 167 226 166 232 C165 226 163 224 157 223 C163 222 165 220 166 214 Z" fill="#4be3c8"/>
  <!-- nombre -->
  <text x="320" y="334" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing=".5" fill="#fff">Budsin <tspan fill="url(#word)">AI</tspan></text>
</svg>
