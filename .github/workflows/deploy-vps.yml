name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, budsin-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy public files locally
        run: |
          sudo rsync -a --delete public/ /var/www/budsin-games-web/public/
          sudo systemctl reload caddy

      - name: Clean runner workspace
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* || true
