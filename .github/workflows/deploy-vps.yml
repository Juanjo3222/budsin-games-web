name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, budsin-vps]
    steps:
      - name: Deploy public files locally
        run: |
          set -eu
          deploy_dir=/home/github-runner/budsin-deploy
          target=/var/www/budsin-games-web/public
          if [ ! -d "$deploy_dir/.git" ]; then
            mkdir -p "$deploy_dir"
            git clone --filter=blob:none --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$deploy_dir"
          fi
          cd "$deploy_dir"
          git fetch --filter=blob:none origin main
          new_sha=$(git rev-parse origin/main)
          old_sha=$(cat .deploy-sha 2>/dev/null || git rev-parse HEAD 2>/dev/null || true)
          if [ "$old_sha" = "$new_sha" ]; then
            echo "No source changes to deploy"
          else
            if [ -z "$old_sha" ]; then
              echo "Initial deployment requires a complete public tree"
              rm -rf /tmp/deploy-full
              mkdir -p /tmp/deploy-full
              git sparse-checkout set public
              git read-tree -mu "$new_sha"
              sudo rsync -a --delete public/ "$target/"
              rm -rf /tmp/deploy-full
            else
              # El runner solo tiene sudo sin contraseña para rsync, rm y systemctl: se prepara todo en un
              # directorio temporal (sin sudo, con la estructura de public/) y se copia con un único rsync.
              # -z: nombres separados por NUL, así los archivos con acentos o espacios no llegan entrecomillados.
              # --chmod fija 755/644 y sin -p ni -o la carpeta raíz del destino conserva sus permisos.
              stage=$(mktemp -d)
              while IFS= read -r -d '' path; do
                rel="${path#public/}"
                if git cat-file -e "$new_sha:$path" 2>/dev/null; then
                  mkdir -p "$stage/$(dirname "$rel")"
                  git show "$new_sha:$path" > "$stage/$rel"
                else
                  sudo rm -rf "$target/$rel"
                fi
              done < <(git diff-tree -z --no-commit-id --name-only -r "$old_sha" "$new_sha" -- public/)
              sudo rsync -rt --no-owner --no-group --chmod=D755,F644 "$stage/" "$target/"
              rm -rf "$stage"
            fi
          fi
          sudo systemctl reload caddy
          printf '%s\n' "$new_sha" > .deploy-sha
